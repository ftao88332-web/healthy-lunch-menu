}

/* 详情页要显示 YouTube / 原站链接，得再取一次详情。
   按「当前展示的候选 id」判断是否已取过，切天会自动重取。

   ⚠️ 这里踩过**同一类 bug 的第二次**（第一次见 state.imgSrc）：
     守卫原来是 `state.view !== 'day'`，但 2026-10-09 首页改版后
     首页**就是**当日菜谱全文，`state.view` 只剩 `home|shop|setup`，
     再也没有 `'day'` 这个值了 → 判断恒真 → 这个函数**永远提前返回** →
       「YouTube 演示」「菜谱原始出处」两个链接**从来就没被取到过**。
     同理，`state.dayId` 首屏是 null（用户没点过星期按钮），
     直接 `day(plan, null)` 拿到 undefined，也一样是静默不取。
     所以：视图判 `home`，日期一律走 `selectedDayId()`（与首页渲染同一套优先级）。 */
let detBusy = false;
async function ensureRealDetail() {
  if (USE_BACKEND || state.view !== 'home' || detBusy) return;
  const d = day(state.plan, selectedDayId());
  const pick = realCurrent(d);
  if (!pick || (d.real.det && d.real.det.id === pick.id)) return;
  detBusy = true;
  try { await lookupRealDetail(d); writeMenus(); }
  finally { detBusy = false; }
  render();
}

/* 当前该用哪条 TheMealDB 候选 —— 没有候选就返回 null。
   ⚠️ realPick() / realMiss() 已随「真实照片」功能一起删除（2026-10-09）：
      前者决定用 TheMealDB 的哪张实拍图，后者判断「查过但没有同做法」时怎么兜底说明。
      现在 d.real 只服务「做法链接」，所以只剩下「取当前候选」这一件事。 */
function realCurrent(day) {
  const r = day && day.real;
  if (!r || !r.list || !r.list.length) return null;
  return r.list[Math.min(Math.max(r.i || 0, 0), r.list.length - 1)] || null;
}

/* =========================================================================
   4. 状态
   ========================================================================= */
const state = {
  view: 'home',
  /* 首页当前显示哪一天（顶栏「周一到周五」按钮改的就是它）。
     null = 还没点过，自动落到「今天」。 */
  homeDay: null,
  plan: 'A',
  dayId: null,
  menus: {},        // plan -> {plan,name,desc,servings,days:[...]}
  imgs: {},         // 仅后端模式：`${plan}:${dayId}` -> {url, ts}（签名链接要判过期）
  /* 仅直连模式：AI 配图的本地缓存，键见 imgCacheKey()。
     值是 {u: 图片链接, d: 压好的 data URL（可选）, t: 生成时间} ——
     链接会过期，data URL 不会，所以能压就压。 */
  imgCache: {},
  /* ⚠️ 这里原本是「配图来源」开关（'real' = TheMealDB 实拍 / 'ai' = AI 生成）。
     用户 2026-10-09 明确要求下线真实照片 → 配图一律 AI，state.imgSrc 整个删掉。
     要恢复的话：TheMealDB 的匹配规则与打分都还在（REFERENCE §五）。 */
  /* 步骤配图：true = 「详细做法」每一步配一张示意图（默认）。
     只在打开详情页时按需生成，不影响首页，也不影响生成菜单的耗时。 */
  stepImg: true,
  /* 步骤配图的本地缓存，键见 stepCacheKey()。
     ⚠️ 与 imgCache **分开存**：步骤图张数是菜图的 6 倍，
        混在一个 LRU 里会把刚出好的菜图挤出去，下次渲染又白出一张。 */
  stepCache: {},
  sheet: null,      // {mode, dayId, idx, cat, sub, kw, list}
  busy: null,       // {title, msg, pct, err, note}
  toast: null,
  /* 采购清单要汇总哪几天：null / 空数组 = 全部；
     否则是选中的 dayId 数组。采购常常只买一两天，写死整周并不好用。 */
  shopDays: null,
  /* 采购清单按几人份算：null = 跟随菜单里存的份数（通常是 16）；
     非空则是用户在采购页临时调的 —— 只影响采购量，不改菜谱本身。 */
  shopServ: null,
  /* 忌口 / 过敏源，值见 AVOID_OPTS。影响①生成提示词 ②首页筛选 */
  avoid: [],
  /* 每日热量目标，'all' 或 KCAL_BANDS 里的 k */
  kcalTarget: 'all',
  /* 首页筛选条（纯展示层，不改菜谱本身） */
  fMeat: 'all',
  fKcal: 'all',
  hideAvoid: false,
  /* 食材参考价（AI 联网估算的「元/500g」），键是食材名，落 localStorage。
     ⚠️ 只是参考价，不是实时报价 —— 界面上必须写明。 */
  prices: {},
  /* 「去别的平台比价」浮层当前显示的食材名；null = 不显示 */
  pricePop: null,
  /* 首次免责提示是否已读 */
  seen: true,
  /* 上一次生成失败的人话说明。非空时首页顶部显示常驻提示条 ——
     否则用户把进度浮层一关，界面上就完全看不出「刚才失败了」。
     下次开始生成时清空，成功/失败都会重新赋值。 */
  lastErr: null
};
let toastTimer = null;

function readLS() {
  try {
    const p = localStorage.getItem(LS.plan); if (p && PLANS[p]) state.plan = p;
    const m = JSON.parse(localStorage.getItem(LS.menus) || '{}'); if (m && typeof m === 'object') state.menus = m;
    const i = JSON.parse(localStorage.getItem(LS.imgs) || '{}'); if (i && typeof i === 'object') state.imgs = i;
    const av = JSON.parse(localStorage.getItem(LS.avoid) || '[]');
    if (Array.isArray(av)) state.avoid = av.filter((x) => AVOID_LABEL[x]);
    const hd = localStorage.getItem(LS.homeday); if (hd) state.homeDay = hd;
    const pr = JSON.parse(localStorage.getItem(LS.price) || '{}');
    if (pr && typeof pr === 'object') {
      Object.keys(pr).forEach((k) => {
        const v = Number(pr[k]);
        if (k && isFinite(v) && v > 0) state.prices[k] = Math.round(v * 10) / 10;
      });
    }
    const kt = localStorage.getItem(LS.kcaltgt);
    if (kt && KCAL_BANDS.some((b) => b.k === kt)) state.kcalTarget = kt;
    state.seen = localStorage.getItem(LS.seen) === '1';
    const c = JSON.parse(localStorage.getItem(LS.imgcache) || '{}');
    if (c && typeof c === 'object') state.imgCache = c;
    const si = localStorage.getItem(LS.stepimg);
    if (si === '0' || si === '1') state.stepImg = (si === '1');
    const sc = JSON.parse(localStorage.getItem(LS.stepcache) || '{}');
    if (sc && typeof sc === 'object') state.stepCache = sc;
  } catch (e) { /* 隐私模式下 localStorage 可能不可用，忽略即可 */ }
}
function writeMenus() { try { localStorage.setItem(LS.menus, JSON.stringify(state.menus)); } catch (e) {} }
function writeImgs()  { try { localStorage.setItem(LS.imgs,  JSON.stringify(state.imgs));  } catch (e) {} }
/* 配图缓存可能很大（data URL 一条几十 KB），单独写、单独兜底 */
/* ⚠️ **不要每生成一张图就把整个缓存写一遍 localStorage。**
   stepCache 最多 36 条 × ~50KB ≈ 1.8MB；每张图都 JSON.stringify 一遍再写盘，
   等于把 1.8MB 反复序列化几十次，主线程被拖成幻灯片 ——
   这是「网页延迟也很高」的另一个主要来源（另一个是步骤图一次性排队）。

   所以 writeImgCache / writeStepCache 这两个**名字保持不变**（调用点不用动），
   但实现改成「合并写入」：改完 700ms 内没有新改动才真正落盘；
   图片队列排空（pumpImages 结束）时立刻 flush，保证切页/关页不丢数据。 */
let cacheTimer = null;
function scheduleCacheWrite() {
  if (cacheTimer) return;
  cacheTimer = setTimeout(() => { cacheTimer = null; writeImgCacheNow(); writeStepCacheNow(); }, 700);
}
function flushCacheWrites() {
  if (cacheTimer) { clearTimeout(cacheTimer); cacheTimer = null; }
  writeImgCacheNow();
  writeStepCacheNow();
}
/* 关页 / 切到后台时补一次，别把刚生成的图丢掉 */
try { window.addEventListener('pagehide', flushCacheWrites); } catch (e) {}

function writeImgCache() { scheduleCacheWrite(); }
function writeStepCache() { scheduleCacheWrite(); }

function writeImgCacheNow() {
  try { localStorage.setItem(LS.imgcache, JSON.stringify(state.imgCache)); }
  catch (e) {
    /* 多半是 localStorage 写满了 —— 把最旧的离线副本丢掉再存一次，
       链接还留着，不至于整个功能挂掉。 */
    const keys = Object.keys(state.imgCache)
      .sort((a, b) => (state.imgCache[a].t || 0) - (state.imgCache[b].t || 0));
    keys.slice(0, Math.max(1, Math.ceil(keys.length / 2)))
      .forEach((k) => { state.imgCache[k].d = ''; });
    try { localStorage.setItem(LS.imgcache, JSON.stringify(state.imgCache)); } catch (e2) {}
  }
}
/* 步骤图缓存比菜图缓存更容易把 localStorage 写满（一张 ~50KB × 最多 36 张）。
   写不下就把最旧的一半的离线副本（data URL）丢掉，链接还留着 —— 功能不会整个挂掉。 */
function writeStepCacheNow() {
  try { localStorage.setItem(LS.stepcache, JSON.stringify(state.stepCache)); }
  catch (e) {
    const keys = Object.keys(state.stepCache)
      .sort((a, b) => (state.stepCache[a].t || 0) - (state.stepCache[b].t || 0));
    keys.slice(0, Math.max(1, Math.ceil(keys.length / 2)))
      .forEach((k) => { state.stepCache[k].d = ''; });
    try { localStorage.setItem(LS.stepcache, JSON.stringify(state.stepCache)); } catch (e2) {}
  }
}
function writePlan()  { try { localStorage.setItem(LS.plan,  state.plan); } catch (e) {} }
/* 参考价缓存很小（几十条），直接整体写 */
function writePrices() { try { localStorage.setItem(LS.price, JSON.stringify(state.prices)); } catch (e) {} }

/* 当前方案的数据：优先生成的，没有就用内置离线保底 */
function menu(plan) {
  plan = plan || state.plan;
  return state.menus[plan] || FALLBACK[plan] || null;
}
function day(plan, id) {
  const m = menu(plan);
  return m ? (m.days || []).find((d) => d.id === id) || null : null;
}
function isFallback(plan) { return !state.menus[plan || state.plan] && !!FALLBACK[plan || state.plan]; }

function imgUrl(plan, dayId) {
  const d = day(plan, dayId);
  if (!d) return '';
  /* ⚠️ 真实照片（TheMealDB 实拍）已于 2026-10-09 按用户要求下线 ——
     配图只有 AI 一种，这里不再有「命中真实照片就用它的图」的分支。
     TheMealDB 仍在查（见 lookupRealDish），但产物只用于生成「做法链接」。 */
  /* 直连模式 · AI 图：**生成菜单的那一刻配图就已经在做了**，不需要用户再点。
     地址来自本地缓存（imgCache）：有就直接显示，没有就先占位，
     由串行队列去 SiliconFlow 现生成一张再换上来。 */
  if (!USE_BACKEND) return imgUrlFor(d);
  /* 后端模式：菜单里自带 img_key，配图已随镜像烘焙在容器里，
     直接拼地址即可 —— 不走签名、不会过期、也不花钱。 */
  const rec = state.imgs[plan + ':' + dayId];
  if (rec && rec.url && Date.now() - rec.ts < IMG_TTL) return rec.url;
  if (d && d.img_key) return backendUrl('/api/image/' + d.img_key + '.png');
  return '';
}
function thumbUrl(dayObj) {
  return THUMBS[dayObj.type] || '';
}

/* =========================================================================
   5. 渲染
   ========================================================================= */
function toast(msg) {
  state.toast = msg;
  renderLayers();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; renderLayers(); }, 2600);
}

function navHTML() {

    '<button data-nav="' + n.k + '" class="' + (state.view === n.k ? 'on' : '') + '">' + n.t + '</button>'
  ).join('');
}

/* ---------- 顶栏「周一到周五」切换 + 首页当前展示哪一天 ---------- */

/* 手机窄屏只显示一个字，省出来的宽度留给 logo 和「生成本周菜单」 */
const WEEK_ABBR = { mon: '一', tue: '二', wed: '三', thu: '四', fri: '五' };

function daysOf(plan) {
  const m = menu(plan || state.plan);
  return (m && m.days) || [];
}

/* 今天是菜单里的哪一天（周末落到周一）。首页的「今日」角标和顶栏的
   小圆点都用它，避免两处各算一遍、算法还不一样。 */
function todayIdOf() {
  const ds = daysOf(state.plan);
  if (!ds.length) return null;
  return ds[Math.min(todayIdx(), ds.length - 1)].id;
}

/* 首页当前展示哪一天：state.homeDay 优先（用户点过星期按钮），
   其次 state.dayId（老代码 / 外部调用只设这个），否则自动落到「今天」—— 周末落到周一。 */
function selectedDayId() {
  const ds = daysOf(state.plan);
  if (!ds.length) return null;
  const want = state.homeDay || state.dayId;
  if (want && ds.some((d) => d.id === want)) return want;
  return ds[Math.min(todayIdx(), ds.length - 1)].id;
}

function writeHomeDay() {
  try { localStorage.setItem(LS.homeday, state.homeDay || ''); } catch (e) {}
}

/* 还没生成菜单时也把五个按钮画出来 —— 否则用户根本不知道有这个功能。
   点了会落到「还没有菜谱」的空态 + 生成按钮，不会白屏。 */
function weekNavHTML() {
  const ds = daysOf(state.plan);
  const cur = selectedDayId();
  const list = ds.length ? ds : DAY_PLAN.map((m) => ({ id: m.id, wk: m.wk, title: '' }));
  const todayId = ds.length ? ds[Math.min(todayIdx(), ds.length - 1)].id : null;
  return list.map((d) => {
    const on = d.id === cur;
    return '<button data-act="day" data-arg="' + esc(d.id) + '"' +
      (on ? ' class="on' + (d.id === todayId ? ' today' : '') + '"'
          : (d.id === todayId ? ' class="today"' : '')) +
      ' aria-current="' + (on ? 'true' : 'false') + '"' +
      ' title="' + esc(d.wk + (d.title ? ' · ' + d.title : ' 还没生成')) + '">' +
      '<span class="fw">' + esc(d.wk) + '</span>' +
      '<span class="fn">' + esc(WEEK_ABBR[d.id] || d.wk.slice(-1)) + '</span>' +
      '</button>';
  }).join('');
}


function phHTML(type, size) {
  const s = size || 96;
  return '<div class="ph"><svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="rgba(255,255,255,.55)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="' + (ICONS[type] || ICONS.veg) + '"/></svg></div>';
}

function todayIdx() {
  const d = new Date().getDay();          // 0=周日
  return d >= 1 && d <= 5 ? d - 1 : 0;
}

function metric(v, u, l) {
  const val = (typeof v === 'number') ? (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10) : v;
  return '<div class="m"><div class="v">' + esc(val) + '<span class="u">' + u + '</span></div>' +
    '<div class="l">' + l + '</div></div>';
}

function dayCard(d, i) {
  /* data-src 只表示「AI 图地址」；还没生成好就是空串 —— 这时先挂本地占位图，
     由串行队列按 data-day 去 SiliconFlow 现生成一张再淡入。
     ⚠️ 千万别把 data-src 写成 `imgUrl(...) || thumbUrl(d)`：那样它永远非空，
     队列会以为「已经有地址了」而只加载本地占位图，配图就永远不更新。
     （显示用的 src 走 imgDisplaySrc：命中缓存就直接显示真图，一点都不闪。） */
  const src = imgUrl(state.plan, d.id);
  const isToday = i === todayIdx();
  return '<button class="day' + (isToday ? ' is-today' : '') +'" data-act="open" data-arg="' + d.id + '">' +
    '<div class="thumb"' + (thumbUrl(d) ? ' style="background-image:url(' + esc(thumbUrl(d)) + ')"' : '') + '>' +
      (thumbUrl(d) ? '<img src="' + esc(imgDisplaySrc(src, thumbUrl(d))) + '" data-src="' + esc(src) + '" data-day="' + esc(d.id) + '" alt="" loading="lazy">' : phHTML(d.type, 56)) +
      '<span class="tag">' + esc(d.tn) + '</span>' +
      (isToday ? '<span class="today">今天</span>' : '') +
    '</div>' +
    '<div class="body">' +
      '<div class="wk">' + esc(d.wk) + ' · ' + esc(d.en) + '</div>' +
      '<div class="title">' + esc(d.title) + '</div>' +
      '<div class="sub">' + esc(d.sub || '') + '</div>' +
      /* 三个关键数字：热量 / 蛋白质 / 膳食纤维。数字大、单位小、标签最弱。
         ⚠️ 做法标签的 class 必须叫 .mtag —— .tag 是左上角那个荤菜标签，
         test_web.js 有「.day .tag 恰好 5 个且顺序为 鱼,虾,鸡肉,牛肉,猪肉」的硬断言。 */
      '<div class="dstat">' +
        '<div class="s"><div class="v">' + esc(Math.round(num(d.kcal))) +
          '<span class="u">kcal</span></div><div class="l">热量</div></div>' +
        '<div class="s"><div class="v">' + esc(r1(num(d.p))) +
          '<span class="u">g</span></div><div class="l">蛋白质</div></div>' +
        '<div class="s"><div class="v">' + esc(r1(num(d.fb))) +
          '<span class="u">g</span></div><div class="l">膳食纤维</div></div>' +
      '</div>' +
      '<div class="dmeta">' +
        (d.method ? '<span class="mtag">' + esc(String(d.method).split('·')[0].trim()) + '</span>' : '') +
        /* time 是后加的字段，老菜单没有就不显示，绝不编一个数字 */
        (d.time ? '<span class="mtag time">约 ' + esc(d.time) + ' 分钟</span>' : '') +
      '</div>' +
    '</div></button>';
}

function renderHome() {
  const planKeys = Object.keys(PLANS).length ? Object.keys(PLANS) : Object.keys(FALLBACK);
  const d = day(state.plan, selectedDayId());
  if (!d) { renderHomeEmpty(); return; }
  /* 正在看的就是今天吗？是的话加「今日」角标 + 大图描边 */
  const isToday = d.id === todayIdOf();
  /* 同 dayCard：src 只表示 AI 图地址，空串时用本地占位图顶上 */
  const src = imgUrl(state.plan, d.id);
  const serv = d.servings || COMPANY;
  const baseTotal = num(d.total_g) || (d.ing || []).reduce((s, i) => s + num(i.g), 0);
  const aiImg = !!imgUrl(state.plan, d.id);
  /* ⚠️ 真实照片（TheMealDB 实拍）已下线：配图只有 AI 一种，所以这里不再有

  html += '<div>';

    (thumbUrl(d) ? ' style="background-image:url(' + esc(thumbUrl(d)) + ')"' : '') + '>' +

     以及候选翻页按钮「换一张真实照片」—— 用户明确要求下线真实照片，整块已删除。 */

  /* 忌口提示：原来是首页周视图的筛选条在提示「哪几天撞了忌口」。

  html += '<div class="nutri">' +

function ncell(v, u, l, tip) {
  const val = (typeof v === 'number') ? (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10) : v;
  /* tip 走原生 title：悬停能看解释，读屏也能念出来（aria-label）。
     不做自定义 tooltip —— 那要额外处理定位、焦点、触摸，收益不抵复杂度。
     ⚠️ title 也要带上指标名（「蛋白质：…」）：光写解释，鼠标停在「碳水」上
        弹出一句「主要来自全谷物…」，用户得自己把两边对起来；而且工具提示是
        脱离上下文单独出现的，不自报家门就说不清在解释什么。 */
  const t = tip
    ? ' title="' + esc(l + '：' + tip) + '" aria-label="' + esc(l + '：' + tip) + '"'
    : '';
  return '<div class="n"' + t + '><div class="v">' + esc(val) +
    '<span class="u">' + u + '</span></div>' +
    '<div class="l">' + l + '</div></div>';
}

   所以只能给「官方入口」，让用户点进去自己搜 —— 绝不能伪造成「搜索深链」，那是假链接。

     · 多多买菜 mobile.yangkeduo.com       search_result.html 直接跳登录页
   这四个入口都实测「能打开」，这是能给的最诚实的东西。 */
const PRICE_PLATFORMS = [
  { k:'hema',   n:'盒马',     u:'https://www.freshippo.com/',        t:'官网 · 在 App 内搜索' },
  { k:'dmall',  n:'多点',     u:'https://i.dmall.com/newDmall.html', t:'H5 · 需登录' },

/* 参考价统一按「元/500g」（也就是常说的「一斤」），最符合买菜习惯 */
function priceOf(name) {
  const p = state.prices ? state.prices[name] : null;
  return (typeof p === 'number' && isFinite(p) && p > 0) ? p : null;
}
function priceMoney(v) { return v == null ? '—' : (v >= 100 ? v.toFixed(0) : v.toFixed(1)); }
/** 参考小计（元）：单价 × 总克重 ÷ 500 */
function priceSubtotal(name, grams) {
  const p = priceOf(name);
  return p == null ? null : (p * num(grams) / 500);
}
/* ⚠️ 调味料不计价：按「元/500g」给一撮盐、几滴橄榄油估价毫无意义
   （一瓶能用一年），算进去只会把合计虚高 —— 实测 38 项里 14 项是调味料，
   能把合计从 ~¥2400 抬到 ¥3438。所以只对**能吃的食材**估价。 */
function priceItems(items) { return (items || []).filter((i) => i.c !== 'season'); }
/** 汇总：{sum 合计元, known 已估项数, miss 未估项数}（只看非调味料） */
function priceTotal(items, serv) {
  const list = priceItems(items);
  let sum = 0, known = 0;
  list.forEach((i) => {
    const s = priceSubtotal(i.n, i.per * serv);
    if (s == null) return;
    sum += s; known++;
  });
  return { sum: sum, known: known, miss: list.length - known };
}
/** 模型偶尔会把食材名改短（「青花鱼（鲭鱼，净肉）」→「青花鱼」），按「核心名」兜一次 */
function pickPrice(want, table) {
  if (table[want] != null) return table[want];
  const cw = coreName(want);
  const keys = Object.keys(table);
  let k = keys.filter((x) => coreName(x) === cw)[0];
  if (k) return table[k];
  k = keys.filter((x) => want.indexOf(x) === 0 || x.indexOf(cw) === 0)[0];
  return k ? table[k] : null;
}

/** 复制一段文字（⚠️ file:// 下 navigator.clipboard 常不可用，必须有 execCommand 兜底） */
function copyText(txt, doneMsg) {
  const ok = () => toast(doneMsg || '已复制');
  const fail = () => toast('复制失败，请手动长按选择文字');
  const legacy = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, txt.length);
      const good = document.execCommand('copy');
      document.body.removeChild(ta);
      if (good) ok(); else fail();
    } catch (e) { fail(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(ok, legacy);
  } else legacy();
}

/** 直连模式走 chatJson；后端模式走 /api/price（后端同样用联网检索） */
async function fetchPricesVia(names) {
  const table = {};
  let sources = [];
  if (USE_BACKEND) {
    const d = await request('/api/price', 'POST', { names: names });
    ((d && d.items) || []).forEach((it) => {
      const n = String((it && it.n) || '').trim();
      const v = Number(it && it.p);
      if (n && isFinite(v) && v > 0) table[n] = v;
    });
    sources = (d && d.sources) || [];
  } else {
    const r = await chatJson(PRICE_SYSTEM, buildPricePrompt(names), { search:true, temperature:0.2 });
    const arr = (r.json && (r.json.items || r.json.prices || r.json.list)) || [];
    arr.forEach((it) => {
      if (!it) return;
      const n = String(it.n || it.name || '').trim();
      const raw = (it.p != null) ? it.p : it.price;
      const v = Number(raw);
      if (n && isFinite(v) && v > 0) table[n] = v;
    });
    sources = r.sources || [];
  }
  return { table: table, sources: sources };
}

/** 联网获取参考价。默认只补「还没估过的」；全都有值时点一下＝整体刷新。 */
async function doFetchPrices(force) {
  const { items } = shopData();
  if (!items.length) { toast('采购清单还是空的，先生成菜单'); return; }
  const all = priceItems(items).map((i) => i.n);
  const missing = all.filter((n) => priceOf(n) == null);
  const need = (missing.length && !force) ? missing : all;
  if (!need.length) return;

  busy('获取参考价', '正在联网检索 ' + need.length + ' 项食材的参考价…', 15);
  try {
    const r = await fetchPricesVia(need);
    let got = 0;
    need.forEach((n) => {
      const v = pickPrice(n, r.table);
      if (v != null) { state.prices[n] = Math.round(v * 10) / 10; got++; }
    });
    writePrices();
    state.busy = null;
    render();
    toast(got ? ('已更新 ' + got + '/' + need.length + ' 项参考价（AI 估算，非实时）')
              : '没拿到参考价，稍后再试');
  } catch (e) {
    busyErr(e);
  }
}

/* ---------- 采购清单 ---------- */
/** 采购清单当前选中的天（返回实际的 day 对象数组） */
function shopPicked() {
  const all = (menu(state.plan) || {}).days || [];
  const sel = state.shopDays;
  if (!sel || !sel.length) return all;
  return all.filter((d) => sel.indexOf(d.id) >= 0);
}

/* 采购清单实际按几人份算：用户在采购页调过就用他调的，否则跟随菜单里存的份数 */
function shopServings(days) {
  if (state.shopServ != null) return state.shopServ;
  return (days && days.length) ? (days[0].servings || COMPANY) : COMPANY;
}

function shopData() {
  const m = menu(state.plan);
  const days = shopPicked();
  const serv = shopServings(days);
  const map = {};
  days.forEach((d) => {
    (d.ing || []).forEach((it) => {
      const k = it.c + '|' + it.n;
      if (!map[k]) map[k] = { c: it.c, n: it.n, note: it.note || '', per: 0, days: [] };
      map[k].per += num(it.g);
      map[k].days.push(d.wk);
    });
  });
  return { serv, items: Object.keys(map).map((k) => map[k]) };
}

        '<option value="' + c + '"' + (s.custom && s.custom.c === c ? ' selected' : '') + '>' +
        ((CAT_STYLE[c] || {}).label || c) + '</option>').join('') + '</select>' +
      '<button class="btn sm" data-act="custom">确认' + (s.mode === 'add' ? '添加' : '替换') + '</button>' +
      '</div></div>';
    html += '<div class="sclose" data-act="closesheet">取消</div></div>';
  }

  if (state.busy) {
    const b = state.busy;
    html += '<div class="genmask"><div class="genbox">' +
      '<h4>' + esc(b.title) + '</h4>' +
      '<div class="msg">' + esc(b.msg || '') + '</div>' +
      '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, b.pct || 0)) + '%"></i></div>' +
      '<div class="note">' + esc(b.note || '') + '</div>' +
      (b.err ? '<div class="err">' + esc(b.err) + '</div>' : '') +
      '<div class="close" data-act="closebusy">' + (b.err ? '关闭' : '后台运行，先看看别的') + '</div>' +
      '</div></div>';
  }

  /* 「去别的平台比价」浮层。四家都**没有网页版商品搜索**（实测），所以这里只能给
     官方入口 —— 文案必须说清楚，不能假装成能直接出结果的搜索深链。 */
  if (state.pricePop) html += pricePopHTML(state.pricePop);

  /* 首次访问弹一次免责说明，点「我知道了」后写 localStorage 不再打扰 */
  if (!state.seen && !state.busy && !state.sheet && !state.pricePop) html += legalHTML();

  if (state.toast) html += '<div class="toast">' + esc(state.toast) + '</div>';
  $('#layers').innerHTML = html;

  if (state.sheet) {
    const kw = $('#skw');
    if (kw && document.activeElement !== kw) { /* 保持输入焦点 */ }
  }
}

  if (state.view === 'shop') renderShop();
  else if (state.view === 'setup') renderSetup();
  else renderHome();

  ensureRealDetail();               // 详情页：补取 YouTube / 原站链接
  queueImages();                    // 新渲染出来的配图入队，一张一张加载
  revealReadyImages();              // 缓存命中（data URL）的那些下一帧淡入，避免硬切
  /* 只有「换页」才回到顶部。切换方案、调就餐人数、改采购范围都是在同一页里
     重渲染，无条件 scrollTo(0,0) 会让用户瞬间丢失当前位置 ——
     手机上尤其难受：刚滑到下面点一下，直接被弹回顶端。 */
  if (lastView !== state.view) {
    lastView = state.view;
    window.scrollTo(0, 0);

function busy(title, msg, pct, note) {
  state.busy = { title, msg, pct: pct || 0, note: note || '', err: '' };
  renderLayers();
  renderChrome();          // 顶栏按钮要立刻变成「正在生成…」并禁用
}
function busyMsg(msg, pct) {
  if (!state.busy) return;
  state.busy.msg = msg;
  if (pct != null) state.busy.pct = pct;
  renderLayers();
}
function busyErr(e) {
  const msg = (e && e.message) || String(e);
  /* 用户可能点了「后台运行，先看看别的」把浮层关掉 —— 这时不能再静默吞掉错误，
     否则界面上一点反馈都没有，看起来就像「点了没反应」。 */
  if (!state.busy) { toast('生成失败：' + msg.slice(0, 70)); return; }
  state.busy.err = msg;                 /* 浮层里仍然显示原始报错（测试有断言） */
  state.lastErr = humanErr(msg);        /* 关掉浮层后靠这条常驻提示兜底 */
  state.busy.title = '生成失败';
  renderLayers();
  renderChrome();
}
function busyEnd() { state.busy = null; render(); }

async function doGenWeek() {
  if (state.busy) return;
  const plan = state.plan;
  const total = DAY_PLAN.length;
  state.lastErr = null;                 /* 重新开始了，旧的失败提示先撤掉 */
  busy('AI 主厨正在设计本周菜单',
    '正在联网检索真实菜谱，核对温度与时间…', 4,
    '共 ' + total + ' 天，每天一个荤菜；每天都会先联网检索再落笔，全程约 1–3 分钟。');

  /* 后端模式下整周是一个任务，进度由后端回报，这里只负责转发到界面 */
  if (USE_BACKEND) return genWeekViaBackend(plan, total);

  const days = [];
  /* 荤菜顺序**每次生成都重新抽一次** —— 固定的「周一鱼、周二虾…」太可预测。
     注意 total 仍然是 5 天，只是每天抽到的荤菜不同。 */
  const planDays = shuffledDayPlan();
  /* ⚠️ 配图进度计数是模块级的，必须每次生成前清零 ——
     否则第二次生成会显示「6/10」这种跨轮累加的数字。 */
  imgPreTotal = 0; imgPreDone = 0;
  /* 并发上限**取决于模型**，不是账号级的（实测 2026-09-28）：
       glm-4.7        → 只有 2（发 3 个，第 3 个必 429 错误码 1302）
       glm-4.7-flash  → 很严（5 并发 5 个 429）
       glm-4.5-air    → ≥8（8 并发全部成功）
       glm-4-flash / glm-4-air → 也宽松
     所以这里**按当前模型自动决定批次**：宽松的模型 5 天一次全并行，
     受限的模型回到 2 天一批 —— 换模型时不用再手动改这里。
     注意后端模式不走这段（上面已 return）。 */
  const batch = /glm-4\.5-air|glm-4-flash|glm-4-air/.test(chatModel()) ? 5 : 2;
  try {
    for (let i = 0; i < total; i += batch) {
      const slice = planDays.slice(i, i + batch);
      const avoid = days.map((d) => d.title).filter(Boolean);
      busyMsg('正在联网检索并设计 ' + slice.map((m) => m.wk).join('、') + ' 的午餐…',
        4 + Math.round((i / total) * 90));
      const results = await Promise.all(slice.map(async (meta) => {
        const d = await generateDay(meta, plan, avoid, extraLine());
        /* ⚠️ 种子必须在**入队预取之前**定下来：配图缓存键含 img_seed，
           先预取、后改种子 = 白出一张图（渲染时按新种子查缓存必然未命中，
           于是同一道菜被生成两次、额度白烧）。 */
        d.img_seed = Math.floor(Math.random() * 1000000);
        delete d.real;
        /* AI 配图：文字一好就排队出图（配图现在只有 AI 一种，无条件排队）。 */
        prefetchDayImage(d);
        return d;
      }));
      results.forEach((d) => days.push(d));
      busyMsg('已完成 ' + days.length + '/' + total + ' 天', 4 + Math.round((days.length / total) * 90));
    }
    const order = {};
    planDays.forEach((m, i) => { order[m.id] = i; });
    /* 注意：不能写 `order[a.id] || 99` —— 周一的序号是 0，会被当成假值排到最后 */
    const rank = (d) => (order[d.id] === undefined ? 99 : order[d.id]);
    days.sort((a, b) => rank(a) - rank(b));

    const old = state.menus[plan] || {};
    const oldServ = old.days && old.days[0] ? old.days[0].servings : COMPANY;
    days.forEach((d) => { d.servings = oldServ || COMPANY; });

    /* ---- 收尾：**全部弄好再进首页** ----
       ① 先并行查 TheMealDB —— 真实照片已下线，这一步现在只为「做法链接」取数据
          （原菜谱 / YouTube 演示 / 各平台搜索深链）；
       ② AI 配图在生成文字的过程中已经并行预取了，这里只等它排空。
       用户明确要求首页直接就是 AI 图，不要先闪一下内置的离线占位图。 */
    if (!USE_BACKEND) {
      busyMsg('正在检索这几天的做法链接…', 91);
      await Promise.all(days.map(async (d) => {
        try { d.real = await lookupRealDish(d); }
        catch (e) { d.real = { q: '', tech: dayTechnique(d), list: [], i: 0 }; }
      }));
    }
    if (!USE_BACKEND && imgPreTotal) {
      await waitPrefetch((done, total) => {
        busyMsg('正在为这周的菜生成配图 ' + done + '/' + total + '…',
          92 + Math.round((done / Math.max(1, total)) * 6));
      });
    }

    state.menus[plan] = {
      plan,
      name: (PLANS[plan] || {}).name || ('方案 ' + plan),
      desc: (PLANS[plan] || {}).desc || '',
      servings: oldServ || COMPANY,
      days
    };
    writeMenus();
    busyMsg('完成！', 100);
    setTimeout(() => { state.busy = null; state.view = 'home'; render(); toast('本周菜单已生成'); }, 420);
  } catch (e) {
    busyErr(e);
  }
}

function currentDay() { return day(state.plan, state.dayId); }

/* 后端模式：一次 POST 提交整周生成，然后轮询进度。
   好处是并发闸门、缓存、去重都在服务端，浏览器只负责显示。 */
async function genWeekViaBackend(plan, total) {
  try {
    const payload = await runJob(
      '/api/menu/' + encodeURIComponent(plan) + '/generate',
      { plan: plan, force: true },
      (j) => {
        const pct = (j.total ? 4 + Math.round((num(j.progress) / num(j.total)) * 90) : 12);
        busyMsg(j.message || '主厨正在联网检索并落笔…', Math.min(pct, 94));
      });

    const days = (payload && payload.days) || [];
    if (!days.length) throw new ApiError('后端没有返回任何菜谱，请检查服务端日志。');

    const meta = PLANS[plan] || {};
    state.menus[plan] = {
      plan,
      name: payload.name || meta.name || ('方案 ' + plan),
      desc: payload.desc || meta.desc || '',
      servings: payload.servings || COMPANY,
      days
    };
    writeMenus();
    /* ⚠️ 后端模式的配图是**单独一个任务**在服务端烘焙的，而网页版以前从来没
       触发过它 —— 首页于是永远显示内置的离线占位图（assets/dish-*.jpg），
       看上去就像配图功能坏了。这里补上：烘焙完再把 img_key 拉回来。
       失败不影响菜单本身，首页继续显示占位图，绝不白屏。 */
    try {
      await runJob('/api/menu/' + encodeURIComponent(plan) + '/images',
        { plan: plan, force: false },
        (j) => {
          const pct = j.total ? 92 + Math.round((num(j.progress) / num(j.total)) * 6) : 93;
          busyMsg(j.message || '正在生成配图…', Math.min(pct, 98));
        });
      await refreshPlanFromBackend(plan);
    } catch (e) { /* 配图失败不影响菜单 */ }
    busyMsg('完成！', 100);
    setTimeout(() => { state.busy = null; state.view = 'home'; render(); toast('本周菜单已生成'); }, 420);
  } catch (e) {
    busyErr(e);
  }
}

/* 重新拉一次这个方案的菜单（后端刚把 img_key 写回去）。
   ⚠️ 不能用 syncFromBackend()：它遇到「本地已有 days」就跳过，正好把这里跳过。 */
async function refreshPlanFromBackend(plan) {
  const m = await request('/api/menu/' + encodeURIComponent(plan), 'GET', null, 30000);
  if (!m || !(m.days || []).length || !state.menus[plan]) return;
  state.menus[plan].days = m.days;
  writeMenus();
}

function saveDay(d) {
  const plan = state.plan;
  /* 用户可能在还没生成菜单时就直接改内置保底菜谱 —— 这时要先把保底数据
     克隆进 state.menus，否则 saveDay 无处可写，改动会被静默丢掉。 */
  if (!state.menus[plan] && FALLBACK[plan]) {
    state.menus[plan] = JSON.parse(JSON.stringify(FALLBACK[plan]));
  }
  const m = state.menus[plan];
  if (!m) return;
  m.days = m.days || [];
  const i = m.days.findIndex((x) => x.id === d.id);
  if (i < 0) m.days.push(d); else m.days[i] = d;
  writeMenus();
}

async function doSwap(dayObj, idx, want) {
  busy('正在更换食材', '主厨正在联网核对替代食材的营养当量…', 30,
    '换一样食材会连带重算整道菜的热量与营养素。');
  try {
    /* 后端模式：归一化、营养护栏、克重折算都在服务端做完了，前端只负责落库 */
    if (USE_BACKEND) return await swapViaBackend(dayObj, idx, want);

    const target = dayObj.ing[idx];
    const user = buildSwapPrompt(dayObj, target, want || '');
    const r = await chatJson(PROMPTS.swapSystem, user, { search:true });
    const data = r.json || {};

    const ni = (data.ing && typeof data.ing === 'object' && !Array.isArray(data.ing)) ? data.ing : {};
    const cat = normCat(ni.c || target.c);
    const rg = GRAM_RANGE[cat] || [1, 300];
    let g = num(ni.g) || target.g;
    g = Math.max(rg[0], Math.min(rg[1], g));
    const name = String(ni.n || target.n).trim();

    const replaced = {
      c: cat, n: name, g: r1(g),
      note: String(ni.note || '已按你的要求更换').trim(),
      alt: cleanAlt(ni.alt, cat), changed: true
    };

    const ings = dayObj.ing.map((x, i) => (i === idx ? replaced : Object.assign({}, x)));
    let steps = applyStepsPatch(dayObj.steps, data.steps_patch);

    /* 兜底：模型常常只改第一步，后面的步骤里还留着原食材的名字（实测过）。
       先补一次定向重写，还不行就退到「只换名字」的机械替换 —— 至少不让用户
       在详细做法里看到已经换掉的那样食材。 */
    let left = residualSteps(steps, target.n, name);
    if (left.length) {
      busyMsg('主厨发现漏改的步骤，正在补上…', 60);
      let fix = [];
      try { fix = await swapStepsFix(dayObj, target, name, left); } catch (e) { fix = []; }
      steps = applyStepsPatch(steps, fix);
      left = residualSteps(steps, target.n, name);
      if (left.length) steps = substStepNames(steps, target.n, name, left);
    }

    const updated = Object.assign({}, dayObj);
    updated.ing = ings;
    updated.steps = steps;
    const oldTotal = (dayObj.ing || []).reduce((s, i) => s + num(i.g), 0) || 1;
    const newTotal = ings.reduce((s, i) => s + num(i.g), 0) || 1;
    updated.total_g = r1(newTotal);

    /* 护栏：模型偶尔把 macros 写成「被换那样食材」的营养而不是整道菜合计。
       超出合理区间就按总重比例回退，避免脏数据。 */
    const mac = (data.macros && typeof data.macros === 'object') ? data.macros : {};
    const TOL = { kcal:[0.65,1.55], p:[0.45,1.9], c:[0.4,2.0], f:[0.3,2.2], fb:[0.3,2.5] };
    let ok = 0;
    for (const k of Object.keys(TOL)) {
      const o = num(dayObj[k]);
      if (o <= 0) continue;
      const n = num(mac[k]);
      if (n <= 0 || n < TOL[k][0] * o || n > TOL[k][1] * o) { ok = -1; break; }
      ok++;
    }
    /* 换食材的理由**每次都要重写**：updated 是从原 day 复制来的，
       这次不覆盖的话，界面上会显示上一道菜留下的旧理由（实测踩过）。 */
    const reason = String(data.reason || '').trim();
    if (ok >= 2) {
      ['kcal','p','c','f','fb'].forEach((k) => {
        if (mac[k] != null) updated[k] = (k === 'kcal') ? Math.round(num(mac[k])) : r1(num(mac[k]));
      });
      if (reason) updated.swap_note = reason + '（营养按模型给的合计值）';
      else delete updated.swap_note;
    } else {
      const ratio = newTotal / oldTotal;
      ['kcal','p','c','f','fb'].forEach((k) => {
        const base = num(dayObj[k]);
        updated[k] = (k === 'kcal') ? Math.round(base * ratio) : r1(base * ratio);
      });
      if (reason) updated.swap_note = reason + '（营养已按食材总重比例重算）';
      else delete updated.swap_note;
    }

    const srcs = collectSources({}, r.sources);
    if (srcs.length) updated.sources = srcs;

    /* 菜变了，原来的配图就对不上了 —— 清掉，下次重新生成 */
    delete state.imgs[state.plan + ':' + dayObj.id];
    writeImgs();

    saveDay(updated);
    state.busy = null;
    render();
    toast('已换成「' + name + '」' + (updated.swap_note ? ' · ' + updated.swap_note.slice(0, 40) : ''));
  } catch (e) {
    busyErr(e);
  }
}

/* 后端模式换食材：POST /api/swap → 轮询 → job.result = {day, note} */
async function swapViaBackend(dayObj, idx, want) {
  const res = await runJob('/api/swap', {

  }, (j) => { busyMsg(j.message || '主厨正在联网核对替代食材…', 45); });

  /* 菜变了，原来的配图就对不上了 —— 清掉，下次重新生成 */
  delete state.imgs[state.plan + ':' + dayObj.id];
  writeImgs();

  saveDay(updated);
  state.busy = null;
  render();
  const name = (updated.ing[idx] || {}).n || '新食材';
  const note = updated.swap_note || (res && res.note) || '';
  toast('已换成「' + name + '」' + (note ? ' · ' + String(note).slice(0, 40) : ''));
}

function doRestore(idx) {
  const d = currentDay();
  if (!d) return;
  /* 从当前方案的保底数据里取回原始值；若本来就是 AI 生成的，则退回内置同一天的原始食材 */
  const fb = FALLBACK[state.plan];
  const base = fb && (fb.days || []).find((x) => x.id === d.id);
  const orig = base && (base.ing || [])[idx];
  if (!orig) { toast('找不到原始食材，可点「换一道」整日重做'); return; }
  const ings = d.ing.map((x, i) => (i === idx ? Object.assign({}, orig) : Object.assign({}, x)));
  const nd = Object.assign({}, d, { ing: ings });
  nd.total_g = r1(ings.reduce((s, i) => s + num(i.g), 0));
  saveDay(nd);
  render();
  toast('已还原为「' + orig.n + '」');
}

async function doRegen(id) {
  const d = day(state.plan, id);
  if (!d || state.busy) return;
  /* ⚠️ 必须按**这一天自己的荤菜**取 meta：荤菜顺序已随机化，
     拿 id 去 DAY_PLAN 里查会查到固定顺序 —— 重做后荤菜类别被悄悄换掉，
     跟浮层上写的「主厨正在联网检索『鱼』的其他做法」自相矛盾。 */
  if (!d.type) { toast('这一天的荤菜信息缺失，无法重做'); return; }
  const meta = {
    id: d.id, wk: d.wk, en: d.en,
    type: d.type, tn: d.tn || TYPE_LABEL[d.type] || d.type
  };
  busy('正在换一道新菜', '主厨正在联网检索「' + d.tn + '」的其他做法…', 35,
    '会避开原来的菜名，并重新联网核对温度与时间。');
  try {
    if (USE_BACKEND) return await regenViaBackend(d, id);

    const avoid = (menu(state.plan).days || []).map((x) => x.title).filter(Boolean);
    if (d.title && avoid.indexOf(d.title) < 0) avoid.push(d.title);
    const user = buildRegenPrompt(meta, d.title || '', '', (PLANS[state.plan] || {}).style || '', avoid, COMPANY, extraLine());
    const r = await chatJson(PROMPTS.chefSystem, user, { search:true });
    const nd = normalizeDay(r.json, meta, state.plan, r.sources);
    nd.servings = d.servings || COMPANY;
    /* 换了菜，配图也得跟着换：发新种子（缓存键随之改变，旧图自动作废）+ 清掉后端模式的旧记录 */
    nd.img_seed = Math.floor(Math.random() * 1000000);
    delete state.imgs[state.plan + ':' + id];
    writeImgs();
    saveDay(nd);
    state.busy = null;
    render();
    toast('已换成「' + nd.title + '」');
  } catch (e) {
    busyErr(e);
  }
}

/* 后端模式整日重做：POST /api/regenerate-day → 轮询 → job.result = {day, warnings} */
async function regenViaBackend(d, id) {
  const res = await runJob('/api/regenerate-day', {
    plan: state.plan, day_id: id, feedback: ''
  }, (j) => { busyMsg(j.message || '主厨正在联网检索新做法…', 60); });

  const nd = res && res.day;
  if (!nd || !nd.ing) throw new ApiError('后端没有返回新的菜谱。');

  delete state.imgs[state.plan + ':' + id];
  writeImgs();
  saveDay(nd);
  state.busy = null;
  render();
  toast('已换成「' + (nd.title || '新菜') + '」');
}

/* 食材名 → 细分 key（SUBCATS 的镜像实现，必须与 library.subcat_of 一致）。
   ⚠️ 用「最长关键词优先」而不是「第一个命中的组」，否则会撞车：
      「牛油果」含「油」会被油脂组抢走、「橄榄油」含「橄榄」会被果类抢走。
      同长度时按 SUBCATS 里的组顺序取先出现的（如「鸡蛋」同时命中 蛋/鸡 → 蛋组）。 */
function subcatOf(cat, name) {
  const groups = SUBCATS[cat] || [];
  const s = String(name || '');
  let best = '', bestLen = 0;
  groups.forEach((g) => (g[2] || []).forEach((w) => {
    if (w && s.indexOf(w) >= 0 && w.length > bestLen) { bestLen = w.length; best = g[0]; }
  }));
  return best;
}

function openSwapSheet(idx) {
  const d = currentDay();
  if (!d) return;
  const it = d.ing[idx];
  /* ⚠️ 这里以前是 `it.c === 'season' ? 'veg' : it.c` —— 于是「更换柠檬汁」
     列出来的是西兰花和菠菜。调味料库现在有内容了，直接用它自己的类别。 */
  const cat = it.c;
  state.sheet = {
    mode: 'swap', dayId: d.id, idx, cat, sub: '', kw: '', custom: null,
    title: '更换「' + it.n + '」',
    hint: '只列「' + ((CAT_STYLE[cat] || {}).label || cat) +
      '」里的替代食材，主厨会联网核对并按营养当量折算克重。AI 推荐排在最前面。',
    list: []
  };
  filterSheetList();
  renderLayers();
}

function openAddSheet() {
  const d = currentDay();
  if (!d) return;
  state.sheet = {
    mode: 'add', dayId: d.id, idx: -1, cat: 'veg', sub: '', kw: '', custom: null,
    title: '添加一项自定义食材',
    hint: '直接加进这份菜谱，克重按一人份填写；不会调用 AI。',
    list: CAT_ORDER.filter((c) => c !== 'season')
      .reduce((acc, c) => acc.concat((LIB[c] || []).map((x) => ({ n: x[0], g: x[1], note: x[2], rec: false }))), [])
  };
  renderLayers();
}

function filterSheetList() {
  const s = state.sheet;
  if (!s) return;
  const kw = (s.kw || '').trim().toLowerCase();
  let all;
  if (s.mode === 'swap') {
    const d = currentDay();
    const it = d ? d.ing[s.idx] : null;
    const cat = s.cat || (it ? it.c : 'veg');
    const alts = it ? (it.alt || []).map((a) => ({ n:a[0], g:a[1], note:a[2], rec:true })) : [];
    const names = new Set(alts.map((a) => a.n));
    /* ⚠️ 只取**本类别**的库项。以前 season 被错映射成 veg，
       导致「更换柠檬汁」列出的是西兰花、菠菜。 */
    const libs = (LIB[cat] || []).filter((x) => !names.has(x[0]))
      .map((x) => ({ n:x[0], g:x[1], note:x[2], rec:false }));
    all = alts.concat(libs);
    /* 二级细分：AI 推荐项与库项都按自己的名字归类，只留当前细分 */
    if (s.sub) all = all.filter((x) => subcatOf(cat, x.n) === s.sub);
  } else {
    const cats = s.cat ? [s.cat] : CAT_ORDER.filter((c) => c !== 'season');
    all = cats.reduce((acc, c) => acc.concat((LIB[c] || []).map((x) => ({ n:x[0], g:x[1], note:x[2], rec:false }))), []);
  }
  s.list = kw ? all.filter((x) => x.n.toLowerCase().indexOf(kw) >= 0 || (x.note || '').toLowerCase().indexOf(kw) >= 0) : all;
}

function pickFromSheet(i) {
  const s = state.sheet;
  if (!s) return;
  const item = s.list[i];
  if (!item) return;
  const d = currentDay();
  if (!d) return;
  if (s.mode === 'add') {
    const rg = GRAM_RANGE[s.cat] || [1, 300];
    const g = Math.max(rg[0], Math.min(rg[1], item.g));
    const nd = Object.assign({}, d);
    nd.ing = d.ing.concat([{ c: s.cat, n: item.n, g: r1(g), note: item.note || '', alt: [], added: true }]);
    nd.total_g = r1(nd.ing.reduce((x, y) => x + num(y.g), 0));
    state.sheet = null;
    saveDay(nd);
    render();
    toast('已添加「' + item.n + '」');
  } else {
    const idx = s.idx;
    state.sheet = null;
    renderLayers();
    doSwap(d, idx, item.n);
  }
}

/* =========================================================================
   6.5 UX 增强：忌口筛选 / 一周汇总 / 打印 / 复制清单 / 免责
   ========================================================================= */

/* 忌口与过敏源。荤菜类按 day.type 判，食材类按名字扫。 */
const AVOID_OPTS = [
  { k:'beef',    t:'不吃牛肉' },
  { k:'pork',    t:'不吃猪肉' },
  { k:'chicken', t:'不吃鸡肉' },
  { k:'seafood', t:'不吃海鲜' },
  { k:'shrimp',  t:'不吃虾' },
  { k:'nuts',    t:'坚果过敏' },
  { k:'dairy',   t:'乳制品过敏' },
  { k:'gluten',  t:'麸质过敏' }
];
const AVOID_LABEL = { beef:'牛肉', pork:'猪肉', chicken:'鸡肉', seafood:'海鲜', shrimp:'虾',
                      nuts:'坚果', dairy:'乳制品', gluten:'麸质' };
/* 只有「过敏源」才扫食材名；肉类别直接看 day.type */
const AVOID_PAT = {
  nuts:   /核桃|杏仁|腰果|榛子|松子|开心果|南瓜籽|葵花籽|芝麻|亚麻籽|奇亚籽|巴旦木|花生/,
  dairy:  /奶酪|酸奶|牛奶|黄油|芝士|菲达|帕玛森|茅屋|马苏里拉/,
  gluten: /意面|面包|大麦|燕麦|小麦|全麦| couscous/i
};
const MEAT_TYPES = ['fish', 'shrimp', 'chicken', 'beef', 'pork'];
const KCAL_BANDS = [
  { k:'all',     t:'不限热量' },
  { k:'lt600',   t:'< 600',      lo:0,   hi:600 },
  { k:'600-700', t:'600–700',    lo:600, hi:700 },
  { k:'gt700',   t:'> 700',      lo:700, hi:1e9 }
];

/* 这一天撞上了哪几条忌口（空数组 = 安全） */
function avoidHits(d) {
  const av = state.avoid || [];
  if (!av.length || !d) return [];
  const hits = [];
  av.forEach((k) => {
    if (k === 'seafood') {
      if (d.type === 'fish' || d.type === 'shrimp') hits.push('海鲜');
      return;
    }
    if (MEAT_TYPES.indexOf(k) >= 0) {
      if (d.type === k) hits.push(AVOID_LABEL[k]);
      return;
    }
    const pat = AVOID_PAT[k];
    if (pat && (d.ing || []).some((i) => pat.test(String(i.n || '')))) hits.push(AVOID_LABEL[k]);
  });
  return hits;
}

/* 生成菜单时塞进提示词的忌口说明；没有忌口时返回空串（保证 buildDayPrompt 逐字比对不受影响） */
function avoidLine() {
  const av = state.avoid || [];
  if (!av.length) return '';
  return '【忌口与过敏源 · 必须完全避开】' + av.map((k) => AVOID_LABEL[k]).join('、') +
    '。任何食材、替代项、调味料里都不允许出现它们。\n';
}

/* ⚠️ 「每日热量目标」以前是个**死设置**：设置页能选、值也存进了 state，
   但 grep 下来只有 4 处「写」、**0 处「读」** —— 既不进提示词，也不参与筛选。
   现在它真的生效：走 buildDayPrompt 的第 5 参 extra，所以提示词模板本身不用改，
   与后端 prompts.build_day_prompt 的「逐字一致」断言也不受影响。 */
function kcalLine() {
  const band = KCAL_BANDS.filter((b) => b.k === state.kcalTarget)[0];
  if (!band || band.k === 'all') return '';
  const mid = Math.round((band.lo + band.hi) / 2);
  return '【每日热量目标】本餐一人份的热量要落在 ' + band.t + ' kcal 区间内，' +
    '目标 ' + mid + ' kcal 左右（上下浮动不超过 10%）。' +
    '不要靠减蔬菜来凑热量，优先调整主食与油脂的量。\n';
}

/* 生成时贴在提示词末尾的「额外约束」：忌口 + 每日热量目标 */
function extraLine() { return avoidLine() + kcalLine(); }

/* ---- 生成失败：把原始报错翻译成人话 + 首页常驻提示条 ---- */
/* ⚠️ 只用于「给用户看的那一份」。state.busy.err 里仍然存**原始报错** ——
   test_web.js / test_web_backend.js 都有针对原始文案（429 / 超时 / BACKEND_BASE…）
   的断言，改这里不要顺手把 busy.err 也改成人话。 */
function humanErr(raw) {
  const m = String(raw == null ? '' : raw);
  if (/429|并发|限流|too many|rate ?limit/i.test(m)) {
    return 'AI 服务当前请求过多（429），自动退避重试后仍然失败。等 1–2 分钟再点一次通常就好。';
  }
  if (/401|403|unauthor|invalid.*key|key.*invalid|密钥|Key 无效/i.test(m)) {
    return 'API Key 无效或已过期。请到「设置」里更新 Key，再重新生成。';
  }
  if (/timeout|超时|abort|timed out/i.test(m)) {
    return '请求超时了（网络慢，或模型在排队）。可以直接重试，也可以换一个更快的模型。';
  }
  if (/failed to fetch|networkerror|network error|网络|ERR_|offline/i.test(m)) {
    return '连不上 AI 服务。检查一下网络或代理，然后重试。';
  }
  if (/unexpected token|JSON|parse/i.test(m)) {
    return 'AI 返回的内容格式不对（偶发情况）。直接重试即可。';
  }
  return m.slice(0, 180);
}

/* ---- 一周营养汇总 ---- */
function weekAggHTML(days) {
  const n = days.length;
  if (!n) return '';
  const sum = (f) => days.reduce((s, d) => s + num(d[f]), 0);
  const kcal = sum('kcal'), p = sum('p'), c = sum('c'), f = sum('f'), fb = sum('fb');
  const veg = days.reduce((s, d) => s +
    (d.ing || []).filter((i) => i.c === 'veg').reduce((a, i) => a + num(i.g), 0), 0);
  const cell = (v, u, l, extra) =>
    '<div class="wa-cell"><div class="v">' + v + '<span class="u">' + u + '</span></div>' +
    '<div class="l">' + l + '</div>' + (extra ? '<div class="d">' + extra + '</div>' : '') + '</div>';
  return '<div class="weekagg">' +
    '<div class="wa-h"><b>一周营养汇总</b>' +
    '<span>共 ' + n + ' 天 · 左边是五天合计，小字是日均（一人份）</span></div>' +
    '<div class="wa-grid">' +
    cell(Math.round(kcal), 'kcal', '总热量', Math.round(kcal / n) + ' kcal/天') +
    cell(r1(p), 'g', '蛋白质', r1(p / n) + ' g/天') +
    cell(r1(c), 'g', '碳水', r1(c / n) + ' g/天') +
    cell(r1(f), 'g', '脂肪', r1(f / n) + ' g/天') +
    cell(r1(fb), 'g', '膳食纤维', '日均蔬菜 ' + Math.round(veg / n) + ' g') +
    '</div></div>';
}

/* ---- 筛选（纯展示层：只影响看什么，不改菜谱本身）---- */
function filterDays(days) {
  const band = KCAL_BANDS.filter((b) => b.k === state.fKcal)[0] || KCAL_BANDS[0];
  return days.filter((d) => {
    if (state.fMeat && state.fMeat !== 'all' && d.type !== state.fMeat) return false;
    if (band.k !== 'all') {
      const k = num(d.kcal);
      if (!(k >= band.lo && k < band.hi)) return false;
    }
    if (state.hideAvoid && avoidHits(d).length) return false;
    return true;
  });
}

function filterBarHTML(days) {

/* 导出成 .txt。⚠️ 开头加 BOM(\ufeff)：不然 Windows 记事本按 GBK 解，中文全乱码。
   file:// 下 Blob 下载在 Chrome 里是可用的。 */
function doDownloadShop() {
  const txt = shopText();
  const name = '健康午餐-采购清单-' + new Date().toISOString().slice(0, 10) + '.txt';
  try {
    const blob = new Blob(['\ufeff' + txt], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('已下载 ' + name);
  } catch (e) { toast('下载失败，请改用「复制购物清单」'); }
}

/* ---- 复制购物清单 ---- */
function shopText() {
  const { serv, items } = shopData();
  const picked = shopPicked();
  const all = (menu(state.plan) || {}).days || [];
  const allOn = !state.shopDays || !state.shopDays.length;
  const label = allOn ? ('全周 ' + all.length + ' 天') : picked.map((d) => d.wk).join('、');
  const lines = ['健康午餐 · 采购清单（' + label + ' · ' + serv + ' 人份）', ''];
  CAT_ORDER.forEach((c) => {
    const list = items.filter((i) => i.c === c).sort((a, b) => b.per - a.per);
    if (!list.length) return;
    lines.push('【' + ((CAT_STYLE[c] || {}).label || c) + '】');
    list.forEach((i) => {
      const up = (i.c === 'season') ? null : priceOf(i.n);
      const st = up == null ? null : priceSubtotal(i.n, i.per * serv);
      lines.push('  ' + i.n + '  ' + gfmt(i.per * serv) +
        (st == null ? '' : ('  参考价 ¥' + priceMoney(up) + '/500g ≈¥' + st.toFixed(1))));
    });
    lines.push('');
  });
  const grand = items.reduce((s, i) => s + i.per * serv, 0);
  const pt = priceTotal(items, serv);
  lines.push('合计约 ' + (r1(grand / 1000)).toFixed(2) + ' kg' +
    (pt.known ? ('　参考价合计约 ¥' + pt.sum.toFixed(1) + '（AI 估算，非实时）') : ''));
  return lines.join('\n');
}

function doCopyShop() {
  const txt = shopText();
  const done = () => toast('采购清单已复制，可直接粘到微信 / 备忘录 / 买菜 App');
  const fail = () => toast('复制失败，请手动长按选择文字');
  /* ⚠️ file:// 下 navigator.clipboard 常常不可用（不是安全上下文），
     所以必须留一条 execCommand 兜底 —— 否则双击打开的页面永远复制不了。 */
  const legacy = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, txt.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) done(); else fail();
    } catch (e) { fail(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, legacy);
  } else legacy();
}

   7. 事件
   ========================================================================= */
document.addEventListener('click', function (ev) {
  const el = ev.target.closest ? ev.target.closest('[data-act],[data-nav]') : null;
  if (!el) return;

  const nav = el.getAttribute('data-nav');
  if (nav) {
    if (nav === 'shop' || nav === 'home' || nav === 'setup') {
      state.view = nav; state.dayId = null; state.pricePop = null; render();
    }
    return;
  }

  const act = el.getAttribute('data-act');
  const arg = el.getAttribute('data-arg');
  if (!act) return;

  switch (act) {
    case 'genweek':
      if (!state.busy) doGenWeek();
      break;
    case 'plan':
      if (arg && arg !== state.plan) { state.plan = arg; writePlan(); render(); }
      break;
    /* 顶栏星期按钮；'open' 是旧的五天卡片点击，保留兼容 */
    case 'day':
    case 'open':
      if (!arg) break;
      state.homeDay = arg; state.dayId = arg; state.view = 'home';
      writeHomeDay(); render();
      break;
    case 'goto':
      state.view = arg; if (arg !== 'day') state.dayId = null; render();
      break;
    case 'today': {
      const ds = (menu(state.plan) || {}).days || [];
      if (!ds.length) { toast('还没有菜单，先生成一份吧'); break; }
      const t = ds[Math.min(todayIdx(), ds.length - 1)];
      state.homeDay = t.id; state.dayId = t.id; state.view = 'home';
      writeHomeDay(); render();
      break;
    }
    case 'print':
      doPrint(arg || state.dayId);
      break;
    case 'copyshop':
      doCopyShop();
      break;
    case 'downloadshop':
      doDownloadShop();
      break;
    case 'printshop':
      doPrintShop();
      break;
    case 'getprice':
      if (!state.busy) doFetchPrices();
      break;
    case 'shopsearch':
      if (arg) {
        state.pricePop = arg;
        copyText(arg, '已复制「' + arg + '」，到平台里粘贴搜索');
        renderLayers();
      }
      break;
    case 'copykw':
      copyText(arg || '', '已复制「' + (arg || '') + '」');
      break;
    case 'closepricepop':
      state.pricePop = null; renderLayers();
      break;
    case 'clearerr':
      state.lastErr = null; render();
      break;
    case 'fmeat':
      state.fMeat = arg || 'all'; render();
      break;
    case 'fkcal':
      state.fKcal = arg || 'all'; render();
      break;
    case 'favoid':
      state.hideAvoid = !state.hideAvoid; render();
      break;
    case 'freset':
      state.fMeat = 'all'; state.fKcal = 'all'; state.hideAvoid = false; render();
      break;
    case 'seenok':
      state.seen = true;
      try { localStorage.setItem(LS.seen, '1'); } catch (e) {}
      renderLayers();
      break;
    case 'image':
      doImage(arg);
      break;
    case 'regen':
      doRegen(arg);
      break;
    case 'serv':
      changeServ(parseInt(arg, 10) || 0);
      break;
    case 'servset':
      setServ(parseInt(arg, 10) || 1);
      break;
    case 'swap':
      openSwapSheet(parseInt(arg, 10));
      break;
    case 'add':
      openAddSheet();
      break;
    case 'restore':
      doRestore(parseInt(arg, 10));
      break;
    case 'closesheet':
      if (ev.target === el || el.classList.contains('sclose')) { state.sheet = null; renderLayers(); }
      break;
    case 'sfilter':
      if (state.sheet) {
        state.sheet.cat = arg; state.sheet.sub = ''; state.sheet.kw = '';
        filterSheetList(); renderLayers();
      }
      break;
    case 'ssub':
      /* 更换模式的二级细分（鱼/虾贝/禽肉…）—— 不动 cat，只换细分 */
      if (state.sheet) { state.sheet.sub = arg; state.sheet.kw = ''; filterSheetList(); renderLayers(); }
      break;
    case 'pick':
      pickFromSheet(parseInt(arg, 10));
      break;
    case 'custom':
      customFromSheet();
      break;
    case 'closebusy':
      state.busy = null; render();
      break;
    case 'savset': {
      const k = ($('#k') || {}).value;
      const m = ($('#m') || {}).value;
      const si = ($('#si') || {}).value;
      const ik = ($('#ik') || {}).value;
      const im = ($('#im') || {}).value;
      const kt = ($('#kt') || {}).value;
      const av = $$('input[name="avoid"]:checked').map((x) => x.value);
      try {
        if (k != null) { if (k.trim()) localStorage.setItem(LS.key, k.trim()); else localStorage.removeItem(LS.key); }
        if (m) localStorage.setItem(LS.model, m);
        if (si === '0' || si === '1') localStorage.setItem(LS.stepimg, si);
        if (ik != null) { if (ik.trim()) localStorage.setItem(LS.imgkey, ik.trim()); else localStorage.removeItem(LS.imgkey); }
        if (im) localStorage.setItem(LS.imgmodel, im);
        if (kt) localStorage.setItem(LS.kcaltgt, kt);
        localStorage.setItem(LS.avoid, JSON.stringify(av));
      } catch (e) {}
      if (si === '0' || si === '1') state.stepImg = (si === '1');
      if (kt) state.kcalTarget = kt;
      state.avoid = av;
      render();
      toast(av.length
        ? ('已保存，生成新菜单时会避开：' + av.map((x) => AVOID_LABEL[x]).join('、'))
        : '设置已保存');
      break;
    }
    case 'testkey':
      if (!state.busy) testKey();
      break;
    case 'clearmenu':
      delete state.menus[state.plan];
      writeMenus();
      render();
      toast('已清除，当前显示内置保底菜谱');
      break;
    case 'shop':
      state.view = 'shop'; render();
      break;
    /* 采购范围：点星期切换选中；把最后一天取消掉时自动回到「全周」，
       避免出现「一天都没选」的空清单。 */
    case 'shopday': {
      const id = el.getAttribute('data-arg');
      const allOn = !state.shopDays || !state.shopDays.length;
      /* 「全周」状态下所有星期都渲染成未选中，这时点一个应该是「只看这一天」，
         而不是「从五天里去掉这一天」—— 后者和界面显示的选中态对不上，
         用户点了会觉得莫名其妙少了一天。 */
      const cur = allOn ? [id] : state.shopDays.slice();
      if (!allOn) {
        const i = cur.indexOf(id);
        if (i >= 0) cur.splice(i, 1); else cur.push(id);
      }
      state.shopDays = cur.length ? cur : null;
      render();
      break;
    }
    case 'shopall':
      state.shopDays = null; render();
      break;
    /* 就餐人数：只改采购量，不动菜谱本身 */
    case 'shopserv': {
      const cur = shopServings(shopPicked());
      const next = Math.max(1, Math.min(999, cur + parseInt(el.getAttribute('data-arg'), 10)));
      state.shopServ = next;
      render();
      break;
    }
    case 'shopservset': {
      const v = parseInt(el.getAttribute('data-arg'), 10);
      state.shopServ = v > 0 ? v : null;      // 0 = 跟随菜单里存的份数
      render();
      break;
    }
    default: break;
  }
});
