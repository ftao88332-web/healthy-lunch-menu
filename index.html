<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E3D5C">
<title>AI 主厨推荐 · 零油烟地中海健康午餐</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%230E3D5C'/><path d='M9 23C9 14 14 9 23 9c0 9-5 14-14 14z' fill='%234CB37C'/><path d='M11 21C14.5 17.5 18 14 21 11.5' stroke='%23fff' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0E3D5C; --navy-2:#155E8C; --blue:#1E6E9E; --blue-l:#3C93C0;
  --green:#3E9E6A; --green-d:#2C7A50; --green-l:#4CB37C;
  --bg:#F1F7FB; --card:#FFFFFF; --line:#E2ECF3; --line-2:#CFE0EA;
  /* 次级文字调到真的够 WCAG AA（实测对比度，不是估的）：
       白底 #F1F7FB 底
       --ink-2  #456780  5.99:1  5.55:1
       --ink-3  #54748A  4.95:1  4.58:1   ← 原来 #8AA3B2 只有 2.64:1，小字基本看不清 */
  --ink:#0F2E42; --ink-2:#456780; --ink-3:#54748A;
  --warn:#8F5209; --warn-bg:#FDF3E3; --err:#B3322F; --err-bg:#FCEEED;
  --r:16px; --r-sm:10px; --r-xs:8px; --r-lg:22px;
  --sh:0 2px 8px rgba(15,46,66,.06), 0 12px 32px -12px rgba(15,46,66,.14);
  --sh-sm:0 1px 3px rgba(15,46,66,.07);
  --sh-lg:0 24px 56px -22px rgba(15,46,66,.30);
  --ring:0 0 0 3px rgba(60,147,192,.30);
  --grad-hero:linear-gradient(118deg,#0A2E48 0%,#11466A 46%,#155F87 100%);
  --grad-green:linear-gradient(135deg,#4CB37C,#2C7A50);
  /* 白字专用的深绿渐变：#4CB37C 配白字只有 2.6:1，过不了 AA。
     品牌亮绿 --grad-green 留给没有文字的装饰条。 */
  --grad-green-d:linear-gradient(135deg,#2F8456,#256B46);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
}
html,body{height:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);
}
.topbar .wrap{display:flex;align-items:center;gap:28px;height:64px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;color:var(--navy);letter-spacing:.2px}
.brand svg{flex:none}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{
  padding:7px 14px;border-radius:999px;font-size:14px;color:var(--ink-2);
  transition:background .15s,color .15s;
}
.nav button:hover{background:var(--bg);color:var(--ink)}
.nav button.on{background:var(--navy);color:#fff}
.topbar .act{display:flex;gap:10px;align-items:center}

/* ---------- 按钮 ---------- */
/* 主按钮：底色用 --green-d（白字 5.24:1，过 AA）。--green #3E9E6A 只有 3.33:1，
   亮绿留给没有文字的装饰元素。 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 22px;border-radius:999px;font-size:14px;font-weight:600;
  background:var(--green-d);color:#fff;letter-spacing:.1px;
  box-shadow:0 8px 18px -10px rgba(44,122,80,.75);
  transition:background .16s,box-shadow .16s,transform .1s;
  white-space:nowrap;
}
.btn:hover{background:#327f57;box-shadow:0 12px 24px -10px rgba(44,122,80,.85);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985);box-shadow:0 4px 10px -8px rgba(44,122,80,.8)}
.btn[disabled]:hover{background:var(--green-d);box-shadow:none;transform:none}
/* 次按钮：描边式，hover 时描边转蓝、底色微染，点击有下沉反馈 */
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line-2);box-shadow:none}
.btn.ghost:hover{background:#F4FAFE;border-color:var(--blue-l);color:var(--navy);transform:translateY(-1px)}
.btn.ghost:active{transform:translateY(0) scale(.985);background:#EAF4FB}
.btn.navy{background:var(--navy)}
.btn.sm{padding:8px 15px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none;transform:none}

/* ---------- 首屏 ---------- */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:var(--grad-hero);
  border-radius:0 0 32px 32px;
}
/* 两团光晕做纵深：右上偏绿（呼应橄榄/蔬菜），左下偏蓝。
   都压在 z-index:0，不跟标题抢视线。 */
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.hero::before{
  left:-180px;bottom:-260px;width:520px;height:520px;
  background:radial-gradient(circle,rgba(60,147,192,.34),rgba(60,147,192,0) 68%);
}
.hero::after{
  right:-140px;top:-180px;width:560px;height:560px;
  background:radial-gradient(circle,rgba(76,179,124,.24),rgba(76,179,124,0) 66%);
}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;
  padding-top:56px;padding-bottom:60px;align-items:center}
.hero .eyebrow{
  display:inline-flex;align-items:center;gap:8px;padding:6px 15px;border-radius:999px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  font-size:12.5px;letter-spacing:.5px;color:rgba(255,255,255,.94);
}
/* 呼吸的绿点：让「今天这一份」有存在感 */
.hero .eyebrow .live{
  width:6px;height:6px;border-radius:50%;background:#8FE0B4;flex:none;
  animation:pulse 2.4s ease-out infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(143,224,180,.55)}
  70%{box-shadow:0 0 0 8px rgba(143,224,180,0)}
  100%{box-shadow:0 0 0 0 rgba(143,224,180,0)}
}
/* 标题固定两行。原来用 <br>：在窄列里第一行自己先折一次，
   <br> 又硬断一次，结果标题被撕成 4 行、中间还空一行。 */
.hero h1{
  font-size:clamp(26px,3.5vw,42px);line-height:1.26;margin:20px 0 14px;
  font-weight:700;letter-spacing:-.4px;
}
.hero h1 .l{display:block}
@media(min-width:641px){.hero h1 .l{white-space:nowrap}}
/* 高亮词必须用自己的类名。全局的 .hl 是「营养亮点」那几行（display:flex），
   而 .hero h1 .hl 只覆盖了 color —— 于是标题里的「地中海」被继承成 flex 块级盒，
   自己占满一行，标题就被撕成 4 行、中间还多一个空行。改叫 .hlw 从根上分开。 */
.hero h1 .hlw{color:#9BE7BE}
.hero .lead{font-size:15.5px;color:rgba(255,255,255,.8);margin-bottom:22px;max-width:30em}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:999px;
  font-size:12.5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.95);
}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px}
.hero .cta .btn{background:#fff;color:var(--navy);box-shadow:0 12px 26px -14px rgba(0,0,0,.65)}
.hero .cta .btn:hover{filter:none;background:#F1FAF5}
.hero .cta .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:none}
.hero .cta .btn.ghost:hover{background:rgba(255,255,255,.2)}
.hero .cta .btn[disabled]{opacity:.55}

.heroart{position:relative}
.heroart .frame{
  position:relative;aspect-ratio:1/1;border-radius:26px;overflow:hidden;
  background:linear-gradient(140deg,#2E7FA8,#17527A);
  box-shadow:0 30px 70px -26px rgba(0,0,0,.62), inset 0 0 0 1px rgba(255,255,255,.16);
}
.heroart .frame img{width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .5s ease}
.heroart .frame img.is-in{opacity:1}
.heroart .frame .ph{position:absolute;inset:0;display:grid;place-items:center;opacity:.5}
.heroart .bubble{
  position:absolute;right:-12px;top:18px;padding:12px 16px;border-radius:16px;
  background:#fff;color:var(--navy);font-size:13.5px;font-weight:600;line-height:1.45;
  box-shadow:0 16px 34px -12px rgba(0,0,0,.42);max-width:200px;
}
.heroart .bubble .sub{font-size:11.5px;font-weight:400;color:var(--ink-3);margin-top:4px;line-height:1.5}
.heroart .metrics{
  position:absolute;left:-16px;bottom:-18px;display:flex;gap:0;border-radius:16px;
  background:rgba(255,255,255,.98);overflow:hidden;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 18px 44px -16px rgba(0,0,0,.45);
}
.heroart .metrics .m{padding:12px 15px;text-align:center;border-right:1px solid var(--line)}
.heroart .metrics .m:last-child{border-right:none}
.heroart .metrics .v{font-size:19px;font-weight:700;color:var(--navy);line-height:1.15;
  font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.heroart .metrics .v .u{font-size:10.5px;font-weight:500;color:var(--ink-2);margin-left:1px;letter-spacing:0}
.heroart .metrics .l{font-size:11px;color:var(--ink-2);margin-top:3px}

/* ---------- 通用区块 ---------- */
main{padding-bottom:24px}
.sec{margin-top:60px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sec-head h2{
  font-size:22px;font-weight:600;color:var(--navy);letter-spacing:-.3px;
  display:flex;align-items:center;gap:9px;
}
.sec-head h2::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--grad-green)}
.sec-head .sub{font-size:13px;color:var(--ink-3);margin-left:auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh-sm);border:1px solid var(--line)}

.benefits{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.benefit{
  position:relative;overflow:hidden;
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:22px 12px 20px;text-align:center;transition:box-shadow .2s,transform .2s,border-color .2s;
}
/* 悬停时顶部拉出一条绿色进度条：给静态卡片一点反馈 */
.benefit::after{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad-green);
  transform:scaleX(0);transform-origin:left;transition:transform .25s ease;
}
.benefit:hover{box-shadow:var(--sh);transform:translateY(-3px);border-color:var(--line-2)}
.benefit:hover::after{transform:scaleX(1)}
.benefit .ic{width:42px;height:42px;margin:0 auto 11px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(140deg,#EAF6EF,#DCEFFB);color:var(--green-d);
  box-shadow:inset 0 0 0 1px rgba(62,158,106,.14)}
.benefit .t{font-size:13.5px;color:var(--ink);font-weight:600;letter-spacing:.1px}
.benefit .d{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.55}

/* ---------- 菜单 ---------- */
.planbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.planbar .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.planbar .seg button{padding:8px 18px;border-radius:999px;font-size:13.5px;color:var(--ink-2)}
.planbar .seg button.on{background:var(--navy);color:#fff;font-weight:500}
.planbar .meta{font-size:13px;color:var(--ink-3);margin-left:auto}
.planbar .meta b{color:var(--ink-2);font-weight:500}

.days{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.day{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  cursor:pointer;transition:box-shadow .22s,transform .22s,border-color .22s;text-align:left;
  display:flex;flex-direction:column;
}
.day:hover{box-shadow:var(--sh);transform:translateY(-4px);border-color:var(--line-2)}
.day:hover .thumb img{transform:scale(1.05)}
.day .thumb{position:relative;aspect-ratio:4/3;background-color:var(--bg);
  background-size:cover;background-position:center;overflow:hidden}
/* 底部压一层暗角，让「鱼/虾」标签在亮照片上也读得清 */
.day .thumb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;
  background:linear-gradient(180deg,rgba(9,29,42,0),rgba(9,29,42,.42))}
.day .thumb img{width:100%;height:100%;object-fit:cover;opacity:0;
  transition:transform .5s ease,opacity .5s ease}
.day .thumb img.is-in{opacity:1}
.day .thumb .ph{position:absolute;inset:0;display:grid;place-items:center}
.day .thumb .tag{
  position:absolute;left:10px;bottom:10px;padding:4px 11px;border-radius:999px;
  font-size:11.5px;font-weight:600;color:#fff;background:rgba(14,61,92,.72);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.22);
}
.day .thumb .today{
  position:absolute;right:10px;top:10px;padding:4px 11px;border-radius:999px;
  font-size:11.5px;font-weight:600;color:#fff;background:var(--green-d);
  box-shadow:0 6px 16px -6px rgba(44,122,80,.9);
}
.day .body{padding:14px 15px 16px;flex:1;display:flex;flex-direction:column;gap:7px}
.day .wk{font-size:11.5px;color:var(--ink-3);letter-spacing:.5px}
.day .title{font-size:15.5px;font-weight:600;color:var(--navy);line-height:1.38;letter-spacing:-.1px}
.day .sub{font-size:12.5px;color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 营养数字条：数字放大、单位缩小、标签退到最弱一档 —— 一眼先看到数。
   ⚠️ 这里不能再用 opacity 压小字（原来 .k .u 是 opacity:.72，实测只有 2.86:1），
   要弱化就用 --ink-2 这种「本来对比度就够」的颜色。 */
.day .dstat{display:flex;margin-top:auto;padding-top:11px;border-top:1px dashed var(--line)}
.day .dstat .s{flex:1;min-width:0;text-align:center;border-right:1px solid var(--line);padding:0 2px}
.day .dstat .s:last-child{border-right:none}
.day .dstat .s .v{font-size:16px;font-weight:700;color:var(--navy);line-height:1.15;
  font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.day .dstat .s .v .u{font-size:9.5px;font-weight:500;color:var(--ink-2);margin-left:1px;letter-spacing:0}
.day .dstat .s .l{font-size:10.5px;color:var(--ink-2);margin-top:2px}
.day .dmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
/* 烹饪方式 badge：原来是灰色纯文字，现在做成有底色的小标签 */
.day .mtag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:600;color:var(--blue);background:#E8F2F9;
  border:1px solid #D3E6F4;letter-spacing:.2px;
}
.day .mtag.time{color:var(--ink-2);background:var(--bg);border-color:var(--line-2);font-weight:500}

.empty{
  padding:64px 24px;text-align:center;color:var(--ink-3);
  border:1.5px dashed var(--line-2);border-radius:var(--r);background:rgba(255,255,255,.6);
}
.empty .et{font-size:16px;color:var(--ink-2);font-weight:500;margin:14px 0 6px}
.empty .ed{font-size:13.5px;margin-bottom:20px}

/* ---------- 详情 ---------- */
.dbar{display:flex;align-items:center;gap:12px;margin:22px 0 18px}
.dbar .back{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;
  background:#fff;border:1px solid var(--line);font-size:13.5px;color:var(--ink-2);
}
.dbar .back:hover{background:var(--bg);color:var(--ink)}
.dbar .spacer{margin-left:auto}

.dgrid{display:grid;grid-template-columns:1.02fr .98fr;gap:26px;align-items:start}
.dhero{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;
  background-color:var(--bg);background-size:cover;background-position:center;
  border:1px solid var(--line)}
.dhero img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
.dhero img.is-in{opacity:1}
.dhero .ph{position:absolute;inset:0;display:grid;place-items:center}
.dhero .badge{
  position:absolute;left:12px;top:12px;padding:5px 12px;border-radius:999px;font-size:12.5px;
  font-weight:500;color:#fff;background:rgba(14,61,92,.8);backdrop-filter:blur(6px);
}
.dhero .ai{
  position:absolute;right:12px;top:12px;padding:5px 12px;border-radius:999px;font-size:12px;
  color:#fff;background:rgba(62,158,106,.92);
}
/* 真实照片用蓝色徽标，和绿色的「AI 生成配图」一眼能分开 */
.dhero .ai.realph{background:rgba(30,110,158,.92)}
.imgcred{margin-top:9px;font-size:12px;color:var(--ink-3);line-height:1.62}
.imgcred b{color:var(--ink-2);font-weight:600}
/* 做法视频 / 图文教程 */
.recipl{padding:15px 17px}
.rlq{font-size:12.5px;color:var(--ink-3);margin-bottom:12px;line-height:1.6}
.rlq b{color:var(--navy);font-weight:600}
.rlgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.rl{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:#fff;text-decoration:none;transition:border-color .16s,background .16s}
.rl:hover{border-color:var(--blue);background:#F7FBFE}
.rl .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.rl .n1{font-size:13.5px;font-weight:600;color:var(--navy)}
.rl .n2{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.rl .go{margin-left:auto;font-size:12px;color:var(--blue);flex:none}
.rl.hit{border-color:#CFE3F2;background:#F7FBFE}
.rl.hit .n1{color:var(--blue)}
@media(max-width:640px){.rlgrid{grid-template-columns:1fr}}
.dhead .wkrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:12.5px}
.pill.blue{background:#E8F2F9;color:var(--blue)}
.pill.green{background:#EAF6EF;color:var(--green-d)}
.pill.navy{background:var(--navy);color:#fff}
.dhead h1{font-size:clamp(23px,2.9vw,31px);font-weight:600;color:var(--navy);line-height:1.28;letter-spacing:-.3px}
.dhead .dsub{font-size:14.5px;color:var(--ink-2);margin-top:8px}
.dhead .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
/* 营养数值卡：数字放大到 23px、单位缩到 10px，标题用 --ink-2（4.5:1 以上）。
   热量那张加一层淡绿底 + 绿字，作为「主指标」和其余四张拉开层级。 */
.nutri{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px}
.nutri .n{background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:14px 6px 12px;text-align:center;box-shadow:var(--sh-sm)}
.nutri .n:first-child{background:linear-gradient(180deg,#F2FAF5,#E7F5EE);border-color:#D3EBDD}
.nutri .n:first-child .v{color:var(--green-d)}
.nutri .v{font-size:23px;font-weight:700;color:var(--navy);line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:-.6px}
.nutri .v .u{font-size:10px;font-weight:500;color:var(--ink-2);margin-left:2px;letter-spacing:0}
.nutri .l{font-size:11.5px;color:var(--ink-2);margin-top:5px;font-weight:500}

.chefsay{
  display:flex;gap:14px;margin-top:22px;padding:18px 20px;border-radius:18px;

}

.chefsay .t{font-size:12.5px;color:#8FE0B4;font-weight:600;margin-bottom:5px;letter-spacing:.2px}
.chefsay .x{font-size:13.5px;color:rgba(255,255,255,.92);line-height:1.7}

.secttl{display:flex;align-items:baseline;gap:10px;margin:34px 0 14px}
.secttl h3{font-size:16.5px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:8px}
.secttl h3::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--green)}
.secttl .more{font-size:12.5px;color:var(--ink-3);margin-left:auto}

.serve{padding:16px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.serve .lab{font-size:13.5px;color:var(--ink-2);font-weight:500}
.stepper{display:flex;align-items:center;background:var(--bg);border-radius:999px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:50%;font-size:17px;color:var(--blue);display:grid;place-items:center}
.stepper button:hover{background:#fff}
.stepper .num{min-width:44px;text-align:center;font-weight:600;font-size:15px}
.serve .quick{display:flex;gap:7px}
.serve .quick button{padding:6px 13px;border-radius:999px;font-size:12.5px;background:var(--bg);color:var(--ink-2)}
.serve .quick button.on{background:var(--navy);color:#fff}
.serve .totals{margin-left:auto;display:flex;gap:20px;font-size:12.5px;color:var(--ink-3)}
.serve .totals b{display:block;font-size:15px;color:var(--navy);font-weight:600}

.ingwrap{padding:6px 0}
.inggrp{border-bottom:1px solid var(--line);padding:14px 18px}
.inggrp:last-child{border-bottom:none}
.inggt{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.inggt .cico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.inggt .cn{font-size:13.5px;font-weight:600;color:var(--ink)}
.inggt .cs{font-size:12px;color:var(--ink-3);margin-left:auto}
.irow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-sm);transition:background .15s}
.irow:hover{background:var(--bg)}
.irow.changed{background:#FBF7EC}
.irow.added{background:#EDF7F1}
.irow .nm{flex:1;min-width:0}
.irow .n1{font-size:14px;color:var(--ink);font-weight:500}
.irow .n2{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.irow .wg{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.irow .sb{
  padding:5px 12px;border-radius:999px;font-size:12.5px;color:var(--blue);
  background:#fff;border:1px solid var(--line-2);white-space:nowrap;
}
.irow .sb:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.irow .sb.gray{color:var(--ink-2)}
.irow .sb.gray:hover{background:var(--ink-2);color:#fff;border-color:var(--ink-2)}
.addrow{
  margin:10px 18px 14px;padding:11px;border-radius:var(--r-sm);text-align:center;
  border:1.5px dashed var(--line-2);font-size:13.5px;color:var(--blue);cursor:pointer;
}
.addrow:hover{background:#F5FAFE;border-color:var(--blue-l)}

.steps{padding:18px}
.stepnote{
  padding:12px 14px;border-radius:var(--r-sm);background:#F4FAF7;color:var(--green-d);
  font-size:13px;line-height:1.6;margin-bottom:16px;
}
.step{display:flex;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:none;padding-bottom:0}
.step .sn{
  width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:var(--grad-green-d);color:#fff;font-size:13px;font-weight:600;
  box-shadow:0 6px 14px -6px rgba(44,122,80,.7);
}
.step .st{font-size:14.5px;font-weight:600;color:var(--navy);margin-bottom:3px}
.step .sd{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.refnote{display:flex;gap:9px;margin-top:14px;font-size:12.5px;color:var(--ink-3);line-height:1.65}

.srcs{padding:16px 18px;display:flex;flex-wrap:wrap;gap:9px}
.src{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:7px 13px;border-radius:999px;
  background:var(--bg);font-size:12.5px;color:var(--ink-2);border:1px solid var(--line)}
.src:hover{background:#fff;border-color:var(--line-2);text-decoration:none}
.src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.srctip{width:100%;font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.6}

.hls{padding:8px 18px}
.hl{display:flex;gap:13px;padding:13px 0;border-bottom:1px dashed var(--line)}
.hl:last-child{border-bottom:none}
.hl .hi{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:#EAF6EF;color:var(--green-d)}
.hl .ht{font-size:14px;font-weight:600;color:var(--ink)}
.hl .hd{font-size:13px;color:var(--ink-2);line-height:1.6;margin-top:2px}

.acts{display:flex;flex-wrap:wrap;gap:11px;margin-top:26px}

/* ---------- 采购清单 ---------- */
.shopnote{padding:16px 18px;font-size:13px;color:var(--ink-2);background:#fff;border-radius:var(--r);
  border:1px solid var(--line);margin-bottom:16px;line-height:1.75}
.shopgrp{margin-bottom:16px;overflow:hidden;border-radius:16px}
.shopgrp .gt{display:flex;align-items:center;gap:9px;padding:14px 18px;
  background:linear-gradient(180deg,#FBFDFF,#F4FAFD);border-bottom:1px solid var(--line)}
.shopgrp .gt .cn{font-size:14px;font-weight:600;color:var(--navy)}
.shopgrp .gt .cs{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.shoprow{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);
  transition:background .15s}
.shoprow:last-child{border-bottom:none}
.shoprow:hover{background:#FAFCFE}
.shoprow .nm{flex:1;font-size:14px;color:var(--ink)}
.shoprow .per{font-size:12px;color:var(--ink-3);white-space:nowrap}
.shoprow .g{font-size:14px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;
  min-width:82px;text-align:right;white-space:nowrap}

/* ---------- 关于 ---------- */
.aboutgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ab{padding:22px 24px;border-radius:18px}
.ab h4{font-size:15.5px;font-weight:600;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ab ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.ab li{font-size:13.5px;color:var(--ink-2);line-height:1.65;padding-left:20px;position:relative}
.ab li::before{content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--green-l)}
.ab li b{color:var(--ink);font-weight:500}
.ab .bad{color:var(--err)}
.setrow{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.setrow label{font-size:13px;color:var(--ink-2);font-weight:500}
.setrow .hint{font-size:12px;color:var(--ink-3);line-height:1.6}
.setrow input,.setrow select{
  padding:11px 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:#fff;
  font-size:13.5px;font-family:var(--sans);outline:none;transition:border-color .15s,box-shadow .15s;
}
.setrow input:focus,.setrow select:focus{border-color:var(--blue-l);box-shadow:0 0 0 3px rgba(60,147,192,.14)}
.warnbox{
  padding:13px 15px;border-radius:var(--r-sm);background:var(--warn-bg);color:var(--warn);
  font-size:12.5px;line-height:1.7;margin-bottom:16px;
}
.warnbox b{font-weight:600}
.okbox{
  padding:13px 15px;border-radius:var(--r-sm);background:#EAF6EF;color:var(--green-d);
  font-size:12.5px;line-height:1.7;margin-bottom:16px;
}
.okbox b{font-weight:600}
code.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
  background:rgba(15,46,66,.06);padding:1px 5px;border-radius:5px;color:var(--ink-2);
}
.modepill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;letter-spacing:.2px;
}
.modepill.direct{background:#EEF3FB;color:#3A6EA5}
.modepill.backend{background:#EAF6EF;color:var(--green-d)}
.modepill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}

/* 只读版：把所有会调 AI 的入口藏掉。
   用 CSS 而不是遍历 DOM，是因为这些按钮是每次 render() 重新生成的 ——
   一次性 remove 会在下一次渲染时又冒出来。 */
body.readonly [data-act="genweek"],
body.readonly [data-act="regen"],
body.readonly [data-act="image"],
body.readonly [data-act="swap"],
body.readonly [data-act="add"]{display:none !important}
.robar{
  display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:10px 14px;
  background:#F3F7FB;border:1px solid #DCE7F2;border-radius:12px;
  font-size:12px;color:#41607F;line-height:1.6
}
.robar b{color:#28486A}

/* 采购范围选择器 */
.shoppick{
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  margin:0 0 16px;padding:12px 14px;background:#F7FAFB;border-radius:14px
}
.sp-l{font-size:12.5px;color:var(--ink-3);margin-right:2px}
.sp-c{
  font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;
  background:#fff;border:1px solid #DCE7F2;color:var(--ink-2);user-select:none
}
/* 注意：本文件的 CSS 变量里没有 --blue-d，深色是 --navy / --blue */
.sp-c:hover{border-color:var(--blue-l);color:var(--navy)}
.sp-c.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sp-t{margin-left:auto;font-size:12px;color:var(--ink-3)}
/* 采购页里的人数步进器：比详情页那档紧凑一点，换成白底好嵌在浅蓝面板里 */
.shoppick .stepper{background:#fff;border:1px solid #DCE7F2;padding:2px}
.shoppick .stepper button{width:26px;height:26px;font-size:15px}
.shoppick .stepper .num{min-width:38px;font-size:14px}

/* ---------- 底部标签栏（移动端） ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .in{display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;color:var(--ink-3)}
.tabbar button.on{color:var(--navy);font-weight:500}
.tabbar svg{opacity:.85}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;z-index:60;background:rgba(9,29,42,.5);backdrop-filter:blur(2px);
  opacity:0;animation:fade .2s forwards}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet{
  position:fixed;z-index:61;left:50%;bottom:0;transform:translateX(-50%);
  width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column;
  background:#fff;border-radius:22px 22px 0 0;animation:rise .24s ease-out;
}
.sheet .sh{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.sheet .sh h4{font-size:16.5px;font-weight:600;color:var(--navy)}
.sheet .sh p{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.6}
.filters{display:flex;gap:7px;padding:13px 22px 0;flex-wrap:wrap}
.filters button{padding:6px 14px;border-radius:999px;font-size:12.5px;background:var(--bg);color:var(--ink-2)}
.filters button.on{background:var(--navy);color:#fff}
.searchbox{padding:12px 22px 0}
.searchbox input{width:100%;padding:11px 15px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--bg);font-size:13.5px;font-family:var(--sans);outline:none}
.searchbox input:focus{background:#fff;border-color:var(--blue-l)}
.slist{overflow-y:auto;flex:1;padding:12px 22px;min-height:120px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-sm);cursor:pointer}
.srow:hover{background:var(--bg)}
.srow .an{flex:1;min-width:0}
.srow .a1{font-size:14px;font-weight:500;color:var(--ink)}
.srow .a1 .rec{font-size:11px;color:var(--green-d);background:#EAF6EF;padding:1px 7px;border-radius:999px;margin-left:7px}
.srow .a2{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.srow .ag{font-size:13px;color:var(--ink-2);white-space:nowrap}
.srow .pk{padding:6px 15px;border-radius:999px;font-size:12.5px;background:var(--navy);color:#fff}
.sheet .custom{padding:14px 22px 8px;border-top:1px solid var(--line);background:#FAFCFE}
.sheet .custom .t{font-size:12.5px;color:var(--ink-2);font-weight:500;margin-bottom:9px}
.sheet .custom .f{display:flex;gap:8px;flex-wrap:wrap}
.sheet .custom input{flex:1;min-width:110px;padding:10px 13px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:#fff;font-size:13px;font-family:var(--sans);outline:none}
.sheet .custom select{padding:10px 13px;border-radius:var(--r-sm);border:1px solid var(--line-2);
  background:#fff;font-size:13px;font-family:var(--sans)}
.sheet .sclose{padding:12px;text-align:center;font-size:14px;color:var(--ink-2);cursor:pointer;
  border-top:1px solid var(--line)}
.sheet .sclose:hover{background:var(--bg)}

/* ---------- 生成进度 ---------- */
.genmask{position:fixed;inset:0;z-index:70;background:rgba(9,29,42,.56);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:20px}
.genbox{width:min(420px,100%);background:#fff;border-radius:20px;padding:26px 26px 22px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:rise .22s ease-out}
.genbox h4{font-size:17px;font-weight:600;color:var(--navy);margin-bottom:7px}
.genbox .msg{font-size:13.5px;color:var(--ink-2);line-height:1.6;min-height:44px}
.genbox .bar{height:7px;border-radius:999px;background:var(--bg);overflow:hidden;margin:16px 0 12px}
.genbox .bar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--green),var(--blue-l));transition:width .35s ease}
.genbox .note{font-size:12px;color:var(--ink-3);line-height:1.65}
.genbox .err{margin-top:13px;padding:11px 13px;border-radius:var(--r-sm);background:var(--err-bg);
  color:var(--err);font-size:12.5px;line-height:1.65;word-break:break-word}
.genbox .close{margin-top:15px;text-align:center;font-size:14px;color:var(--ink-2);cursor:pointer;
  padding:10px;border-radius:var(--r-sm)}
.genbox .close:hover{background:var(--bg)}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:90;
  padding:11px 20px;border-radius:999px;background:rgba(14,61,92,.94);color:#fff;
  font-size:13.5px;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);animation:rise .2s ease-out;
  max-width:88vw;text-align:center;
}

/* ---------- 无障碍：键盘焦点 + 动效偏好 ---------- */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--blue-l);outline-offset:2px;border-radius:6px;
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
  .day:hover,.benefit:hover{transform:none}
}
/* ---------- 顶栏 / 空态 / 页脚 ---------- */
.topbar{box-shadow:0 1px 0 rgba(15,46,66,.05),0 10px 28px -22px rgba(15,46,66,.35)}
.empty{padding:64px 24px;text-align:center;color:var(--ink-3);
  border:1.5px dashed var(--line-2);border-radius:var(--r-lg);background:rgba(255,255,255,.6)}
.foot{margin-top:64px;border-top:1px solid var(--line);background:rgba(255,255,255,.55)}
.foot .wrap{display:flex;align-items:flex-start;gap:22px;flex-wrap:wrap;
  padding-top:28px;padding-bottom:34px}
.foot .fb{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;color:var(--navy);flex:none}
.foot .fn{font-size:12.5px;color:var(--ink-3);line-height:1.8;max-width:660px}
.foot .fn b{color:var(--ink-2);font-weight:600}
/* ---------- 响应式 ---------- */
/* ---------- 响应式 ---------- */
@media(max-width:1000px){
  .hero .wrap{grid-template-columns:1fr;gap:34px;padding-top:42px;padding-bottom:46px}
  .heroart{max-width:460px;margin:0 auto;width:100%}
  .days{grid-template-columns:repeat(2,1fr)}
  .dgrid{grid-template-columns:1fr}
  .benefits{grid-template-columns:repeat(3,1fr)}
  .aboutgrid{grid-template-columns:1fr}
}
@media(max-width:640px){
  .wrap{padding:0 15px}
  .nav{display:none}
  .topbar .wrap{height:56px}
  .tabbar{display:block}
  main{padding-bottom:12px}
  .sec{margin-top:44px}
  .benefits{grid-template-columns:repeat(2,1fr)}
  .days{grid-template-columns:1fr}
  .heroart .metrics{position:static;margin-top:14px;width:100%;justify-content:space-between}
  .heroart .metrics .m{flex:1;padding:10px 6px}
  .heroart .bubble{right:8px;top:8px;max-width:150px;padding:9px 13px;font-size:13px}
  .nutri{grid-template-columns:repeat(3,1fr)}
  .serve .totals{margin-left:0;width:100%;justify-content:space-between}
  .dhead h1{font-size:22px}
  .irow{flex-wrap:wrap}
  .sheet{border-radius:20px 20px 0 0}
  /* 页脚替 <main> 兜住固定标签栏的高度 */
  .foot{margin-top:44px}
  .foot .wrap{padding-bottom:104px}
}

/* =========================================================================
   UX 优化新增样式（2026-10-08）
   ========================================================================= */

/* ---- 今日高亮：当日卡片加绿色描边 + 淡底，一眼能找到 ---- */

.day.is-today:hover{box-shadow:0 0 0 2px rgba(76,179,124,.34),var(--sh)}
.day.is-today .wk{color:var(--green-d);font-weight:600}

/* ---- 一周营养汇总 ---- */
.weekagg{margin:0 0 18px;padding:16px 18px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm)}
.weekagg .wa-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.weekagg .wa-h b{font-size:15px;color:var(--navy)}
.weekagg .wa-h span{font-size:12.5px;color:var(--ink-3)}
.wa-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
.wa-cell{background:var(--bg);border-radius:var(--r-sm);padding:12px 14px}
.wa-cell .v{font-size:19px;font-weight:600;color:var(--navy);line-height:1.2}
.wa-cell .v .u{font-size:11.5px;font-weight:400;color:var(--ink-3);margin-left:2px}
.wa-cell .l{font-size:12px;color:var(--ink-3);margin-top:3px}
.wa-cell .d{font-size:11.5px;color:var(--green-d);margin-top:2px}

/* ---- 筛选条 ---- */
.fbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 16px;

const ICONS = {
  protein:'M3 12c4.4-5.2 13-5.2 17.4 0-4.4 5.2-13 5.2-17.4 0zM20.4 12l3.6-3v6z',

};
const NAV = [

  {k:'about', t:'营养理念', d:'M12 21s-7.5-4.7-7.5-10A4.5 4.5 0 0 1 12 8.2 4.5 4.5 0 0 1 19.5 11c0 5.3-7.5 10-7.5 10z'},
  {k:'setup', t:'设置',     d:'M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm8.4-2.6l1.9 1.4-1.9 3.3-2.2-.9a7.4 7.4 0 0 1-1.9 1.1l-.3 2.4h-3.8l-.3-2.4a7.4 7.4 0 0 1-1.9-1.1l-2.2.9-1.9-3.3 1.9-1.4a7.5 7.5 0 0 1 0-2.2L4.5 9.3l1.9-3.3 2.2.9a7.4 7.4 0 0 1 1.9-1.1l.3-2.4h3.8l.3 2.4a7.4 7.4 0 0 1 1.9 1.1l2.2-.9 1.9 3.3-1.9 1.4a7.5 7.5 0 0 1 0 2.2z'}
];

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v) => { const f = parseFloat(v); return isFinite(f) ? f : 0; };
const r1  = (v) => Math.round(v * 10) / 10;
const gfmt = (v) => (v >= 100 ? Math.round(v) : r1(v)) + ' g';

function normCat(raw) {
  if (typeof raw !== 'string') return 'veg';
  const k = raw.trim().toLowerCase().replace(/\s+/g, '_');
  if (CATS[k]) return k;
  if (CAT_ALIAS[k]) return CAT_ALIAS[k];
  const toks = [['protein','protein'],['meat','protein'],['fish','protein'],['shrimp','protein'],
    ['chicken','protein'],['beef','protein'],['pork','protein'],['carb','carb'],['grain','carb'],
    ['veg','veg'],['fruit','veg'],['fat','fat'],['oil','fat'],['season','season'],
    ['spice','season'],['salt','season']];
  for (const [t, c] of toks) if (k.indexOf(t) >= 0) return c;

}

function cleanAlt(raw, cat) {
  const out = [];
  if (!Array.isArray(raw)) return out;
  for (const it of raw) {
    let n = '', g = 0, note = '';
    if (Array.isArray(it)) { n = String(it[0] || '').trim(); g = num(it[1]); note = String(it[2] || '').trim(); }
    else if (it && typeof it === 'object') {
      n = String(it.n || it.name || '').trim();
      g = num(it.g || it.gram);
      note = String(it.note || it.reason || '').trim();
    }
    if (!n) continue;
    const rg = GRAM_RANGE[cat] || [1, 300];
    if (g <= 0) g = rg[0];
    g = Math.max(rg[0], Math.min(rg[1], g));

   调味料不在其中 —— 盐、油、酸的比例不能跟着总重等比放大或缩小。 */
const FIT_ORDER = ['veg', 'carb', 'protein', 'fat'];

function fitTotal(ing) {
  const lo = TOTAL_RANGE[0], hi = TOTAL_RANGE[1];

  for (const cat of FIT_ORDER) {
    if (need < 0.5) break;
    const group = ing.filter((i) => i.c === cat);
    if (!group.length) continue;
    const rg = GRAM_RANGE[cat] || [1, 300];
    const caps = group.map((i) => Math.max(0, sign > 0 ? rg[1] - i.g : i.g - rg[0]));
    const room = caps.reduce((s, c) => s + c, 0);
    if (room <= 0) continue;
    const move = Math.min(need, room);
    group.forEach((it, k) => { it.g = r1(it.g + sign * move * (caps[k] / room)); });
    need -= move;
  }

  /* 第二轮：逐项四舍五入会留下零点几克的残差。实测出现过「1082g → 1000.1g」
     这种刚好越界的尴尬结果 —— 所以这里必须补到精确落点，不能有容差。
     仍然从蔬菜开始找（不能因为残差就跳去动蛋白或脂肪），找到第一个还有空间的
     食材就把差额一次性补平。 */
  for (let k = 0; k < 8; k++) {
    const diff = r1(target - ing.reduce((s, i) => s + i.g, 0));
    if (diff === 0) break;
    sign = diff > 0 ? 1 : -1;
    let done = false;
    for (const cat of FIT_ORDER) {
      const rg = GRAM_RANGE[cat] || [1, 300];
      const pick = ing.find((i) => i.c === cat &&
        (sign > 0 ? i.g < rg[1] : i.g > rg[0]));
      if (!pick) continue;
      const g = Math.max(rg[0], Math.min(rg[1], r1(pick.g + diff)));
      if (g !== pick.g) { pick.g = g; done = true; break; }
    }
    if (!done) break;                        // 所有类别都到边界了，认了
  }
}

function normalizeDay(raw, meta, plan, sources) {
  const ing = [];
  for (const it of (raw && raw.ing) || []) {
    if (!it || typeof it !== 'object') continue;
    const n = String(it.n || it.name || '').trim();
    if (!n) continue;
    const c = normCat(it.c);
    const rg = GRAM_RANGE[c] || [1, 300];
    let g = num(it.g || it.gram || it.weight);
    if (g <= 0) g = rg[0];
    g = Math.max(rg[0], Math.min(rg[1], g));
    ing.push({ c, n, g: r1(g), note: String(it.note || '').trim(), alt: cleanAlt(it.alt, c) });
  }
  if (!ing.some((i) => i.c === 'carb'))
    ing.push({ c:'carb', n:'糙米（生）', g:50, note:'全谷 · B族与膳食纤维', alt:[] });
  if (!ing.some((i) => i.c === 'veg'))
    ing.push({ c:'veg', n:'西兰花', g:120, note:'萝卜硫素 · 抗氧化', alt:[] });

  /* 总重护栏：模型经常给出略低于下限的结果（实测约每 3 天 1 天），
     之前只是记一条告警，但没有任何界面会显示它 —— 用户拿到的就是一份
     克重不达标的菜谱。这里直接兜住，和 后端/app/chef.py 的 _fit_total 一致。 */
  fitTotal(ing);

  ing.sort((a, b) => CAT_ORDER.indexOf(a.c) - CAT_ORDER.indexOf(b.c));

  const steps = [];
  for (const s of (raw && raw.steps) || []) {
    let t = '', d = '';
    if (s && typeof s === 'object' && !Array.isArray(s)) { t = String(s.t || '').trim(); d = String(s.d || '').trim(); }
    else if (Array.isArray(s) && s.length >= 2) { t = String(s[0] || '').trim(); d = String(s[1] || '').trim(); }
    else continue;
    if (d) steps.push({ t: t || ('步骤' + (steps.length + 1)), d });
  }

  const hl = [];
  for (const h of (raw && raw.hl) || []) {
    if (!h || typeof h !== 'object') continue;
    const n = String(h.n || '').trim(), d = String(h.d || '').trim();
    if (!n || !d) continue;
    let i = String(h.i || 'veg').trim().toLowerCase();
    if (!VALID_HL.has(i)) i = meta.type === 'fish' ? 'fish' : 'veg';
    hl.push({ i, n, d });
    if (hl.length >= 4) break;
  }
  if (!hl.length) hl.push({ i: meta.type, n: meta.tn,
    d: '优质蛋白来源，少油烟烹饪更好保留营养。' });

  const chef = (raw && typeof raw.chef === 'object' && raw.chef) || {};
  const total = r1(ing.reduce((s, i) => s + i.g, 0));

  return {
    id: meta.id, wk: meta.wk, en: meta.en, type: meta.type, tn: meta.tn,
    title: String((raw && raw.title) || (meta.wk + '地中海午餐')).trim(),
    sub: String((raw && raw.sub) || '').trim(),
    method: String((raw && raw.method) || '烤 · 煮').trim(),
    /* 烹饪耗时（分钟）。模型没给就是 0 —— 详情页按「没有就不显示」处理，
       绝不编一个数字出来（老菜单与内置保底菜谱都没有这个字段）。 */
    time: Math.max(0, Math.round(num(raw && raw.time))),
    tags: (((raw && raw.tags) || []).map((t) => String(t).trim()).filter(Boolean)).slice(0, 4),
    kcal: Math.round(num(raw && raw.kcal)),
    p: r1(num(raw && raw.p)), c: r1(num(raw && raw.c)),
    f: r1(num(raw && raw.f)), fb: r1(num(raw && raw.fb)),
    img: meta.type,
    ing, steps, hl, total_g: total,
    chef: { say: String(chef.say || '').trim(), ref: String(chef.ref || '').trim() },
    sources: collectSources(raw, sources),
    plan: plan, servings: COMPANY
  };
}

function collectSources(raw, sources) {
  const seen = new Set(), out = [];
  for (const s of sources || []) {
    const link = String(s.link || '').trim();
    if (!link || seen.has(link)) continue;
    seen.add(link);
    out.push({ title: String(s.title || '').trim().slice(0, 80), link, media: String(s.media || '').trim() });
    if (out.length >= 6) break;
  }
  for (const s of ((raw && raw.sources) || [])) {
    const link = String(s).trim();
    if (link.indexOf('http') !== 0 || seen.has(link)) continue;
    seen.add(link);
    out.push({ title:'', link, media:'' });
    if (out.length >= 8) break;
  }
  return out;
}

/* =========================================================================
   3. 智谱 API —— 浏览器直连，无需后端
   ========================================================================= */
class ApiError extends Error {
  constructor(msg, code) { super(msg); this.name = 'ApiError'; this.code = code; }
}

/* ---------------------------------------------------------------------------
   Key 混淆（注意：是混淆，不是加密）

   静态页面里的 Key 做不到真正加密 —— 浏览器必须能还原出明文才能发请求，
   所以解码逻辑必然也在页面里。做成混淆能挡住的是：
     · GitHub / 各类 secret scanning（明文 Key 推上公开仓库可能被服务商自动吊销）
     · 打开 F12 直接搜 key 字符串、搜源码的复制粘贴党
   挡不住的是：懂技术的人看 Network 面板里的 Authorization 头，照样能拿到。
   所以这只是「提高门槛 + 避免被自动吊销」，不是安全方案。真正要安全请用后端模式。
   --------------------------------------------------------------------------- */
const OBF_MARK = 'OBF1:';
const OBF_SALT = 'mediterranean-lunch-2026';

function deobfKey(v) {
  const s = String(v == null ? '' : v);
  if (s.indexOf(OBF_MARK) !== 0) return s;        // 明文（本地开发用），原样返回
  try {
    const raw = atob(s.slice(OBF_MARK.length));
    let out = '';
    for (let i = 0; i < raw.length; i++) {
      out += String.fromCharCode(raw.charCodeAt(i) ^ OBF_SALT.charCodeAt(i % OBF_SALT.length));
    }
    return out;
  } catch (e) {
    return '';                                     // 解不出来就当没有 Key，别把乱码发出去
  }
}

function apiKey() {
  const def = deobfKey(DEFAULT_KEY);
  try { return localStorage.getItem(LS.key) || def; } catch (e) { return def; }
}
/* AI 配图用的 SiliconFlow Key：用户填的优先，其次才是页面内置的（打包时混淆） */
function imgKey() {
  const def = deobfKey(DEFAULT_IMG_KEY);
  try { return localStorage.getItem(LS.imgkey) || def; } catch (e) { return def; }
}
/* 默认主厨模型：glm-4.5-air。
   实测（2026-09-28）它比 glm-4.7 快 3 倍（20.5s vs 60.2s）、并发 ≥8（4.7 只有 2），
   而且一人份总重 662g、蔬菜 280g 都达标（glm-4.7 反而 525g/240g 都不达标）。
   用户在「设置」里改过就以他的为准（存 localStorage，优先级最高）。 */
const CHAT_MODEL_DEFAULT = 'glm-4.5-air';
function chatModel() {
  try { return localStorage.getItem(LS.model) || MODELS.chat || CHAT_MODEL_DEFAULT; }
  catch (e) { return MODELS.chat || CHAT_MODEL_DEFAULT; }
}

function extractJson(text) {
  if (!text) throw new ApiError('模型返回内容为空');
  let s = String(text).trim();
  const fence = s.match(/^```(?:json|JSON)?\s*([\s\S]*?)\s*```$/);
  if (fence) s = fence[1].trim();
  try { const o = JSON.parse(s); if (o && typeof o === 'object' && !Array.isArray(o)) return o; } catch (e) {}
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a !== -1 && b > a) {
    let cand = s.slice(a, b + 1);
    try { const o = JSON.parse(cand); if (o && !Array.isArray(o)) return o; } catch (e) {}
    cand = cand.replace(/,\s*([}\]])/g, '$1');
    try { const o = JSON.parse(cand); if (o && !Array.isArray(o)) return o; } catch (e) {
      throw new ApiError('模型输出的 JSON 无法解析');
    }
  }
  throw new ApiError('模型输出中未找到 JSON 对象');
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* 统一传输层，两种模式共用：
     direct  → 直连智谱，每个请求带 Authorization
     backend → 调自己的后端，不带 Key（Key 只在服务端） */
/* ---------------------------------------------------------------------------
   全局限流闸门

   智谱的 429 是**按账号**限的：同一批并发请求里只要一个撞了限流，其他的多半也会撞。
   如果各退各的，它们会「同时退避 → 同时重试 → 再同时撞上」，重试几乎必然失败。
   所以撞到 429 就做**全局冷却**：所有请求一起等，等完再依次发。
   --------------------------------------------------------------------------- */
let gateUntil = 0;
async function gateWait() {
  const d = gateUntil - Date.now();
  if (d > 0) await sleep(d);
}
function gateCool(ms) {
  gateUntil = Math.max(gateUntil, Date.now() + ms);
}

async function request(path, method, body, timeoutMs) {
  const m = (method || 'POST').toUpperCase();
  const hasBody = !(m === 'GET' || m === 'HEAD' || body == null);
  /* 没有 body 就不发 Content-Type —— 否则 GET 也会变成「非简单请求」，
     凭空多一次 OPTIONS 预检。 */
  const headers = {};
  if (hasBody) headers['Content-Type'] = 'application/json';
  if (!USE_BACKEND) {
    const key = apiKey();
    if (!key) throw new ApiError('没有可用的 API Key，请到「设置」里填写。', 'nokey');
    headers['Authorization'] = 'Bearer ' + key;
  }

  await gateWait();                  // 撞过限流就先一起等，别贴着打

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 300000);
  let resp;
  try {
    resp = await fetch(API_BASE + path, {
      method: m,
      headers,
      body: hasBody ? JSON.stringify(body) : undefined,
      signal: ctrl.signal
    });
  } catch (e) {
    clearTimeout(timer);
    if (e && e.name === 'AbortError') throw new ApiError('请求超时，请稍后重试。', 'timeout');
    throw new ApiError('网络不可达：' + (e && e.message ? e.message : e) +
      (USE_BACKEND
        ? '（请确认后端地址填对了、云托管实例已启动；若刚部署完请等 1–2 分钟）'
        : '（请检查网络，或浏览器插件是否拦截了跨域请求）'), 'network');
  }
  clearTimeout(timer);

  const text = await resp.text();
  if (resp.status === 200) {
    try { return JSON.parse(text); } catch (e) { throw new ApiError('上游返回了非 JSON 内容'); }
  }
  let detail = text.slice(0, 300);
  try {
    const j = JSON.parse(text);
    detail = (j.error && (j.error.message || j.error.code)) || j.detail || detail;
  } catch (e) {}
  if (resp.status === 401) throw new ApiError('API Key 无效或已过期（401）：' + detail, 'auth');
  if (resp.status === 429) {
    /* 智谱的 1302 是「速率限制」：冷却太短会刚放开就又撞上。
       给 5–8 秒，且是**全局**的 —— 所有请求一起等，比各自退避更有效。 */
    gateCool(5000 + Math.random() * 3000);
    throw new ApiError('触发了并发/频率限制（429），稍后会自动重试', 'rate');
  }
  if (USE_BACKEND && resp.status === 404) {
    throw new ApiError('后端没有这个接口（404）：' + detail +
      '（请确认 BACKEND_BASE 指向的是 后端/ 这个服务，且已重新部署最新代码）', '404');
  }
  if (USE_BACKEND && resp.status === 409) {
    throw new ApiError(detail || '该方案还没有菜单，请先生成本周菜单', '409');
  }
  throw new ApiError('HTTP ' + resp.status + '：' + detail, String(resp.status));
}

function post(path, body, timeoutMs) { return request(path, 'POST', body, timeoutMs); }

/* 后端的慢接口一律是「异步任务」：POST 立刻返回 {id, status}，结果在 job.result。
   这样做是为了绕开微信云托管 callContainer 的 15 秒硬上限 —— 提交和轮询都是亚秒级。
   提交时若后端直接给出了 result（命中缓存 / 复用进行中的任务），就不用轮询了。
   POLL_MS / JOB_TIMEOUT_MS 可在 CONF 或 HL_CONF 里覆盖（测试用）。 */
const JOB_POLL_MS    = Math.max(0, num(CONF.POLL_MS) || 1200);
const JOB_TIMEOUT_MS = num(CONF.JOB_TIMEOUT_MS) || 10 * 60 * 1000;

async function runJob(path, data, onProgress) {
  const job = await request(path, 'POST', data);
  if (!job || !job.id) return job;
  if (job.status === 'done') return job.result === undefined ? null : job.result;
  if (job.status === 'error') throw new ApiError(job.error || job.message || '任务失败');

  const t0 = Date.now();
  for (;;) {
    await sleep(JOB_POLL_MS);
    const j = await request('/api/job/' + encodeURIComponent(job.id), 'GET');
    if (onProgress) onProgress(j);
    if (j.status === 'done') return j.result === undefined ? null : j.result;
    if (j.status === 'error') throw new ApiError(j.error || j.message || '任务失败');
    if (Date.now() - t0 > JOB_TIMEOUT_MS) {
      throw new ApiError('任务等待超时。后端可能还在跑，稍后刷新菜单页看看。', 'timeout');
    }
  }
}

/* 后端返回的相对地址（如 /api/image/xxx.png）要补上 BACKEND_BASE */
function backendUrl(u) {
  if (!u) return '';
  const s = String(u);
  if (/^https?:\/\//i.test(s) || s.indexOf('data:') === 0) return s;
  return API_BASE + (s.charAt(0) === '/' ? s : '/' + s);
}

/* 调模型并拿到 JSON。search=true 时挂上联网检索工具。 */
async function chatJson(system, user, opts) {
  opts = opts || {};
  const maxRetry = opts.retry == null ? 3 : opts.retry;
  const base = {
    model: opts.model || chatModel(),
    messages: [{ role:'system', content: system }, { role:'user', content: user }],
    max_tokens: 8192,
    temperature: opts.temperature == null ? 0.65 : opts.temperature,
    stream: false
  };
  if (opts.search !== false) {
    base.tools = [{ type:'web_search', web_search: {
      enable:true, search_engine:'search_pro', search_result:true,
      count: W.searchCount || 6, content_size:'high', search_recency_filter:'noLimit'
    }}];
  }
  /* glm-4.7 支持关闭思考；若上游不认这个参数（1210），去掉再试一次 */
  let withThinking = true;

  let lastErr = null;
  for (let attempt = 1; attempt <= maxRetry; attempt++) {
    const body = Object.assign({}, base);
    if (withThinking) body.thinking = { type:'disabled' };
    try {
      const data = await post('/chat/completions', body);
      const msg = (data.choices && data.choices[0] && data.choices[0].message) || {};
      const text = msg.content || '';
      try {
        return { json: extractJson(text), sources: data.web_search || [], raw: text };
      } catch (e) {
        lastErr = e;
        if (attempt < maxRetry) { await sleep(Math.min(Math.pow(2, attempt) * 1000 + Math.random() * 800, 12000)); continue; }
        throw e;
      }
    } catch (e) {
      lastErr = e;
      const m = String(e && e.message || '');
      if (/1210|thinking/i.test(m)) { withThinking = false; continue; }
      const retriable = e.code === 'rate' || e.code === 'timeout' || e.code === 'network' ||
        /^5\d\d$/.test(e.code || '');
      if (!retriable || attempt >= maxRetry) throw e;
      await sleep(Math.min(Math.pow(2, attempt) * 1000 + Math.random() * 800, 12000));
    }
  }
  throw lastErr || new ApiError('重试多次后仍然失败');
}

async function generateDay(meta, plan, avoid, extra) {
  const style = (PLANS[plan] || {}).style || '';
  const user = buildDayPrompt(meta, style, avoid, COMPANY, extra);
  const r = await chatJson(PROMPTS.chefSystem, user, { search:true });
  let day = normalizeDay(r.json, meta, plan, r.sources);
  if (!day.sources.length) {
    // 没检索到来源：强制重试一次，避免幻觉
    const again = await chatJson(PROMPTS.chefSystem,
      user + '\n\n注意：上一次你没有真正执行联网搜索。请务必先调用联网搜索工具检索真实菜谱，并在 sources 字段给出真实链接。',
      { search:true });
    const d2 = normalizeDay(again.json, meta, plan, again.sources);
    if (d2.sources.length) return d2;
  }
  return day;
}

/* =========================================================================
   AI 配图（直连模式）· SiliconFlow（硅基流动）

   为什么换掉 Pollinations：
   - 它曾经提供 FLUX，但 2026-10 实测 `https://image.pollinations.ai/models`
     只返回 `["sana"]`，而且 **`model` 参数被完全忽略** ——
     flux / turbo / z-image-turbo 三个名字返回的文件 **md5 一模一样**，
     也就是说页面上写的模型名是假的，根本拿不到想要的画质。

   为什么用 SiliconFlow：
   - 浏览器可直连（实测预检 `Access-Control-Allow-Origin: *`、`Allow-Headers: *`）；
   - 出图质量明显更好，免费额度按天计；
   - 返回的图片**支持跨域读取**（ACAO 回显 Origin），所以能把图压成小图
     长期存在浏览器里，不必反复生成。

   ⚠️ **FLUX 已经在硅基流动下架**：2026-10 实测
     `black-forest-labs/FLUX.1-schnell` → `{"code":30003,"message":"Model disabled."}`。
     现在可用的是下面 IMG_SF_MODELS 里的四个，默认 Z-Image-Turbo。

   ⚠️ 它**不是**「URL 即图片」：要 POST 一次，拿回一个**会过期**的链接
     （Z-Image / Qwen 约 24 小时，Kolors 只有 1 小时）。所以必须自己缓存 ——
     见 imgCache：能取到字节就压成 data URL 长期留着，
     取不到就退化成「只存链接 + 过期后重新生成」。
   ========================================================================= */
const IMG_SF_BASE = 'https://api.siliconflow.cn/v1';
const IMG_SF_API = IMG_SF_BASE + '/images/generations';
/* id 必须与硅基流动「模型广场 → 生图」里的一致，写错会返回 Model disabled */
const IMG_SF_MODELS = [
  { id: 'Tongyi-MAI/Z-Image-Turbo', n: 'Z-Image-Turbo · 快、稳（默认）',  sz: '1024x1024' },
  { id: 'Tongyi-MAI/Z-Image',       n: 'Z-Image · 更细腻',                sz: '1024x1024' },
  { id: 'Qwen/Qwen-Image',          n: 'Qwen-Image · 细节最好，稍慢',      sz: '1328x1328' },
  { id: 'Kwai-Kolors/Kolors',       n: 'Kolors · 风格化，链接只留 1 小时', sz: '1024x1024' }
];
const IMG_SF_DEFAULT = 'Tongyi-MAI/Z-Image-Turbo';
const IMG_SF_STEPS = 20;
/* 链接有效期最短的是 Kolors（1 小时），统一按 50 分钟算，留足余量 */
const IMG_SF_TTL = 50 * 60 * 1000;
const IMG_API = IMG_SF_API;                 // 兼容旧引用
const IMG_MODEL = USE_BACKEND ? (MODELS.image || 'cogview-3-flash') : IMG_SF_DEFAULT;

/* 当前用哪个图像模型（设置里可换）。后端模式由服务端决定，前端不参与。 */
function imgModel() {
  if (USE_BACKEND) return MODELS.image || 'cogview-3-flash';
  try { return localStorage.getItem(LS.imgmodel) || IMG_SF_DEFAULT; }
  catch (e) { return IMG_SF_DEFAULT; }
}
/* 请求尺寸：每种模型推荐的尺寸不一样（Qwen-Image 用 1328x1328 才不糊） */
function imgSize() {
  const m = IMG_SF_MODELS.filter((x) => x.id === imgModel())[0];
  return (m && m.sz) || '1024x1024';
}

/* 同一道菜必须稳定出同一张图，否则每次刷新都换一张脸。
   所以 seed 由菜名 + 做法派生（FNV-1a），不用随机数。 */
function imgSeed(day) {
  /* 两种来源，优先级从高到低：
     ① 菜单自带 img_seed —— **每次生成菜单时都会重新随机**，
        保证「换了菜单就换图」，而不是菜名没变就永远是同一张
        （新种子 → 缓存键变了 → 缓存未命中 → 重新生成）；
     ② 都没有（内置保底菜单）→ 由菜名 + 做法派生，保持稳定。 */
  if (day.img_seed) return day.img_seed;
  const s = (day.title || '') + '|' + (day.method || '');
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h % 1000000;
}

/* 直连模式的配图地址：命中缓存就返回它，否则返回空串 ——
   先显示本地占位图，等串行队列真正生成好再淡入。 */
function imgUrlFor(day) {
  return imgCacheGet(day);
}

/* 渲染时 <img> 的 src 到底放哪张：
   · 命中本地缓存（data URL）→ **直接放真图**。它是同步可用的，
     首帧就是最终态，用户完全看不到「换图」这一步。
   · 其它（还没生成、或只是网络地址）→ 放本地占位图打底。
     网络地址不能直接放：那样卡片会先空一块再出图，比现在还差。 */
function imgDisplaySrc(url, thumb) {
  return isDataUrl(url) ? url : (thumb || '');
}

function isDataUrl(u) {
  return typeof u === 'string' && u.indexOf('data:') === 0;
}

/* ---- AI 配图的本地缓存 ----
   键 = 模型 + 尺寸 + seed + 提示词 的 FNV-1a 哈希 —— 同一道菜只会真正调一次接口。
   值 = {u: 图片链接, d: 压好的小图 data URL（可选）, t: 生成时间}。
   读取优先级：data URL（永不过期）> 链接（TTL 内）> 没有（重新生成）。 */
function imgHash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16);
}
function imgCacheKey(day) {
  return imgHash(imgModel() + '|' + imgSize() + '|' + imgSeed(day) + '|' + imgPrompt(day));
}
function imgCacheGet(day) {
  const e = state.imgCache[imgCacheKey(day)];
  if (!e) return '';
  if (e.d) return e.d;                                     // 压好的小图，永不过期
  if (e.u && Date.now() - (e.t || 0) < IMG_SF_TTL) return e.u;
  return '';                                               // 链接过期了，当作没有
}
function imgCachePut(day, url, dataUrl) {
  if (!url && !dataUrl) return;
  const k = imgCacheKey(day);
  /* 上限 30 条：data URL 一条几十 KB，不设上限会把 localStorage 撑爆 */
  const keys = Object.keys(state.imgCache);
  if (keys.length >= 30 && !state.imgCache[k]) {
    keys.sort((a, b) => (state.imgCache[a].t || 0) - (state.imgCache[b].t || 0));
    for (let i = 0; i < 5; i++) delete state.imgCache[keys[i]];
  }
  state.imgCache[k] = { u: url || '', d: dataUrl || '', t: Date.now() };
  writeImgCache();
}

/* 把生成出来的图取回本地并压成 JPEG data URL。
   s3.siliconflow.cn 实测允许跨域读取，所以能 drawImage + toDataURL；
   任何一步失败（CORS、画布被污染、浏览器不支持）都返回空串，
   外层会退化成「只存链接」。 */
function shrinkImage(url) {
  return new Promise((resolve) => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    const timer = setTimeout(() => { im.src = ''; resolve(''); }, 20000);
    im.onerror = () => { clearTimeout(timer); resolve(''); };
    im.onload = () => {
      clearTimeout(timer);
      try {
        const max = 640;
        const sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        const w = Math.max(1, Math.round(im.naturalWidth * sc));
        const h = Math.max(1, Math.round(im.naturalHeight * sc));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        if (!ctx) return resolve('');
        ctx.drawImage(im, 0, 0, w, h);
        const d = cv.toDataURL('image/jpeg', 0.82);
        resolve(d && d.length > 64 ? d : '');
      } catch (e) { resolve(''); }
    };
    im.src = url;
  });
}

/* 调 SiliconFlow 生成一张图。
   ⚠️ 返回的链接**会过期**，所以顺手写进本地缓存；能压就再存一份 data URL。 */
async function sfGenerate(day) {
  const key = imgKey();
  if (!key) throw new ApiError('没有 SiliconFlow API Key —— 请在「设置 → AI 配图」里填一个。');
  const body = {
    model: imgModel(),
    prompt: imgPrompt(day),
    image_size: imgSize(),
    num_inference_steps: IMG_SF_STEPS,
    seed: imgSeed(day)
  };
  let res;
  try {
    res = await fetch(IMG_SF_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify(body)
    });
  } catch (e) {
    throw new ApiError('连不上 SiliconFlow（网络或跨域被拦），请稍后重试。');
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* 有的错误直接返回纯文本，忽略 */ }
  const code = data && data.code;
  if (!res.ok || (code && code !== 200)) {
    const msg = (data && data.message) || '';
    if (res.status === 429) throw new ApiError('SiliconFlow 免费额度用满或触发限流，请稍后再试。');
    if (code === 30014) throw new ApiError('SiliconFlow Key 无效，请在「设置」里更新。');
    if (code === 30003) throw new ApiError('这个图像模型已下架，请在「设置」里换一个。');
    if (res.status === 503 || code === 50505) throw new ApiError('SiliconFlow 模型繁忙，请稍后重试。');
    throw new ApiError('配图生成失败（' + res.status + '）：' + (msg || '未知错误'));
  }
  const url = (data && data.images && data.images[0] && data.images[0].url) || '';
  if (!url) throw new ApiError('SiliconFlow 没有返回图片地址。');
  const dataUrl = await shrinkImage(url);
  imgCachePut(day, url, dataUrl);
  return dataUrl || url;
}

/* 取这张图：命中缓存直接用，否则现生成一次。
   同一个键的并发调用复用同一个 Promise，避免重复烧额度。 */
const imgInflight = {};
async function ensureAiImage(day) {
  const hit = imgCacheGet(day);
  if (hit) return hit;
  const k = imgCacheKey(day);
  if (imgInflight[k]) return imgInflight[k];
  const p = sfGenerate(day);
  imgInflight[k] = p;
  try { return await p; } finally { delete imgInflight[k]; }
}

/* 「生成」= 用 <img> 预加载。 */
function preloadImage(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    const t = setTimeout(() => {
      im.src = '';
      reject(new ApiError('配图生成超时，请重试'));
    }, timeoutMs || 120000);
    im.onload = () => { clearTimeout(t); resolve(); };
    im.onerror = () => { clearTimeout(t); reject(new ApiError('配图生成失败，请稍后重试')); };
    im.src = url;
  });
}

async function generateImage(day) {
  const url = await ensureAiImage(day);
  await preloadImage(url);
  return url;
}

/* ---------------------------------------------------------------------------
   图片串行队列

   SiliconFlow 的并发限制比想象中严：实测**并发 4 个请求有 3 个直接 429**，
   只有串行（一次一个）才稳。所以图片不能交给浏览器并发去拉 ——
   渲染时把 AI 图地址放在 data-src 上，渲染完统一入队、**一张一张地加载**。

   体验上：src 先放本地占位图（秒开、不依赖网络），AI 图加载好后再无缝替换过去；
   加载失败就保持占位图，不会出现破图。
   --------------------------------------------------------------------------- */
const imgQueue = [];
let imgPumping = false;
const IMG_TRIES = 3;

/* 真图就绪后**淡入**，而不是「啪」地切过去。
   底层是容器上的占位图 background-image（全程不动），真图作为 <img> 盖在上面
   从 opacity:0 过渡到 1 —— 视觉上就是两张图交叉淡化。 */
const raf2 = (typeof requestAnimationFrame === 'function')
  ? (f) => requestAnimationFrame(() => requestAnimationFrame(f))
  : (f) => setTimeout(f, 32);

function revealImg(el) {
  if (!el || !el.isConnected || el.classList.contains('is-in')) return;
  /* ⚠️ 必须是**两次** rAF：一次的话回调跑在下一帧绘制之前，
     浏览器还没机会按 opacity:0 画过一次，过渡就整个被跳过（等于还是硬切）。 */
  raf2(() => { if (el.isConnected) el.classList.add('is-in'); });
}

/* 渲染时 src 里已经是真图的（缓存 data URL）—— 同样让它们淡入，
   否则首帧就是最终态、没有过渡，看着还是硬切。 */
function revealReadyImages() {
  const list = document.querySelectorAll('img[data-src]');
  for (let i = 0; i < list.length; i++) {
    const el = list[i];
    if (!el.classList.contains('is-in') && isDataUrl(el.getAttribute('src'))) revealImg(el);
  }
}

function queueImages() {
  /* 每次 render 都会重建 DOM，之前排队的元素已经不在页面上了 —— 直接清掉。
     否则队列会越积越长（每次渲染都要白等一堆已作废的任务），
     而且 imgPumping 迟迟不释放，新图根本轮不上。 */
  imgQueue.length = 0;
  const list = document.querySelectorAll('img[data-src]:not([data-queued])');
  for (let i = 0; i < list.length; i++) {
    const el = list[i];
    el.setAttribute('data-queued', '1');
    imgQueue.push({
      el: el,
      url: el.getAttribute('data-src'),
      /* AI 配图的任务一开始没有 url（要现生成），得知道是哪一天的菜 */
      dayId: el.getAttribute('data-day')
    });
  }
  pumpImages();
}

async function pumpImages() {
  if (imgPumping) return;
  imgPumping = true;
  while (imgQueue.length) {
    await loadOneImage(imgQueue.shift());
    await sleep(400);                 // 张与张之间留个间隔，别贴着打
  }
  imgPumping = false;
}

/* 串行性的自检计数：同一时刻在跑的 loadOneImage 数量，峰值应当恒为 1。
   放在页面代码里而不是测试桩里 —— 测试桩的回调会跨渲染互相干扰，数不准。 */
let imgLoading = 0;
let imgMaxLoading = 0;

async function loadOneImage(job) {
  /* 元素已经被下一次渲染换掉 —— 直接跳过，否则会占着队列白等 120 秒超时。 */
  if (!job.el.isConnected) return;

  let url = job.url;
  /* 直连模式 · AI 配图：地址是「现生成」的（SiliconFlow 要先 POST 一次），
     所以队列里的任务一开始没有 url —— 在这里生成，成功后再加载。
     生成失败就保持本地占位图，绝不出现破图。 */
  if (!url && !USE_BACKEND && state.imgSrc === 'ai' && job.dayId) {
    const d = day(state.plan, job.dayId);
    if (!d) return;
    try { url = await ensureAiImage(d); } catch (e) { url = ''; }
  }
  if (!url || !job.el.isConnected) return;

  await new Promise((resolve) => {
    let tries = 0;
    imgLoading++;
    if (imgLoading > imgMaxLoading) imgMaxLoading = imgLoading;
    const attempt = () => {
      const im = new Image();
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        imgLoading--;
        /* 成功就换成 AI 图并淡入；失败保持本地占位图，绝不出现破图 */
        if (ok && job.el.isConnected) { job.el.src = url; revealImg(job.el); }
        resolve();
      };
      const timer = setTimeout(() => { im.src = ''; finish(false); }, 120000);
      im.onload = () => { clearTimeout(timer); finish(true); };
      im.onerror = () => {
        clearTimeout(timer);
        if (done) return;
        tries++;
        /* 失败多半是限流：退避要够长（3s / 6s），太短会刚放开又撞上 */
        if (tries < IMG_TRIES) setTimeout(attempt, 3000 * tries);
        else finish(false);
      };
      im.src = url;
    };
    attempt();
  });
}

/* 配图提示词：**必须用英文**。
   FLUX 这类扩散模型对中文理解很差 —— 实测拿纯中文提示词要「烤青花鱼美食照」，

/* 把中文串里的已知词换成英文；括号里的补充说明（如「青花鱼（鲭鱼，净肉）」）先丢掉 */
function trEn(s) {
  let out = String(s || '').replace(/[（(][^）)]*[）)]/g, ' ');
  Object.keys(IMG_EN).forEach((k) => {
    if (out.indexOf(k) >= 0) out = out.split(k).join(' ' + IMG_EN[k] + ' ');
  });
  return out.replace(/[（）]/g, ' ').replace(/\s+/g, ' ').trim();
}

function imgPrompt(day) {
  const ing = (day.ing || []).filter((i) => i.c !== 'season').slice(0, 7)
    .map((i) => trEn(i.n)).filter(Boolean);
  const lines = [
    'Professional food photography, 45-degree overhead shot, light ceramic plate on a rustic wooden table, natural side light, soft shadows, clean background, elegant plating.',
    'Dish: ' + trEn(day.title || '') + (day.sub ? ', ' + trEn(day.sub) : ''),
    'Main ingredients: ' + ing.join(', '),
    'Cooking method: ' + trEn(day.method || ''),
    'Mediterranean healthy cuisine, fresh ingredients, natural colors, no extra decoration.',
    'No text, no letters, no numbers, no logo, no watermark, no people, no hands.'
  ];
  return lines.join('\n');
}

/* =========================================================================
   3.5 真实照片 · 做法视频（TheMealDB）

   为什么选 TheMealDB：
   - 免费、**不需要 API Key**、CORS 全放行（`Access-Control-Allow-Origin: *`），
     连 file:// 双击打开都能用；
   - 返回的是**真实拍摄的菜品照片**（不是 AI 生成），还带完整菜谱与 YouTube 视频；
   - 实测国内可**直连**（不需要代理）。

   为什么不用维基共享资源 / Unsplash / Pexels：
   - commons.wikimedia.org、upload.wikimedia.org 国内实测**完全连不通**
     （curl 直连返回 000），放进来等于永远加载不出图；
   - Unsplash / Pexels 都要 API Key，配额与「公开分享、零配置可用」冲突。

   ⚠️ TheMealDB 只认**英文**（中文关键词一律返回 null），查询词必须走 IMG_EN 翻译。
   ⚠️ 匹配必须**同时看食材和做法**：只按食材匹配时，「烤青花鱼」会配上一张葡式炖鱼、
      「烤猪里脊」会配到 BBQ 猪排 —— 用户明确反馈过这个问题。见下面 scoreRealMatch()。
   ⚠️ 照片是「同做法的相近菜品」，**不是这道菜的实拍** —— 界面上必须标注来源，
      不要为了好看写成「本菜实拍」，这是诚信问题。
   ========================================================================= */
const MEAL_API = 'https://www.themealdb.com/api/json/v1/1/';
const MEAL_SITE = 'https://www.themealdb.com/meal/';

/* 荤菜大类 → TheMealDB 的食材词。注意 `fish` 在库里**查不到**（返回 null），
   必须落到具体的鱼名；实测 mackerel=1 / cod=2 / haddock=1 / white fish=3 / tuna=3 / sardine=0。 */
const MEAL_PROTEIN = {
  fish:    ['mackerel', 'cod', 'haddock', 'tuna', 'white fish'],
  shrimp:  ['prawns', 'shrimp'],

/* ---------------------------------------------------------------------------
   做法匹配（2026-09-28）

   用户的原话：「图片应该和这个做法相同」「直接搜鱼做法出来太多结果了，
   很多都不是我想要的做法」—— 所以光按食材匹配是不够的。
   实测只按食材 + 菜系排序时，「烤青花鱼」配到一张葡式炖鱼、「烤猪里脊」配到
   「BBQ Pork Sloppy Joes」。下面这套规则先在本地把候选**按做法筛一遍**，
   筛不出及格的宁可退回 AI 图，也不放一张做法不对的。

/* method 的第一段 → 烹饪方式。菜谱的 method 形如「烤 · 煮 · 凉拌」，取第一段作主做法。 */
const TECH_ORDER = [['凉拌', 'salad'], ['焯水', 'blanch'], ['白灼', 'poach'], ['蒸', 'steam'],
                    ['炖煮', 'stew'], ['炖', 'stew'], ['煮', 'boil'], ['烤', 'roast'], ['拌', 'salad']];
/* 每类做法在英文菜名里可能出现的词 */
const TECH_WORDS = {

/* 做法的中文标签（界面文案用） */
const TECH_CN = { roast: '烤箱烘烤', steam: '蒸制', boil: '水煮', poach: '白灼', blanch: '焯水',
                  stew: '炖煮', salad: '凉拌', any: '零油烟' };
/* 零油烟否决词：命中即淘汰。本项目只做烤箱/蒸/煮/白灼/焯水/炖煮/凉拌，
   所以煎炸、烧烤、甜点、面包、意面/饭类一律不要。 */
const MEAL_REJECT = ['fried', 'fry', 'deep fried', 'deep-fried', 'tempura', 'katsu', 'karaage',
  'fritter', 'fritters', 'croquette', 'schnitzel', 'nugget', 'nuggets', 'bbq', 'barbecue',

  'spaghetti', 'cannelloni', 'gnocchi'];
/* 汤水/焖饭类：与「烤 / 蒸 / 白灼 / 凉拌」互斥（实测不判就会把烤青花鱼配成葡式炖鱼） */
const MEAL_WET = ['stew', 'stewed', 'casserole', 'hotpot', 'soup', 'broth', 'curry', 'braised',
  'braise', 'tagine', 'pilaf', 'rice', 'biryani', 'dumpling', 'dumplings', 'congee', 'porridge'];
/* 干烤类：与「炖煮」互斥 */
const MEAL_DRY = ['roast', 'roasted', 'grilled', 'grill', 'baked', 'bake', 'charred', 'traybake',
  'toasted', 'toast', 'fried', 'fry'];
/* 荤菜证据词：菜名里必须至少命中一个，否则这张图压根不是这道菜的荤菜 */
const MEAL_MEAT = {
  fish:    ['fish', 'mackerel', 'cod', 'haddock', 'tuna', 'sardine', 'sardines', 'anchovy',
            'anchovies', 'bream', 'sea bass', 'seabass', 'trout', 'halibut', 'squid', 'octopus',
            'seafood', 'salmon', 'herring', 'pollock', 'plaice', 'monkfish', 'snapper', 'tilapia',
            'swordfish', 'catfish', 'carp'],
  shrimp:  ['prawn', 'prawns', 'shrimp', 'shrimps', 'langoustine', 'scampi', 'crayfish', 'seafood'],
  chicken: ['chicken', 'turkey', 'poultry'],
  beef:    ['beef', 'steak', 'veal', 'brisket', 'shank', 'oxtail', 'mince', 'minced'],
  pork:    ['pork', 'ham', 'bacon', 'gammon', 'chorizo', 'sausage', 'prosciutto', 'pancetta',
            'carnitas', 'lardon', 'lardons', 'speck']
};
/* 风味词：菜名里出现、且也出现在这道菜自己的菜名/食材里，才算「风味也对得上」 */
const MEAL_FLAVOR = ['lemon', 'rosemary', 'oregano', 'thyme', 'basil', 'parsley', 'fennel', 'dill',
  'mint', 'coriander', 'garlic', 'tomato', 'olive', 'herb', 'herbs', 'pepper', 'paprika', 'cumin',
  'cinnamon', 'saffron', 'yogurt', 'yoghurt', 'honey', 'mustard', 'dijon', 'sherry', 'wine',
  'chilli', 'chili', 'ginger', 'sesame', 'coconut', 'lime', 'orange', 'bay', 'sage', 'tarragon',
  'caper', 'vinegar', 'tahini', 'harissa'];
/* 地中海/南欧优先：气质更接近本项目（少油烟、橄榄油、柠檬、香草） */
const MEAL_MED = ['greek', 'italian', 'spanish', 'moroccan', 'turkish', 'french', 'portuguese',
  'croatian', 'lebanese', 'egyptian', 'tunisian', 'syrian', 'algerian', 'israeli', 'jordanian',
  'libyan', 'cypriot', 'maltese', 'albanian', 'slovenian', 'montenegrin'];
const MEAL_MED_C = ['greece', 'italy', 'spain', 'morocco', 'turkey', 'france', 'portugal',
  'croatia', 'lebanon', 'egypt', 'tunisia', 'syria', 'cyprus', 'malta', 'algeria', 'israel',
  'jordan', 'libya', 'albania', 'slovenia', 'montenegro'];
/* 一天最多试几个查询词。食材词里有不少 TheMealDB 根本没收录（实测 wheat / pasta /
   beef shank / sardine 都是 null），不设上限的话一天能发十几次请求，太浪费。 */
const MEAL_MAX_Q = 6;
/* 最多保留几张候选图 */
const MEAL_MAX = 8;
/* 及格线：低于这个分数宁可不放图（退回 AI 图），也不放一张做法不对的 */
const MEAL_MIN_SCORE = 5;
/* 翻译后剩下的修饰词/做法词，拿去 TheMealDB 当食材查是查不到的（会捞回不相关的东西）。
   例：三色藜麦 → "tricolor quinoa"，整串查不到，拆开后 tricolor 也得滤掉。 */
const MEAL_STOP = ['tricolor', 'colorful', 'extra', 'virgin', 'skinless', 'mixed', 'whole',
  'with', 'and', 'the', 'red', 'purple', 'cold', 'tossed', 'fresh', 'raw',
  'roasted', 'steamed', 'boiled', 'braised', 'poached', 'blanched', 'seared', 'herbs'];

/* 把这道菜翻译成 TheMealDB 的查询词，按命中率从高到低排队 */
function realQueries(day) {
  const out = [];
  const push = (w) => {
    w = String(w || '').toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
    if (w && out.indexOf(w) === -1) out.push(w);
  };
  /* 一个中文食材名翻译后常带修饰词（三色藜麦 → "tricolor quinoa"），
     整串拿去查是查不到的，所以拆开逐个试；
     整串里含修饰词的干脆不试（省一次注定查不到的请求），修饰词本身也滤掉。 */
  const pushIng = (name) => {
    const words = trEn(name).split(' ').filter(Boolean);
    if (!words.some((w) => MEAL_STOP.indexOf(w) >= 0)) push(words.join(' '));
    words.forEach((w) => { if (w.length > 2 && MEAL_STOP.indexOf(w) < 0) push(w); });
  };
  const inCat = (c) => (day.ing || []).filter((i) => i.c === c);
  inCat('protein').forEach((i) => pushIng(i.n));    // ① 具体食材：青花鱼 → mackerel
  (MEAL_PROTEIN[day.img] || []).forEach(push);      // ② 荤菜大类兜底（fish 查不到，必须落到鱼名）
  inCat('carb').forEach((i) => pushIng(i.n));       // ③ 主食：藜麦 / 鹰嘴豆 / 糙米
  inCat('veg').forEach((i) => pushIng(i.n));        // ④ 蔬菜
  return out;
}

/* 这道菜的主做法（method 的第一段）映射到 TECH_WORDS 的 key */
function dayTechnique(day) {
  const first = String((day && day.method) || '').split(/[·・]/)[0].trim();
  for (let i = 0; i < TECH_ORDER.length; i++) {
    if (first.indexOf(TECH_ORDER[i][0]) !== -1) return TECH_ORDER[i][1];
  }
  return 'any';
}

/* 这道菜「自己的」风味串（菜名 + 全部食材翻译后的小写串）。
   只有出现在这里的风味词才算「对得上」，避免被通用的 pepper / olive 抬分。
   结果按「id|菜名」缓存 —— 不要往 day 对象上挂字段，那会被 writeMenus() 一起存进本地。 */
const flavCache = new Map();
function dayFlavorText(day) {
  const key = ((day && day.id) || '') + '|' + ((day && day.title) || '');
  let s = flavCache.get(key);
  if (s === undefined) {
    let txt = trEn((day && day.title) || '');
    ((day && day.ing) || []).forEach((i) => { txt += ' ' + trEn(i.n || ''); });
    s = ' ' + txt.toLowerCase().replace(/\s+/g, ' ') + ' ';
    flavCache.set(key, s);
  }
  return s;
}

/* 这道菜的荤菜名，给界面文案与搜索词用：
   去掉括号补充，再去掉「冷冻 / 去皮 / 净肉」这类采购修饰 ——
   「白灼 冷冻南美白虾仁 做法」不如「白灼 南美白虾仁 做法」搜得准。 */
const MEAT_TRIM = /(冷冻|冰鲜|新鲜|鲜活|去皮|去骨|去壳|去刺|无刺|净肉|生重|熟重|整只|切片|切块|带皮|现杀)/g;
function proteinName(day) {
  const p = ((day && day.ing) || []).filter((i) => i.c === 'protein')[0];
  if (!p) return String((day && day.tn) || '荤菜');
  return String(p.n).replace(/[（(][^）)]*[）)]/g, '').replace(MEAT_TRIM, '').trim();
}

/* 给一张候选照片打分：<0 = 硬否决（煎炸 / 荤菜不对）；>= MEAL_MIN_SCORE 才采用。
   分值构成：基础 1 + 做法命中 4 + 风味命中 2×n(≤2) + 地中海 2 − 做法互斥 6/4 */
function scoreRealMatch(name, area, country, day) {
  const nm = ' ' + String(name || '').toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ') + ' ';
  const has = (arr) => arr.some((w) => nm.indexOf(w) !== -1);
  if (has(MEAL_REJECT)) return -1;                       // ① 零油烟否决
  const meat = MEAL_MEAT[day && day.img] || [];
  if (meat.length && !has(meat)) return -1;              // ② 荤菜必须对得上
  const tech = dayTechnique(day);
  const flav = dayFlavorText(day);
  let s = 1;
  s += 2 * Math.min(MEAL_FLAVOR.filter((w) => nm.indexOf(w) !== -1 && flav.indexOf(w) !== -1).length, 2);
  const tw = TECH_WORDS[tech];
  let techHit;
  if (tech === 'any') {
    techHit = has(Object.keys(TECH_WORDS).reduce((a, k) => a.concat(TECH_WORDS[k]), []));
  } else {
    techHit = !!tw && has(tw);
  }
  if (techHit) s += 4;                                   // ③ 做法对上了
  if (tech !== 'stew' && tech !== 'any' && has(MEAL_WET)) s -= 6;              // ④ 做法互斥
  if (tech === 'stew' && !has(MEAL_WET) && has(MEAL_DRY)) s -= 4;
  if (MEAL_MED.indexOf(String(area).toLowerCase()) !== -1 ||
      MEAL_MED_C.indexOf(String(country).toLowerCase()) !== -1) s += 2;
  return s;
}

/* 查一次 TheMealDB：按食材筛出候选，再**按做法打分**，及格的才留下。
   返回 {q, tech, list[], i}；list 为空表示没有「做法相同」的菜，
   界面会自动退回 AI 图并说明原因 —— 绝不会出现破图或空白。 */
async function lookupRealDish(day) {
  const qs = realQueries(day);
  const seen = new Set();
  const cands = [];
  let tried = 0;
  for (const q of qs) {
    if (tried >= MEAL_MAX_Q) break;
    tried++;
    let meals = [];
    try {
      const r = await fetch(MEAL_API + 'filter.php?i=' + encodeURIComponent(q));
      const j = await r.json();
      meals = (j && j.meals) || [];
    } catch (e) { continue; }        // 断网只是少一个查询词，不影响其他词
    for (const m of meals) {
      if (!m || !m.strMealThumb || seen.has(m.idMeal)) continue;
      seen.add(m.idMeal);
      cands.push({ id: m.idMeal, name: m.strMeal, thumb: m.strMealThumb,
        area: m.strArea || '', country: m.strCountry || '', q });
    }
  }
  const scored = cands
    .map((c) => ({ c, s: scoreRealMatch(c.name, c.area, c.country, day) }))
    .filter((x) => x.s >= MEAL_MIN_SCORE)
    .sort((a, b) => (b.s - a.s) || (qs.indexOf(a.c.q) - qs.indexOf(b.c.q)));
  const list = scored.slice(0, MEAL_MAX).map((x) => ({
    id: x.c.id, name: x.c.name, thumb: x.c.thumb, area: x.c.area }));
  return { q: qs[0] || '', tech: dayTechnique(day), list, i: 0 };
}

/* 补取当前选中那条的详情（YouTube 视频 + 原站链接）。
   单独取是因为 filter.php 不返回 strYoutube，而一次只展示一张，没必要全取。 */
async function lookupRealDetail(day) {
  const r = day && day.real;
  if (!r || !r.list || !r.list.length) return null;
  const pick = r.list[Math.min(r.i || 0, r.list.length - 1)];
  if (!pick) return null;
  if (r.det && r.det.id === pick.id) return r.det;     // 同一候选不再重复请求
  const det = { id: pick.id, yt: '', src: '' };
  try {
    const res = await fetch(MEAL_API + 'lookup.php?i=' + encodeURIComponent(pick.id));
    const j = await res.json();
    const m = (j && j.meals && j.meals[0]) || null;
    if (m) {
      det.yt = /^https?:\/\//.test(m.strYoutube || '') ? m.strYoutube : '';
      det.src = /^https?:\/\//.test(m.strSource || '') ? m.strSource : '';
    }
  } catch (e) { /* 取不到详情不影响看图，只是少两个按钮 */ }
  r.det = det;
  return det;
}

/* 确保当前方案每天都有真实照片。没有「做法相同」的日子 list 为空，
   由 imgUrl() 自动退回 AI 图 —— 绝不会出现破图或空白。
   只直连模式用；后端模式的图在服务端烘焙，不参与这里。 */
let realBusy = false;
async function ensureReal() {
  if (state.imgSrc !== 'real' || USE_BACKEND || realBusy) return;
  const days = (menu(state.plan) || {}).days || [];
  const need = days.filter((d) => d && !d.real);
  if (!need.length) return;
  realBusy = true;
  try {
    await Promise.all(need.map(async (d) => {
      try { d.real = await lookupRealDish(d); }
      catch (e) { d.real = { q: '', tech: dayTechnique(d), list: [], i: 0 }; }
    }));
    writeMenus();
  } finally { realBusy = false; }
  render();
}

/* 做法视频 / 图文教程的搜索深链。
   抖音、小红书**没有公开 API，且反爬严格** —— 程序化抓取既不稳定也不合规。
   所以这里给的是「搜索页深链」而不是「已抓到的某条视频」：
   点进去就是该平台针对这道菜的实时结果，永远有效、不会失效。 */
const RECIPE_PLATFORMS = [
  { k:'xhs', n:'小红书',  d:'图文笔记最多', u:(q) => 'https://www.xiaohongshu.com/search_result?keyword=' + encodeURIComponent(q) },
  { k:'dy',  n:'抖音',    d:'短视频',       u:(q) => 'https://www.douyin.com/search/' + encodeURIComponent(q) },
  { k:'bili',n:'哔哩哔哩', d:'长视频更完整', u:(q) => 'https://search.bilibili.com/all?keyword=' + encodeURIComponent(q) },
  { k:'xcf', n:'下厨房',  d:'图文步骤',     u:(q) => 'https://www.xiachufang.com/search/?keyword=' + encodeURIComponent(q) }
];
/* 搜索词必须带**做法**，不能只给食材名 ——
   用户实测「鱼做法」在小红书/抖音出来一大堆水煮鱼、红烧鱼，跟本项目的零油烟地中海完全不是一回事。
   所以拼成「主做法 具体食材 做法 零油烟 地中海」：
   ① 主做法排第一（烤 / 白灼 / 炖煮…）；② 食材用**具体名**（青花鱼，而不是「鱼」）；
   ③ 再补「零油烟 地中海」两个词，把重油做法挤下去。 */
function recipeKeyword(day) {
  const parts = [];
  const m = String((day && day.method) || '').split(/[·・]/)[0].trim();
  if (m) parts.push(m);
  const k = proteinName(day) || String((day && day.title) || '').trim();
  if (k) parts.push(k);
  parts.push('做法');
  parts.push('零油烟');
  parts.push('地中海');
  return parts.join(' ');
}

let detBusy = false;
async function ensureRealDetail() {
  if (state.imgSrc !== 'real' || USE_BACKEND || state.view !== 'day' || detBusy) return;
  const d = day(state.plan, state.dayId);
  const r = d && d.real;
  if (!r || !r.list || !r.list.length) return;
  const pick = r.list[Math.min(Math.max(r.i || 0, 0), r.list.length - 1)];
  if (!pick || (r.det && r.det.id === pick.id)) return;
  detBusy = true;
  try { await lookupRealDetail(d); writeMenus(); }
  finally { detBusy = false; }
  render();
}

/* 当前这道菜该显示哪张真实照片（没命中返回空串） */
function realPick(day) {
  const r = day && day.real;
  if (!r || !r.list || !r.list.length) return null;
  return r.list[Math.min(Math.max(r.i || 0, 0), r.list.length - 1)] || null;
}

function realMiss(day) {
  if (USE_BACKEND || state.imgSrc !== 'real') return false;
  const r = day && day.real;
  return !!r && (!r.list || !r.list.length);

function readLS() {
  try {
    const p = localStorage.getItem(LS.plan); if (p && PLANS[p]) state.plan = p;
    const m = JSON.parse(localStorage.getItem(LS.menus) || '{}'); if (m && typeof m === 'object') state.menus = m;
    const i = JSON.parse(localStorage.getItem(LS.imgs) || '{}'); if (i && typeof i === 'object') state.imgs = i;
    const av = JSON.parse(localStorage.getItem(LS.avoid) || '[]');
    if (Array.isArray(av)) state.avoid = av.filter((x) => AVOID_LABEL[x]);
    const kt = localStorage.getItem(LS.kcaltgt);
    if (kt && KCAL_BANDS.some((b) => b.k === kt)) state.kcalTarget = kt;
    state.seen = localStorage.getItem(LS.seen) === '1';
    const s = localStorage.getItem(LS.imgsrc); if (s === 'ai' || s === 'real') state.imgSrc = s;
    const c = JSON.parse(localStorage.getItem(LS.imgcache) || '{}');
    if (c && typeof c === 'object') state.imgCache = c;
  } catch (e) { /* 隐私模式下 localStorage 可能不可用，忽略即可 */ }
}
function writeMenus() { try { localStorage.setItem(LS.menus, JSON.stringify(state.menus)); } catch (e) {} }
function writeImgs()  { try { localStorage.setItem(LS.imgs,  JSON.stringify(state.imgs));  } catch (e) {} }
/* 配图缓存可能很大（data URL 一条几十 KB），单独写、单独兜底 */
function writeImgCache() {
  try { localStorage.setItem(LS.imgcache, JSON.stringify(state.imgCache)); }
  catch (e) {
    /* 多半是 localStorage 写满了 —— 把最旧的离线副本丢掉再存一次，
       链接还留着，不至于整个功能挂掉。 */
    const keys = Object.keys(state.imgCache)
      .sort((a, b) => (state.imgCache[a].t || 0) - (state.imgCache[b].t || 0));
    keys.slice(0, Math.max(1, Math.ceil(keys.length / 2)))
      .forEach((k) => { state.imgCache[k].d = ''; });
    try { localStorage.setItem(LS.imgcache, JSON.stringify(state.imgCache)); } catch (e2) {}
  }
}

  const m = menu(plan);
