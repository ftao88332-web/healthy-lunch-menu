function isFallback(plan) { return !state.menus[plan || state.plan] && !!FALLBACK[plan || state.plan]; }

function imgUrl(plan, dayId) {
  const d = day(plan, dayId);
  if (!d) return '';
  /* 直连模式 · 真实照片：命中 TheMealDB 就用它的实拍照片；
     没命中（list 为空）就往下走，自动退回 AI 图 —— 绝不出现空白。 */
  if (!USE_BACKEND && state.imgSrc === 'real') {
    const p = realPick(d);
    if (p) return p.thumb;
    /* 还在查 TheMealDB（d.real 尚未写入）→ 先返回空串显示占位图，
       避免白生成一张马上要被替换掉的 AI 图；查完没命中才落到下面的 AI 分支。 */
    if (!d.real) return '';
  }
  /* 直连模式 · AI 图：**生成菜单的那一刻配图就已经在做了**，不需要用户再点。
     地址来自本地缓存（imgCache）：有就直接显示，没有就先占位，
     由串行队列去 SiliconFlow 现生成一张再换上来。 */
  if (!USE_BACKEND) return imgUrlFor(d);
  /* 后端模式：菜单里自带 img_key，配图已随镜像烘焙在容器里，
     直接拼地址即可 —— 不走签名、不会过期、也不花钱。 */
  const rec = state.imgs[plan + ':' + dayId];
  if (rec && rec.url && Date.now() - rec.ts < IMG_TTL) return rec.url;
  if (d && d.img_key) return backendUrl('/api/image/' + d.img_key + '.png');
  return '';
}

      '为周一到周五各设计一份一人份午餐。</div>' +
      '<div class="ehint"><span>每天一个荤菜</span><span>精准到克</span>' +
      '<span>蒸煮烤凉拌 · 几乎无油烟</span><span>约 1–3 分钟</span></div>' +
      '<button class="btn" data-act="genweek">开始生成</button></div>';
  } else {
    const shown = filterDays(days);
    if (!shown.length) {
      html += '<div class="empty"><div class="et">筛选后没有符合条件的午餐</div>' +
        '<div class="ed">当前条件把 ' + days.length + ' 天全排除了，换个条件或重置。</div>' +
        '<button class="btn" data-act="freset">重置筛选</button></div>';
    } else {
      /* 传原始下标：isToday 是按「第几天」判的，不能传筛选后的序号 */
      html += '<div class="days">' + shown.map((d) => dayCard(d, days.indexOf(d))).join('') + '</div>';
      if (shown.length < days.length) {
        html += '<div class="fnote">已筛选：显示 ' + shown.length + ' / ' + days.length +
          ' 天，隐藏了 ' + (days.length - shown.length) + ' 天。' +
          '<button class="freset" data-act="freset">重置筛选</button></div>';
      }
    }
  }
  html += '</div></section>';

  /* 常驻免责说明：首次还有一次弹窗，见 legalHTML() */
  html += '<section class="sec" style="padding-top:0"><div class="wrap"><div class="disc">' +
    '<b>AI 生成菜谱仅供参考，不构成医疗或营养建议。</b>' +
    '菜谱由大模型联网检索公开做法后生成，克重与营养为估算值；' +
    '如有慢性病、孕期哺乳期或食物过敏，请先咨询医生或注册营养师再照做。</div>' +
    '</div></section>';

  $('#app').innerHTML = html;
}

function metric(v, u, l) {
  const val = (typeof v === 'number') ? (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10) : v;
  return '<div class="m"><div class="v">' + esc(val) + '<span class="u">' + u + '</span></div>' +
    '<div class="l">' + l + '</div></div>';
}

function dayCard(d, i) {
  /* data-src 只表示「AI 图地址」；还没生成好就是空串 —— 这时先挂本地占位图，
     由串行队列按 data-day 去 SiliconFlow 现生成一张再淡入。
     ⚠️ 千万别把 data-src 写成 `imgUrl(...) || thumbUrl(d)`：那样它永远非空，
     队列会以为「已经有地址了」而只加载本地占位图，配图就永远不更新。
     （显示用的 src 走 imgDisplaySrc：命中缓存就直接显示真图，一点都不闪。） */
  const src = imgUrl(state.plan, d.id);
  const isToday = i === todayIdx();
  return '<button class="day' + (isToday ? ' is-today' : '') +'" data-act="open" data-arg="' + d.id + '">' +
    '<div class="thumb"' + (thumbUrl(d) ? ' style="background-image:url(' + esc(thumbUrl(d)) + ')"' : '') + '>' +
      (thumbUrl(d) ? '<img src="' + esc(imgDisplaySrc(src, thumbUrl(d))) + '" data-src="' + esc(src) + '" data-day="' + esc(d.id) + '" alt="" loading="lazy">' : phHTML(d.type, 56)) +
      '<span class="tag">' + esc(d.tn) + '</span>' +
      (isToday ? '<span class="today">今天</span>' : '') +
    '</div>' +
    '<div class="body">' +
      '<div class="wk">' + esc(d.wk) + ' · ' + esc(d.en) + '</div>' +
      '<div class="title">' + esc(d.title) + '</div>' +
      '<div class="sub">' + esc(d.sub || '') + '</div>' +
      /* 三个关键数字：热量 / 蛋白质 / 膳食纤维。数字大、单位小、标签最弱。
         ⚠️ 做法标签的 class 必须叫 .mtag —— .tag 是左上角那个荤菜标签，
         test_web.js 有「.day .tag 恰好 5 个且顺序为 鱼,虾,鸡肉,牛肉,猪肉」的硬断言。 */
      '<div class="dstat">' +
        '<div class="s"><div class="v">' + esc(Math.round(num(d.kcal))) +
          '<span class="u">kcal</span></div><div class="l">热量</div></div>' +
        '<div class="s"><div class="v">' + esc(r1(num(d.p))) +
          '<span class="u">g</span></div><div class="l">蛋白质</div></div>' +
        '<div class="s"><div class="v">' + esc(r1(num(d.fb))) +
          '<span class="u">g</span></div><div class="l">膳食纤维</div></div>' +
      '</div>' +
      '<div class="dmeta">' +
        (d.method ? '<span class="mtag">' + esc(String(d.method).split('·')[0].trim()) + '</span>' : '') +
        /* time 是后加的字段，老菜单没有就不显示，绝不编一个数字 */
        (d.time ? '<span class="mtag time">约 ' + esc(d.time) + ' 分钟</span>' : '') +
      '</div>' +
    '</div></button>';
}

function renderDay() {
  const d = day(state.plan, state.dayId);
  if (!d) {
    $('#app').innerHTML = '<div class="wrap"><div class="empty" style="margin-top:40px">' +
      '<div class="et">没找到这一天的菜谱</div><div class="ed">请先回到首页生成五天菜单。</div>' +
      '<button class="btn" data-act="goto" data-arg="home">返回首页</button></div></div>';
    return;
  }
  /* 同 dayCard：src 只表示 AI 图地址，空串时用本地占位图顶上 */
  const src = imgUrl(state.plan, d.id);
  const serv = d.servings || COMPANY;
  const baseTotal = num(d.total_g) || (d.ing || []).reduce((s, i) => s + num(i.g), 0);
  const aiImg = !!imgUrl(state.plan, d.id);
  const real = realPick(d);          // 命中「做法相同」的 TheMealDB 菜谱时才有值，否则 null
  const realTried = realMiss(d);     // 查过了但没有同做法的 → 详情页要说明为什么用了 AI 图

  let html = '<div class="wrap">';

  html += '<div class="dbar">' +
    '<button class="back" data-act="goto" data-arg="home">' +

    'stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg> 返回菜单</button>' +
    '<span class="spacer"></span>' +
    '<button class="btn ghost sm" data-act="regen" data-arg="' + d.id + '">这道不满意？换一道</button>' +
    '</div>';

  html += '<div class="dgrid">';

  /* 左：图 + 营养 */
  html += '<div>';
  html += '<div class="dhero"' + (thumbUrl(d) ? ' style="background-image:url(' + esc(thumbUrl(d)) + ')"' : '') + '>' +
    (thumbUrl(d) ? '<img src="' + esc(imgDisplaySrc(src, thumbUrl(d))) + '" data-src="' + esc(src) + '" data-day="' + esc(d.id) + '" alt="' + esc(d.title) + '">' : phHTML(d.type, 92)) +
    '<span class="badge">' + esc(d.tn) + '</span>' +
    (real ? '<span class="ai realph">真实照片</span>' : (aiImg ? '<span class="ai">AI 生成配图</span>' : '')) + '</div>';
  /* 真实照片必须写清来源与「不是这道菜的实拍」—— 这是诚信问题，
     宁可少一点观感，也不能让用户以为这就是他中午吃的那盘。 */
  if (real) {
    html += '<div class="imgcred">真实照片来自 <b>TheMealDB</b> 的「' + esc(real.name) + '」' +
      (real.area ? '（' + esc(real.area) + '）' : '') +
      ' —— 同为「' + esc(TECH_CN[dayTechnique(d)] || '零油烟') + '」做法的相近菜品，<b>不是这道菜的实拍</b>。</div>';
  } else if (realTried) {
    /* 库里没有「做法相同」的菜（实测：烤鱼 —— 只有炖鱼、煎鱼、鱼汤）。
       与其放一张做法不对的图，不如退回 AI 图并把原因说清楚。 */
    html += '<div class="imgcred">这一天在 <b>TheMealDB</b> 里没找到「' +
      esc(TECH_CN[dayTechnique(d)] || '零油烟') + '」做法的「' + esc(proteinName(d)) +
      '」，已自动改用 AI 配图（可在「设置 → 配图来源」切回真实照片）。</div>';
  }
  /* 配图随菜单自动生成，所以这里**不再有「生成 / 换一张 AI 配图」按钮** ——
     只有「真实照片」命中多个同做法候选时，才留一个翻页按钮。 */
  if (!USE_BACKEND && real && (d.real.list || []).length > 1) {
    html += '<div class="acts"><button class="btn ghost sm" data-act="image" data-arg="' + d.id + '"' +
      (state.busy ? ' disabled' : '') + '>换一张真实照片</button></div>';
  }
  html += '<div class="secttl"><h3>本餐份数换算</h3></div>';
  html += '<div class="card serve">' +
    '<span class="lab">本餐份数</span>' +
    '<div class="stepper"><button data-act="serv" data-arg="-1">−</button>' +
    '<span class="num">' + serv + '</span><button data-act="serv" data-arg="1">＋</button></div>' +
    '<div class="quick">' +
      '<button data-act="servset" data-arg="1" class="' + (serv === 1 ? 'on' : '') + '">1 人份</button>' +
      '<button data-act="servset" data-arg="' + COMPANY + '" class="' + (serv === COMPANY ? 'on' : '') + '">' +
        COMPANY + ' 人公司餐</button>' +
    '</div>' +
    '<div class="totals">' +
      '<div>一人份总重<b>' + gfmt(baseTotal) + '</b></div>' +
      '<div>当前 ' + serv + ' 人份<b>' + (r1(baseTotal * serv / 1000)).toFixed(2) + ' kg</b></div>' +
    '</div></div>';
  html += '</div>';

  /* 右：标题 + 主厨说 */
  html += '<div class="dhead">';
  html += '<div class="wkrow"><span class="pill navy">' + esc(d.wk) + ' · ' + esc(d.en) + '</span>' +
    '<span class="pill blue">' + esc(d.method || '') + '</span>' +
    /* time 是后加的字段：老菜单（含内置保底）没有就不显示，绝不编一个数字 */
    (d.time ? '<span class="pill blue">约 ' + esc(d.time) + ' 分钟</span>' : '') +
    (isFallback(state.plan) ? '<span class="pill green">内置保底菜谱</span>' : '') + '</div>';
  html += '<h1>' + esc(d.title) + '</h1>';
  if (d.sub) html += '<div class="dsub">' + esc(d.sub) + '</div>';
  html += '<div class="tags">' + (d.tags || []).map((t) => '<span class="pill green">✓ ' + esc(t) + '</span>').join('') +
    '<span class="pill blue">全程少油烟</span></div>';
  html += '<div class="nutri">' +
    ncell(d.kcal, 'kcal', '千卡') + ncell(d.p, 'g', '蛋白质') + ncell(d.c, 'g', '碳水') +
    ncell(d.f, 'g', '脂肪') + ncell(d.fb, 'g', '膳食纤维') + '</div>';
  if (d.chef && d.chef.say) {
    html += '<div class="chefsay"><div class="ico">' +
      '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8FE0B4" stroke-width="1.7" ' +
      'stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M6 21h12M5 17h14v-4a7 7 0 0 0-14 0zM12 6V3"/></svg></div>' +
      '<div><div class="t">主厨说 · 为什么这样配</div><div class="x">' + esc(d.chef.say) + '</div></div></div>';
  }
  html += '</div>';

  html += '</div>';   /* dgrid */

  /* 食材清单 */
  html += '<div class="secttl"><h3>食材清单 · 精准到克</h3><span class="more">不满意可点「更换」</span></div>';
  html += '<div class="card ingwrap">';
  const groups = {};
  (d.ing || []).forEach((it, idx) => { (groups[it.c] = groups[it.c] || []).push(Object.assign({ idx }, it)); });
  CAT_ORDER.forEach((c) => {
    const items = groups[c];
    if (!items || !items.length) return;
    const st = CAT_STYLE[c] || CAT_STYLE.veg;
    const sub = items.reduce((s, i) => s + num(i.g), 0);
    html += '<div class="inggrp"><div class="inggt">' +
      '<span class="cico" style="background:' + st.bg + ';color:' + st.fg + '">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
      'stroke-linecap="round" stroke-linejoin="round"><path d="' + ICONS[c] + '"/></svg></span>' +
      '<span class="cn">' + st.label + '</span>' +
      '<span class="cs">小计 ' + gfmt(sub * serv) + '</span></div>';
    items.forEach((it) => {
      const rowCls = it.added ? ' added' : (it.changed ? ' changed' : '');
      html += '<div class="irow' + rowCls + '">' +
        '<div class="nm"><div class="n1">' + esc(it.n) + '</div>' +
        (it.note ? '<div class="n2">' + esc(it.note) + '</div>' : '') + '</div>' +
        /* 主数字是「当前份数下的总量」，后面跟一人份单价 —— 写「240 g ×16」容易被读成 240×16 */
        '<div class="wg">' + gfmt(num(it.g) * serv) +
          (serv !== 1 ? '<span style="color:var(--ink-3);font-size:11px;font-weight:400"> ' + gfmt(num(it.g)) + '/人</span>' : '') +
        '</div>' +
        (it.changed || it.added
          ? '<button class="sb gray" data-act="restore" data-arg="' + it.idx + '">还原</button>'
          : '<button class="sb" data-act="swap" data-arg="' + it.idx + '">更换</button>') +
        '</div>';
    });
    html += '</div>';
  });
  html += '<div class="addrow" data-act="add">＋ 添加一项自定义食材</div>';
  html += '</div>';

  /* 做法 */
  html += '<div class="secttl"><h3>详细做法</h3></div>';
  html += '<div class="card steps">' +
    '<div class="stepnote">全程蒸、煮、焯水、烤箱/空气炸锅或凉拌，出锅后再淋橄榄油，几乎不产生油烟。</div>';
  (d.steps || []).forEach((s, i) => {
    html += '<div class="step"><span class="sn">' + (i + 1) + '</span><div>' +
      '<div class="st">' + esc(s.t) + '</div><div class="sd">' + esc(s.d) + '</div></div></div>';
  });
  html += '</div>';
  if (d.chef && d.chef.ref) {
    html += '<div class="refnote">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8AA3B2" stroke-width="1.6" ' +
      'stroke-linecap="round" style="flex:none;margin-top:2px">' +
      '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>' +
      '<span>' + esc(d.chef.ref) + '；温度时间为家用烤箱参考，空气炸锅适当缩短，肉类以中心熟透为准。</span></div>';
  }

  /* 来源 */
  if ((d.sources || []).length) {
    html += '<div class="secttl"><h3>联网核对来源</h3><span class="more">' + d.sources.length + ' 条</span></div>';
    html += '<div class="card srcs">' + d.sources.map((s, i) => {
      let host = s.link;
      try { host = new URL(s.link).hostname.replace(/^www\./, ''); } catch (e) {}
      return '<a class="src" href="' + esc(s.link) + '" target="_blank" rel="noopener noreferrer">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
        'stroke-linecap="round" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg>' +
        '<span>' + esc(s.title || host) + '</span></a>';
    }).join('') + '<div class="srctip">以上为主厨本次实际检索到的公开来源，温度与时间以此为准。</div></div>';
  }

  /* 做法视频 / 图文教程 */
  html += recipeLinksHTML(d, real);

  /* 亮点 */
  if ((d.hl || []).length) {
    html += '<div class="secttl"><h3>主要营养亮点</h3></div>';
    html += '<div class="card hls">' + d.hl.map((h) => {
      const st = HL_STYLE[h.i] || HL_STYLE.veg;
      return '<div class="hl"><span class="hi" style="background:' + st[0] + ';color:' + st[1] + '">' +
        '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
        'stroke-linecap="round" stroke-linejoin="round"><path d="' + (ICONS[h.i] || ICONS.veg) + '"/></svg></span>' +
        '<div><div class="ht">' + esc(h.n) + '</div><div class="hd">' + esc(h.d) + '</div></div></div>';
    }).join('') + '</div>';
  }

  /* 免责说明贴在做法后面：用户看完菜谱正好看到，比塞在页脚有用 */
  html += '<div class="disc" style="margin-top:20px">' +
    '<b>AI 生成菜谱仅供参考，不构成医疗或营养建议。</b>' +
    '温度与时间来自联网检索的公开菜谱，请按自家灶具与食材实际状态调整；' +
    '有食物过敏史请务必自行核对配料。</div>';

  html += '<div class="acts">' +
    '<button class="btn navy" data-act="regen" data-arg="' + d.id + '">这道不满意？让 AI 换一道（联网重做）</button>' +
    '<button class="btn ghost" data-act="print" data-arg="' + d.id + '">打印菜谱</button>' +
    '<button class="btn ghost" data-act="shop">查看采购清单</button></div>';

  html += '</div>';
  $('#app').innerHTML = html;
}

function ncell(v, u, l) {
  const val = (typeof v === 'number') ? (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10) : v;
  return '<div class="n"><div class="v">' + esc(val) + '<span class="u">' + u + '</span></div>' +
    '<div class="l">' + l + '</div></div>';
}

/* ---------- 采购清单 ---------- */
/** 采购清单当前选中的天（返回实际的 day 对象数组） */
function shopPicked() {
  const all = (menu(state.plan) || {}).days || [];
  const sel = state.shopDays;
  if (!sel || !sel.length) return all;
  return all.filter((d) => sel.indexOf(d.id) >= 0);
}

/* 采购清单实际按几人份算：用户在采购页调过就用他调的，否则跟随菜单里存的份数 */
function shopServings(days) {
  if (state.shopServ != null) return state.shopServ;
  return (days && days.length) ? (days[0].servings || COMPANY) : COMPANY;
}

function shopData() {
  const m = menu(state.plan);
  const days = shopPicked();
  const serv = shopServings(days);
  const map = {};
  days.forEach((d) => {
    (d.ing || []).forEach((it) => {
      const k = it.c + '|' + it.n;
      if (!map[k]) map[k] = { c: it.c, n: it.n, note: it.note || '', per: 0, days: [] };
      map[k].per += num(it.g);
      map[k].days.push(d.wk);
    });
  });
  return { serv, items: Object.keys(map).map((k) => map[k]) };
}

function renderShop() {
  const m = menu(state.plan);
  const all = m ? (m.days || []) : [];
  const picked = shopPicked();
  const { serv, items } = shopData();
  const days = picked.length;

  let html = '<div class="wrap"><section class="sec" style="margin-top:26px">';
  html += '<div class="sec-head"><h2>采购清单</h2>' +
    '<span class="sub">' + (m ? esc(m.name || '') : '') + ' · ' + days + ' 天 · 按 ' + serv + ' 人份</span></div>';

  if (!all.length) {
    html += '<div class="empty"><div class="et">还没有菜单</div>' +
      '<div class="ed">先生成本周菜单，这里会自动汇总各天食材的采购量。</div>' +
      '<button class="btn" data-act="genweek">生成本周菜单</button></div></section></div>';
    $('#app').innerHTML = html;
    return;
  }

  /* 采购范围：只买一天、买两三天、或整周五天，都比写死整周实用。
     点星期可以任意组合，点「全周」回到全部。 */
  const allOn = !state.shopDays || !state.shopDays.length;
  html += '<div class="shoppick"><span class="sp-l">采购范围</span>';
  html += '<span class="sp-c' + (allOn ? ' on' : '') + '" data-act="shopall">全周 ' +
    all.length + ' 天</span>';
  all.forEach((d) => {
    const on = !allOn && state.shopDays.indexOf(d.id) >= 0;
    html += '<span class="sp-c' + (on ? ' on' : '') + '" data-act="shopday" data-arg="' +
      esc(d.id) + '">' + esc(d.wk) + '</span>';
  });
  html += '<span class="sp-t">' + (allOn ? '当前：全周' : '当前：' +
    esc(picked.map((d) => d.wk).join('、'))) + '</span></div>';

  /* 就餐人数：菜单是按 16 人公司餐生成的，但实际常常要按当天到岗人数买。
     这里调只影响采购量，不会改动菜谱本身。 */
  html += '<div class="shoppick"><span class="sp-l">就餐人数</span>' +
    '<div class="stepper">' +
      '<button data-act="shopserv" data-arg="-1" aria-label="减少一人">−</button>' +
      '<span class="num">' + serv + '</span>' +
      '<button data-act="shopserv" data-arg="1" aria-label="增加一人">＋</button>' +
    '</div>' +
    '<span class="sp-c' + (state.shopServ == null ? ' on' : '') +
      '" data-act="shopservset" data-arg="0">跟随菜单</span>' +
    '<span class="sp-c' + (state.shopServ === 1 ? ' on' : '') +
      '" data-act="shopservset" data-arg="1">1 人份</span>' +
    '<span class="sp-t">共 ' + serv + ' 份 · 下面的采购量按此换算</span></div>';

    html += '<div class="empty"><div class="et">没有选中任何一天</div>' +
      '<div class="ed">点上面的星期任选一天或几天，也可以点「全周」。</div></div></section></div>';

  const label = allOn ? ('全周 ' + all.length + ' 天') : picked.map((d) => d.wk).join('、');
  html += '<div class="shopnote">已按 <b>' + serv + ' 人份</b> 汇总 <b>' + esc(label) +

    '同类食材在不同天出现时会自动合并；调味料按一人份累计，实际调味可按口味增减。</div>';

    '<span class="shoptip">复制成纯文本，直接粘到微信、备忘录或买菜 App 里。</span></div>';

  CAT_ORDER.forEach((c) => {
    const list = items.filter((i) => i.c === c).sort((a, b) => b.per - a.per);

    const st = CAT_STYLE[c] || CAT_STYLE.veg;

    html += '<div class="card shopgrp"><div class="gt">' +
      '<span class="cico" style="width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:' +
      st.bg + ';color:' + st.fg + '">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
      'stroke-linecap="round" stroke-linejoin="round"><path d="' + ICONS[c] + '"/></svg></span>' +
      '<span class="cn">' + st.label + '</span><span class="cs">小计 ' +
      (r1(sub / 1000)).toFixed(2) + ' kg</span></div>';
    list.forEach((i) => {
      html += '<div class="shoprow"><span class="nm">' + esc(i.n) + '</span>' +
        '<span class="per">一人份 ' + gfmt(i.per) + ' × ' + serv + ' 份 · ' + i.days.length + ' 天用</span>' +
        '<span class="g">' + gfmt(i.per * serv) + '</span></div>';
    });
    html += '</div>';
  });
  html += '</section></div>';
  $('#app').innerHTML = html;
}

function renderLayers() {
  let html = '';

  if (state.sheet) {
    const s = state.sheet;
    const cats = [['', '全部']].concat(CAT_ORDER.filter((c) => c !== 'season')
      .map((c) => [c, (CAT_STYLE[c] || {}).label || c]));
    html += '<div class="mask" data-act="closesheet"></div><div class="sheet">';
    html += '<div class="sh"><h4>' + esc(s.title) + '</h4><p>' + esc(s.hint) + '</p></div>';
    html += '<div class="filters">' + cats.map(([k, t]) =>
      '<button data-act="sfilter" data-arg="' + k + '" class="' + (s.cat === k ? 'on' : '') + '">' + t + '</button>'
    ).join('') + '</div>';
    html += '<div class="searchbox"><input id="skw" placeholder="搜索食材，如 西兰花 / 糙米" value="' + esc(s.kw || '') + '"></div>';
    html += '<div class="slist">';
    if (!s.list.length) html += '<div style="padding:26px;text-align:center;color:var(--ink-3);font-size:13.5px">没有匹配的食材，可在下方自定义一项</div>';
    s.list.forEach((it, i) => {
      html += '<div class="srow" data-act="pick" data-arg="' + i + '">' +
        '<div class="an"><div class="a1">' + esc(it.n) + (it.rec ? '<span class="rec">AI 推荐</span>' : '') + '</div>' +
        '<div class="a2">' + esc(it.note || '') + '</div></div>' +
        '<span class="ag">' + gfmt(it.g) + '</span><span class="pk">选用</span></div>';
    });
    html += '</div>';
    html += '<div class="custom"><div class="t">没找到？自定义一项食材</div><div class="f">' +
      '<input id="cn" placeholder="食材名称" value="' + esc(s.custom ? s.custom.n : '') + '">' +
      '<input id="cg" type="number" placeholder="一人份克重(g)" style="max-width:150px" value="' +
        esc(s.custom ? s.custom.g : '') + '">' +
      '<select id="cc">' + CAT_ORDER.map((c) =>
        '<option value="' + c + '"' + (s.custom && s.custom.c === c ? ' selected' : '') + '>' +
        ((CAT_STYLE[c] || {}).label || c) + '</option>').join('') + '</select>' +
      '<button class="btn sm" data-act="custom">确认' + (s.mode === 'add' ? '添加' : '替换') + '</button>' +
      '</div></div>';
    html += '<div class="sclose" data-act="closesheet">取消</div></div>';
  }

  if (state.busy) {
    const b = state.busy;
    html += '<div class="genmask"><div class="genbox">' +
      '<h4>' + esc(b.title) + '</h4>' +
      '<div class="msg">' + esc(b.msg || '') + '</div>' +
      '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, b.pct || 0)) + '%"></i></div>' +
      '<div class="note">' + esc(b.note || '') + '</div>' +
      (b.err ? '<div class="err">' + esc(b.err) + '</div>' : '') +
      '<div class="close" data-act="closebusy">' + (b.err ? '关闭' : '后台运行，先看看别的') + '</div>' +
      '</div></div>';
  }

  /* 首次访问弹一次免责说明，点「我知道了」后写 localStorage 不再打扰 */
  if (!state.seen && !state.busy && !state.sheet) html += legalHTML();

  if (state.toast) html += '<div class="toast">' + esc(state.toast) + '</div>';
  $('#layers').innerHTML = html;

  if (state.sheet) {
    const kw = $('#skw');
    if (kw && document.activeElement !== kw) { /* 保持输入焦点 */ }
  }
}

/* 上一次渲染的视图，用来判断「这次是不是换页了」 */
let lastView = null;

function render() {
  renderChrome();
  if (state.view === 'home') renderHome();
  else if (state.view === 'day') renderDay();
  else if (state.view === 'shop') renderShop();
  else if (state.view === 'setup') renderSetup();
  else renderAbout();
  renderLayers();
  ensureReal();                     // 真实照片模式：缺图的先补齐（异步，补完自动重渲染）
  ensureRealDetail();               // 详情页：补取 YouTube / 原站链接
  queueImages();                    // 新渲染出来的配图入队，一张一张加载
  revealReadyImages();              // 缓存命中（data URL）的那些下一帧淡入，避免硬切
  /* 只有「换页」才回到顶部。切换方案、调就餐人数、改采购范围都是在同一页里
     重渲染，无条件 scrollTo(0,0) 会让用户瞬间丢失当前位置 ——
     手机上尤其难受：刚滑到下面点一下，直接被弹回顶端。 */
  if (lastView !== state.view) {
    lastView = state.view;
    window.scrollTo(0, 0);
  }
}

/* =========================================================================
   6. 业务动作
   ========================================================================= */
function busy(title, msg, pct, note) {
  state.busy = { title, msg, pct: pct || 0, note: note || '', err: '' };
  renderLayers();
  renderChrome();          // 顶栏按钮要立刻变成「正在生成…」并禁用
}
function busyMsg(msg, pct) {
  if (!state.busy) return;
  state.busy.msg = msg;
  if (pct != null) state.busy.pct = pct;
  renderLayers();
}
function busyErr(e) {
  const msg = (e && e.message) || String(e);
  /* 用户可能点了「后台运行，先看看别的」把浮层关掉 —— 这时不能再静默吞掉错误，
     否则界面上一点反馈都没有，看起来就像「点了没反应」。 */
  if (!state.busy) { toast('生成失败：' + msg.slice(0, 70)); return; }
  state.busy.err = msg;                 /* 浮层里仍然显示原始报错（测试有断言） */
  state.lastErr = humanErr(msg);        /* 关掉浮层后靠这条常驻提示兜底 */
  state.busy.title = '生成失败';
  renderLayers();
  renderChrome();
}
function busyEnd() { state.busy = null; render(); }

async function doGenWeek() {
  if (state.busy) return;
  const plan = state.plan;
  const total = DAY_PLAN.length;
  state.lastErr = null;                 /* 重新开始了，旧的失败提示先撤掉 */
  busy('AI 主厨正在设计本周菜单',
    '正在联网检索真实菜谱，核对温度与时间…', 4,
    '共 ' + total + ' 天，每天一个荤菜；每天都会先联网检索再落笔，全程约 1–3 分钟。');

  /* 后端模式下整周是一个任务，进度由后端回报，这里只负责转发到界面 */
  if (USE_BACKEND) return genWeekViaBackend(plan, total);

  const days = [];
  /* 并发上限**取决于模型**，不是账号级的（实测 2026-09-28）：
       glm-4.7        → 只有 2（发 3 个，第 3 个必 429 错误码 1302）
       glm-4.7-flash  → 很严（5 并发 5 个 429）
       glm-4.5-air    → ≥8（8 并发全部成功）
       glm-4-flash / glm-4-air → 也宽松
     所以这里**按当前模型自动决定批次**：宽松的模型 5 天一次全并行，
     受限的模型回到 2 天一批 —— 换模型时不用再手动改这里。
     注意后端模式不走这段（上面已 return）。 */
  const batch = /glm-4\.5-air|glm-4-flash|glm-4-air/.test(chatModel()) ? 5 : 2;
  try {
    for (let i = 0; i < total; i += batch) {
      const slice = DAY_PLAN.slice(i, i + batch);
      const avoid = days.map((d) => d.title).filter(Boolean);
      busyMsg('正在联网检索并设计 ' + slice.map((m) => m.wk).join('、') + ' 的午餐…',
        4 + Math.round((i / total) * 90));
      const results = await Promise.all(slice.map((meta) => generateDay(meta, plan, avoid, avoidLine())));
      results.forEach((d) => days.push(d));
      busyMsg('已完成 ' + days.length + '/' + total + ' 天', 4 + Math.round((days.length / total) * 90));
    }
    const order = {};
    DAY_PLAN.forEach((m, i) => { order[m.id] = i; });
    /* 注意：不能写 `order[a.id] || 99` —— 周一的序号是 0，会被当成假值排到最后 */
    const rank = (d) => (order[d.id] === undefined ? 99 : order[d.id]);
    days.sort((a, b) => rank(a) - rank(b));

    const old = state.menus[plan] || {};
    const oldServ = old.days && old.days[0] ? old.days[0].servings : COMPANY;
    days.forEach((d) => { d.servings = oldServ || COMPANY; });

    /* 配图必须跟着菜单一起换，否则用户会觉得「菜单重生成了但图还是老样子」：
       ① AI 图：新种子 → 缓存键变了 → 缓存未命中 → 重新生成（旧图自然被换掉）；
       ② 真实照片：把旧的匹配结果清掉，让 ensureReal() 按新菜单重查。 */
    days.forEach((d) => { d.img_seed = Math.floor(Math.random() * 1000000); delete d.real; });

    state.menus[plan] = {
      plan,
      name: (PLANS[plan] || {}).name || ('方案 ' + plan),
      desc: (PLANS[plan] || {}).desc || '',
      servings: oldServ || COMPANY,
      days
    };
    writeMenus();
    busyMsg('完成！', 100);
    setTimeout(() => { state.busy = null; state.view = 'home'; render(); toast('本周菜单已生成'); }, 420);
  } catch (e) {
    busyErr(e);
  }
}

function currentDay() { return day(state.plan, state.dayId); }

/* 后端模式：一次 POST 提交整周生成，然后轮询进度。
   好处是并发闸门、缓存、去重都在服务端，浏览器只负责显示。 */
async function genWeekViaBackend(plan, total) {
  try {
    const payload = await runJob(
      '/api/menu/' + encodeURIComponent(plan) + '/generate',
      { plan: plan, force: true },
      (j) => {
        const pct = (j.total ? 4 + Math.round((num(j.progress) / num(j.total)) * 90) : 12);
        busyMsg(j.message || '主厨正在联网检索并落笔…', Math.min(pct, 94));
      });

    const days = (payload && payload.days) || [];
    if (!days.length) throw new ApiError('后端没有返回任何菜谱，请检查服务端日志。');

    const meta = PLANS[plan] || {};
    state.menus[plan] = {
      plan,
      name: payload.name || meta.name || ('方案 ' + plan),
      desc: payload.desc || meta.desc || '',
      servings: payload.servings || COMPANY,
      days
    };
    writeMenus();
    busyMsg('完成！', 100);
    setTimeout(() => { state.busy = null; state.view = 'home'; render(); toast('本周菜单已生成'); }, 420);
  } catch (e) {
    busyErr(e);
  }
}

function saveDay(d) {
  const plan = state.plan;
  /* 用户可能在还没生成菜单时就直接改内置保底菜谱 —— 这时要先把保底数据
     克隆进 state.menus，否则 saveDay 无处可写，改动会被静默丢掉。 */
  if (!state.menus[plan] && FALLBACK[plan]) {
    state.menus[plan] = JSON.parse(JSON.stringify(FALLBACK[plan]));
  }
  const m = state.menus[plan];
  if (!m) return;
  m.days = m.days || [];
  const i = m.days.findIndex((x) => x.id === d.id);
  if (i < 0) m.days.push(d); else m.days[i] = d;
  writeMenus();
}

async function doSwap(dayObj, idx, want) {
  busy('正在更换食材', '主厨正在联网核对替代食材的营养当量…', 30,
    '换一样食材会连带重算整道菜的热量与营养素。');
  try {
    /* 后端模式：归一化、营养护栏、克重折算都在服务端做完了，前端只负责落库 */
    if (USE_BACKEND) return await swapViaBackend(dayObj, idx, want);

    const target = dayObj.ing[idx];
    const user = buildSwapPrompt(dayObj, target, want || '');
    const r = await chatJson(PROMPTS.swapSystem, user, { search:true });
    const data = r.json || {};

    const ni = (data.ing && typeof data.ing === 'object' && !Array.isArray(data.ing)) ? data.ing : {};
    const cat = normCat(ni.c || target.c);
    const rg = GRAM_RANGE[cat] || [1, 300];
    let g = num(ni.g) || target.g;
    g = Math.max(rg[0], Math.min(rg[1], g));
    const name = String(ni.n || target.n).trim();

    const replaced = {
      c: cat, n: name, g: r1(g),
      note: String(ni.note || '已按你的要求更换').trim(),
      alt: cleanAlt(ni.alt, cat), changed: true
    };

    const ings = dayObj.ing.map((x, i) => (i === idx ? replaced : Object.assign({}, x)));
    const steps = (dayObj.steps || []).map((s) => Object.assign({}, s));
    for (const p of (data.steps_patch || [])) {
      if (!p || typeof p !== 'object') continue;
      const pi = Math.round(num(p.index)) - 1;
      const dd = String(p.d || '').trim();
      if (dd && pi >= 0 && pi < steps.length) steps[pi].d = dd;
    }

    const updated = Object.assign({}, dayObj);
    updated.ing = ings;
    updated.steps = steps;
    const oldTotal = (dayObj.ing || []).reduce((s, i) => s + num(i.g), 0) || 1;
    const newTotal = ings.reduce((s, i) => s + num(i.g), 0) || 1;
    updated.total_g = r1(newTotal);

    /* 护栏：模型偶尔把 macros 写成「被换那样食材」的营养而不是整道菜合计。
       超出合理区间就按总重比例回退，避免脏数据。 */
    const mac = (data.macros && typeof data.macros === 'object') ? data.macros : {};
    const TOL = { kcal:[0.65,1.55], p:[0.45,1.9], c:[0.4,2.0], f:[0.3,2.2], fb:[0.3,2.5] };
    let ok = 0;
    for (const k of Object.keys(TOL)) {
      const o = num(dayObj[k]);
      if (o <= 0) continue;
      const n = num(mac[k]);
      if (n <= 0 || n < TOL[k][0] * o || n > TOL[k][1] * o) { ok = -1; break; }
      ok++;
    }
    /* 换食材的理由**每次都要重写**：updated 是从原 day 复制来的，
       这次不覆盖的话，界面上会显示上一道菜留下的旧理由（实测踩过）。 */
    const reason = String(data.reason || '').trim();
    if (ok >= 2) {
      ['kcal','p','c','f','fb'].forEach((k) => {
        if (mac[k] != null) updated[k] = (k === 'kcal') ? Math.round(num(mac[k])) : r1(num(mac[k]));
      });
      if (reason) updated.swap_note = reason + '（营养按模型给的合计值）';
      else delete updated.swap_note;
    } else {
      const ratio = newTotal / oldTotal;
      ['kcal','p','c','f','fb'].forEach((k) => {
        const base = num(dayObj[k]);
        updated[k] = (k === 'kcal') ? Math.round(base * ratio) : r1(base * ratio);
      });
      if (reason) updated.swap_note = reason + '（营养已按食材总重比例重算）';
      else delete updated.swap_note;
    }

    const srcs = collectSources({}, r.sources);
    if (srcs.length) updated.sources = srcs;

    /* 菜变了，原来的配图就对不上了 —— 清掉，下次重新生成 */
    delete state.imgs[state.plan + ':' + dayObj.id];
    writeImgs();

    saveDay(updated);
    state.busy = null;
    render();
    toast('已换成「' + name + '」' + (updated.swap_note ? ' · ' + updated.swap_note.slice(0, 40) : ''));
  } catch (e) {
    busyErr(e);
  }
}

/* 后端模式换食材：POST /api/swap → 轮询 → job.result = {day, note} */
async function swapViaBackend(dayObj, idx, want) {
  const res = await runJob('/api/swap', {
    plan: state.plan, day_id: dayObj.id, ing_index: idx, want: want || ''
  }, (j) => { busyMsg(j.message || '主厨正在联网核对替代食材…', 45); });

  const updated = res && res.day;
  if (!updated || !updated.ing) throw new ApiError('后端没有返回更换后的菜谱。');

  /* 菜变了，原来的配图就对不上了 —— 清掉，下次重新生成 */
  delete state.imgs[state.plan + ':' + dayObj.id];
  writeImgs();

  saveDay(updated);
  state.busy = null;
  render();
  const name = (updated.ing[idx] || {}).n || '新食材';
  const note = updated.swap_note || (res && res.note) || '';
  toast('已换成「' + name + '」' + (note ? ' · ' + String(note).slice(0, 40) : ''));
}

function doRestore(idx) {
  const d = currentDay();
  if (!d) return;
  /* 从当前方案的保底数据里取回原始值；若本来就是 AI 生成的，则退回内置同一天的原始食材 */
  const fb = FALLBACK[state.plan];
  const base = fb && (fb.days || []).find((x) => x.id === d.id);
  const orig = base && (base.ing || [])[idx];
  if (!orig) { toast('找不到原始食材，可点「换一道」整日重做'); return; }
  const ings = d.ing.map((x, i) => (i === idx ? Object.assign({}, orig) : Object.assign({}, x)));
  const nd = Object.assign({}, d, { ing: ings });
  nd.total_g = r1(ings.reduce((s, i) => s + num(i.g), 0));
  saveDay(nd);
  render();
  toast('已还原为「' + orig.n + '」');
}

async function doRegen(id) {
  const d = day(state.plan, id);
  if (!d || state.busy) return;
  const meta = DAY_PLAN.find((m) => m.id === d.id);
  if (!meta) { toast('找不到这一天的荤菜配置'); return; }
  busy('正在换一道新菜', '主厨正在联网检索「' + d.tn + '」的其他做法…', 35,
    '会避开原来的菜名，并重新联网核对温度与时间。');
  try {
    if (USE_BACKEND) return await regenViaBackend(d, id);

    const avoid = (menu(state.plan).days || []).map((x) => x.title).filter(Boolean);
    if (d.title && avoid.indexOf(d.title) < 0) avoid.push(d.title);
    const user = buildRegenPrompt(meta, d.title || '', '', (PLANS[state.plan] || {}).style || '', avoid, COMPANY, avoidLine());
    const r = await chatJson(PROMPTS.chefSystem, user, { search:true });
    const nd = normalizeDay(r.json, meta, state.plan, r.sources);
    nd.servings = d.servings || COMPANY;
    /* 换了菜，配图也得跟着换：发新种子（缓存键随之改变，旧图自动作废）+ 清掉后端模式的旧记录 */
    nd.img_seed = Math.floor(Math.random() * 1000000);
    delete state.imgs[state.plan + ':' + id];
    writeImgs();
    saveDay(nd);
    state.busy = null;
    render();
    toast('已换成「' + nd.title + '」');
  } catch (e) {
    busyErr(e);
  }
}

/* 后端模式整日重做：POST /api/regenerate-day → 轮询 → job.result = {day, warnings} */
async function regenViaBackend(d, id) {
  const res = await runJob('/api/regenerate-day', {
    plan: state.plan, day_id: id, feedback: ''
  }, (j) => { busyMsg(j.message || '主厨正在联网检索新做法…', 60); });

  writeImgs();
  saveDay(nd);

}

async function doImage(id) {
  const d = day(state.plan, id);
  if (!d || state.busy) return;

  /* 直连模式 · 真实照片：在候选里往后翻一张（TheMealDB 里同为这个做法的其它菜品）。
     真实照片是查出来的、不是生成的，所以「换一张」= 换候选，瞬间完成。 */
  if (!USE_BACKEND && state.imgSrc === 'real' && realPick(d)) {
    const list = (d.real && d.real.list) || [];
    if (list.length <= 1) { toast('这个做法只匹配到一张真实照片，可在「设置」里切回 AI 配图'); return; }
    d.real.i = ((d.real.i || 0) + 1) % list.length;
    delete d.real.det;                 // 换了候选，YouTube / 原站链接要重取
    writeMenus();
    render();
    toast('已换成「' + (list[d.real.i].name || '另一张') + '」');
    return;
  }

  /* 直连模式的 AI 配图已经随菜单自动生成，页面上没有对应的按钮 —— 走到这里直接返回。 */
  if (!USE_BACKEND) return;

  busy('正在生成配图', '按这道菜的食材与做法生成图片，约需 8–10 秒…', 40,
    '使用免费图像模型 ' + IMG_MODEL + '，不额外计费。');
  try {
    const res = await runJob('/api/image/one',
      { plan: state.plan, day_id: id, force: true },
      (j) => { busyMsg(j.message || 'AI 正在按菜名与食材作画…', 60); });
    const raw = (res && (res.url || (res.img_key ? '/api/image/' + res.img_key + '.png' : ''))) || '';
    const url = backendUrl(raw);
    if (!url) throw new ApiError('后端没有返回图片地址。');
    state.imgs[state.plan + ':' + id] = { url, ts: Date.now() };
    writeImgs();
    state.busy = null;
    render();
    toast(res && res.cached ? '已命中缓存，直接显示' : '配图已生成');
  } catch (e) {
    busyErr(e);
  }
}

function openSwapSheet(idx) {
  const d = currentDay();
  if (!d) return;
  const it = d.ing[idx];
  const cat = it.c === 'season' ? 'veg' : it.c;
  const alts = (it.alt || []).map((a) => ({ n: a[0], g: a[1], note: a[2], rec: true }));
  const names = new Set(alts.map((a) => a.n));
  const libs = (LIB[cat] || []).filter((x) => !names.has(x[0]))
    .map((x) => ({ n: x[0], g: x[1], note: x[2], rec: false }));
  state.sheet = {
    mode: 'swap', dayId: d.id, idx, cat, kw: '', custom: null,
    title: '更换「' + it.n + '」',
    hint: '选一个替代食材，主厨会联网核对并按营养当量折算克重。AI 推荐在前，下面是同类别的高营养密度食材。',
    list: alts.concat(libs)
  };
  renderLayers();
}

function openAddSheet() {
  const d = currentDay();
  if (!d) return;
  state.sheet = {
    mode: 'add', dayId: d.id, idx: -1, cat: 'veg', kw: '', custom: null,
    title: '添加一项自定义食材',
    hint: '直接加进这份菜谱，克重按一人份填写；不会调用 AI。',
    list: CAT_ORDER.filter((c) => c !== 'season')
      .reduce((acc, c) => acc.concat((LIB[c] || []).map((x) => ({ n: x[0], g: x[1], note: x[2], rec: false }))), [])
  };
  renderLayers();
}

function filterSheetList() {
  const s = state.sheet;
  if (!s) return;
  const kw = (s.kw || '').trim().toLowerCase();
  let all;
  if (s.mode === 'swap') {
    const d = currentDay();
    const it = d ? d.ing[s.idx] : null;
    const cat = s.cat || (it ? it.c : 'veg');
    const alts = it ? (it.alt || []).map((a) => ({ n:a[0], g:a[1], note:a[2], rec:true })) : [];
    const names = new Set(alts.map((a) => a.n));
    const libs = (LIB[cat === 'season' ? 'veg' : cat] || []).filter((x) => !names.has(x[0]))
      .map((x) => ({ n:x[0], g:x[1], note:x[2], rec:false }));
    all = alts.concat(libs);
  } else {
    const cats = s.cat ? [s.cat] : CAT_ORDER.filter((c) => c !== 'season');
    all = cats.reduce((acc, c) => acc.concat((LIB[c] || []).map((x) => ({ n:x[0], g:x[1], note:x[2], rec:false }))), []);
  }
  s.list = kw ? all.filter((x) => x.n.toLowerCase().indexOf(kw) >= 0 || (x.note || '').toLowerCase().indexOf(kw) >= 0) : all;
}

function pickFromSheet(i) {
  const s = state.sheet;
  if (!s) return;
  const item = s.list[i];
  if (!item) return;
  const d = currentDay();
  if (!d) return;
  if (s.mode === 'add') {
    const rg = GRAM_RANGE[s.cat] || [1, 300];
    const g = Math.max(rg[0], Math.min(rg[1], item.g));
    const nd = Object.assign({}, d);
    nd.ing = d.ing.concat([{ c: s.cat, n: item.n, g: r1(g), note: item.note || '', alt: [], added: true }]);
    nd.total_g = r1(nd.ing.reduce((x, y) => x + num(y.g), 0));
    state.sheet = null;
    saveDay(nd);
    render();
    toast('已添加「' + item.n + '」');
  } else {
    const idx = s.idx;
    state.sheet = null;
    renderLayers();
    doSwap(d, idx, item.n);
  }
}

function customFromSheet() {
  const s = state.sheet;
  if (!s) return;
  const n = ($('#cn') || {}).value ? $('#cn').value.trim() : '';
  const g = num(($('#cg') || {}).value);
  const c = ($('#cc') || {}).value || s.cat || 'veg';
  if (!n) { toast('请填写食材名称'); return; }
  if (g <= 0) { toast('请填写一人份克重'); return; }
  const d = currentDay();
  if (!d) return;

  if (s.mode === 'add') {
    const rg = GRAM_RANGE[c] || [1, 300];
    const nd = Object.assign({}, d);
    nd.ing = d.ing.concat([{ c, n, g: r1(Math.max(rg[0], Math.min(rg[1], g))),
      note: '自定义添加', alt: [], added: true }]);
    nd.total_g = r1(nd.ing.reduce((x, y) => x + num(y.g), 0));
    state.sheet = null;
    saveDay(nd);
    render();
    toast('已添加「' + n + '」');
  } else {
    const idx = s.idx;
    state.sheet = null;
    renderLayers();
    doSwap(d, idx, n + '（一人份 ' + g + 'g）');
  }
}

function changeServ(delta) {
  const d = currentDay();
  if (!d) return;
  const cur = d.servings || COMPANY;
  const next = Math.max(1, Math.min(99, cur + delta));

}

/* 忌口与过敏源。荤菜类按 day.type 判，食材类按名字扫。 */
const AVOID_OPTS = [
  { k:'beef',    t:'不吃牛肉' },
  { k:'pork',    t:'不吃猪肉' },
  { k:'chicken', t:'不吃鸡肉' },
  { k:'seafood', t:'不吃海鲜' },
  { k:'shrimp',  t:'不吃虾' },
  { k:'nuts',    t:'坚果过敏' },
  { k:'dairy',   t:'乳制品过敏' },
  { k:'gluten',  t:'麸质过敏' }
];
const AVOID_LABEL = { beef:'牛肉', pork:'猪肉', chicken:'鸡肉', seafood:'海鲜', shrimp:'虾',
                      nuts:'坚果', dairy:'乳制品', gluten:'麸质' };
/* 只有「过敏源」才扫食材名；肉类别直接看 day.type */
const AVOID_PAT = {
  nuts:   /核桃|杏仁|腰果|榛子|松子|开心果|南瓜籽|葵花籽|芝麻|亚麻籽|奇亚籽|巴旦木|花生/,
  dairy:  /奶酪|酸奶|牛奶|黄油|芝士|菲达|帕玛森|茅屋|马苏里拉/,
  gluten: /意面|面包|大麦|燕麦|小麦|全麦| couscous/i
};
const MEAT_TYPES = ['fish', 'shrimp', 'chicken', 'beef', 'pork'];
const KCAL_BANDS = [
  { k:'all',     t:'不限热量' },
  { k:'lt600',   t:'< 600',      lo:0,   hi:600 },
  { k:'600-700', t:'600–700',    lo:600, hi:700 },
  { k:'gt700',   t:'> 700',      lo:700, hi:1e9 }
];

/* 这一天撞上了哪几条忌口（空数组 = 安全） */
function avoidHits(d) {
  const av = state.avoid || [];
  if (!av.length || !d) return [];
  const hits = [];
  av.forEach((k) => {
    if (k === 'seafood') {
      if (d.type === 'fish' || d.type === 'shrimp') hits.push('海鲜');
      return;
    }
    if (MEAT_TYPES.indexOf(k) >= 0) {
      if (d.type === k) hits.push(AVOID_LABEL[k]);
      return;
    }
    const pat = AVOID_PAT[k];
    if (pat && (d.ing || []).some((i) => pat.test(String(i.n || '')))) hits.push(AVOID_LABEL[k]);
  });
  return hits;
}

/* 生成菜单时塞进提示词的忌口说明；没有忌口时返回空串（保证 buildDayPrompt 逐字比对不受影响） */
function avoidLine() {
  const av = state.avoid || [];
  if (!av.length) return '';
  return '【忌口与过敏源 · 必须完全避开】' + av.map((k) => AVOID_LABEL[k]).join('、') +
    '。任何食材、替代项、调味料里都不允许出现它们。\n';
}

/* ---- 生成失败：把原始报错翻译成人话 + 首页常驻提示条 ---- */
/* ⚠️ 只用于「给用户看的那一份」。state.busy.err 里仍然存**原始报错** ——
   test_web.js / test_web_backend.js 都有针对原始文案（429 / 超时 / BACKEND_BASE…）
   的断言，改这里不要顺手把 busy.err 也改成人话。 */
function humanErr(raw) {
  const m = String(raw == null ? '' : raw);
  if (/429|并发|限流|too many|rate ?limit/i.test(m)) {
    return 'AI 服务当前请求过多（429），自动退避重试后仍然失败。等 1–2 分钟再点一次通常就好。';
  }
  if (/401|403|unauthor|invalid.*key|key.*invalid|密钥|Key 无效/i.test(m)) {
    return 'API Key 无效或已过期。请到「设置」里更新 Key，再重新生成。';
  }
  if (/timeout|超时|abort|timed out/i.test(m)) {
    return '请求超时了（网络慢，或模型在排队）。可以直接重试，也可以换一个更快的模型。';
  }
  if (/failed to fetch|networkerror|network error|网络|ERR_|offline/i.test(m)) {
    return '连不上 AI 服务。检查一下网络或代理，然后重试。';
  }
  if (/unexpected token|JSON|parse/i.test(m)) {
    return 'AI 返回的内容格式不对（偶发情况）。直接重试即可。';
  }
  return m.slice(0, 180);
}

/* ---- 筛选（纯展示层：只影响看什么，不改菜谱本身）---- */
function filterDays(days) {
  const band = KCAL_BANDS.filter((b) => b.k === state.fKcal)[0] || KCAL_BANDS[0];
  return days.filter((d) => {
    if (state.fMeat && state.fMeat !== 'all' && d.type !== state.fMeat) return false;
    if (band.k !== 'all') {
      const k = num(d.kcal);
      if (!(k >= band.lo && k < band.hi)) return false;
    }
    if (state.hideAvoid && avoidHits(d).length) return false;
    return true;
  });
}

/* ---- 复制购物清单 ---- */
function shopText() {
  const { serv, items } = shopData();
  const picked = shopPicked();
  const all = (menu(state.plan) || {}).days || [];
  const allOn = !state.shopDays || !state.shopDays.length;
  const label = allOn ? ('全周 ' + all.length + ' 天') : picked.map((d) => d.wk).join('、');
  const lines = ['健康午餐 · 采购清单（' + label + ' · ' + serv + ' 人份）', ''];
  CAT_ORDER.forEach((c) => {
    const list = items.filter((i) => i.c === c).sort((a, b) => b.per - a.per);
    if (!list.length) return;
    lines.push('【' + ((CAT_STYLE[c] || {}).label || c) + '】');
    list.forEach((i) => lines.push('  ' + i.n + '  ' + gfmt(i.per * serv)));
    lines.push('');
  });
  const grand = items.reduce((s, i) => s + i.per * serv, 0);
  lines.push('合计约 ' + (r1(grand / 1000)).toFixed(2) + ' kg');
  return lines.join('\n');
}

function doCopyShop() {
  const txt = shopText();
  const done = () => toast('采购清单已复制，可直接粘到微信 / 备忘录 / 买菜 App');
  const fail = () => toast('复制失败，请手动长按选择文字');
  /* ⚠️ file:// 下 navigator.clipboard 常常不可用（不是安全上下文），
     所以必须留一条 execCommand 兜底 —— 否则双击打开的页面永远复制不了。 */
  const legacy = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, txt.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) done(); else fail();
    } catch (e) { fail(); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, legacy);
  } else legacy();
}

/* =========================================================================
   7. 事件
   ========================================================================= */
document.addEventListener('click', function (ev) {
  const el = ev.target.closest ? ev.target.closest('[data-act],[data-nav]') : null;
  if (!el) return;

  const nav = el.getAttribute('data-nav');
  if (nav) {
    if (nav === 'shop' || nav === 'about' || nav === 'home' || nav === 'setup') {
      state.view = nav; state.dayId = null; render();
    }
    return;
  }

  const act = el.getAttribute('data-act');
  const arg = el.getAttribute('data-arg');
  if (!act) return;

  switch (act) {
    case 'genweek':
      if (!state.busy) doGenWeek();
      break;
    case 'plan':
      if (arg && arg !== state.plan) { state.plan = arg; writePlan(); render(); }
      break;
    case 'open':
      state.dayId = arg; state.view = 'day'; render();
      break;
    case 'goto':
      state.view = arg; if (arg !== 'day') state.dayId = null; render();
      break;
    case 'today': {
      const ds = (menu(state.plan) || {}).days || [];
      if (!ds.length) { toast('还没有菜单，先生成一份吧'); break; }
      const t = ds[Math.min(todayIdx(), ds.length - 1)];
      state.dayId = t.id; state.view = 'day'; render();
      break;
    }
    case 'print':
      doPrint(arg || state.dayId);
      break;
    case 'copyshop':
      doCopyShop();
      break;
    case 'clearerr':
      state.lastErr = null; render();
      break;
    case 'fmeat':
      state.fMeat = arg || 'all'; render();
      break;
    case 'fkcal':
      state.fKcal = arg || 'all'; render();
      break;
    case 'favoid':
      state.hideAvoid = !state.hideAvoid; render();
      break;
    case 'freset':
      state.fMeat = 'all'; state.fKcal = 'all'; state.hideAvoid = false; render();
      break;
    case 'seenok':
      state.seen = true;
      try { localStorage.setItem(LS.seen, '1'); } catch (e) {}
      renderLayers();
      break;
    case 'image':
      doImage(arg);
      break;
    case 'regen':
      doRegen(arg);
      break;
    case 'serv':
      changeServ(parseInt(arg, 10) || 0);
      break;
    case 'servset':
      setServ(parseInt(arg, 10) || 1);
      break;
    case 'swap':
      openSwapSheet(parseInt(arg, 10));
      break;
    case 'add':
      openAddSheet();
      break;
    case 'restore':
      doRestore(parseInt(arg, 10));
      break;
    case 'closesheet':
      if (ev.target === el || el.classList.contains('sclose')) { state.sheet = null; renderLayers(); }
      break;
    case 'sfilter':
      if (state.sheet) { state.sheet.cat = arg; state.sheet.kw = ''; filterSheetList(); renderLayers(); }
      break;
    case 'pick':
      pickFromSheet(parseInt(arg, 10));
      break;
    case 'custom':
      customFromSheet();
      break;
    case 'closebusy':
      state.busy = null; render();
      break;
    case 'savset': {
      const k = ($('#k') || {}).value;
      const m = ($('#m') || {}).value;
      const is = ($('#is') || {}).value;
      const ik = ($('#ik') || {}).value;
      const im = ($('#im') || {}).value;
      const kt = ($('#kt') || {}).value;
      const av = $$('input[name="avoid"]:checked').map((x) => x.value);
      try {
        if (k != null) { if (k.trim()) localStorage.setItem(LS.key, k.trim()); else localStorage.removeItem(LS.key); }
        if (m) localStorage.setItem(LS.model, m);
        if (is === 'ai' || is === 'real') localStorage.setItem(LS.imgsrc, is);
        if (ik != null) { if (ik.trim()) localStorage.setItem(LS.imgkey, ik.trim()); else localStorage.removeItem(LS.imgkey); }
        if (im) localStorage.setItem(LS.imgmodel, im);
        if (kt) localStorage.setItem(LS.kcaltgt, kt);
        localStorage.setItem(LS.avoid, JSON.stringify(av));
      } catch (e) {}
      if (is === 'ai' || is === 'real') state.imgSrc = is;
      if (kt) state.kcalTarget = kt;
      state.avoid = av;
      render();
      toast(av.length
        ? ('已保存，生成新菜单时会避开：' + av.map((x) => AVOID_LABEL[x]).join('、'))
        : (state.imgSrc === 'real' ? '已切到真实照片，正在按食材匹配…' : '设置已保存'));
      break;
    }
    case 'testkey':
      if (!state.busy) testKey();
      break;
    case 'clearmenu':
      delete state.menus[state.plan];
      writeMenus();
      render();
      toast('已清除，当前显示内置保底菜谱');
      break;
    case 'shop':
      state.view = 'shop'; render();
      break;
    /* 采购范围：点星期切换选中；把最后一天取消掉时自动回到「全周」，
       避免出现「一天都没选」的空清单。 */
    case 'shopday': {
      const id = el.getAttribute('data-arg');
      const allOn = !state.shopDays || !state.shopDays.length;
      /* 「全周」状态下所有星期都渲染成未选中，这时点一个应该是「只看这一天」，
         而不是「从五天里去掉这一天」—— 后者和界面显示的选中态对不上，
         用户点了会觉得莫名其妙少了一天。 */
      const cur = allOn ? [id] : state.shopDays.slice();
      if (!allOn) {
        const i = cur.indexOf(id);
        if (i >= 0) cur.splice(i, 1); else cur.push(id);
      }
      state.shopDays = cur.length ? cur : null;
      render();
      break;
    }
    case 'shopall':
      state.shopDays = null; render();
      break;
    /* 就餐人数：只改采购量，不动菜谱本身 */
    case 'shopserv': {
      const cur = shopServings(shopPicked());
      const next = Math.max(1, Math.min(999, cur + parseInt(el.getAttribute('data-arg'), 10)));
      state.shopServ = next;
      render();
      break;
    }
    case 'shopservset': {
      const v = parseInt(el.getAttribute('data-arg'), 10);
      state.shopServ = v > 0 ? v : null;      // 0 = 跟随菜单里存的份数
      render();
      break;
    }
    default: break;
  }
});

/* 弹层里的输入框：失焦时把值写回 state，避免重渲染丢字 */
document.addEventListener('input', function (ev) {
  const id = ev.target && ev.target.id;
  if (!state.sheet) return;
  if (id === 'skw') { state.sheet.kw = ev.target.value; filterSheetList(); renderSheetListOnly(); }
  if (id === 'cn' || id === 'cg' || id === 'cc') {
    state.sheet.custom = state.sheet.custom || {};
    if (id === 'cn') state.sheet.custom.n = ev.target.value;
    if (id === 'cg') state.sheet.custom.g = ev.target.value;
    if (id === 'cc') state.sheet.custom.c = ev.target.value;
  }
});

/* 搜索时只重画列表，不重画整个弹层（否则输入框会失焦） */
function renderSheetListOnly() {
  const s = state.sheet;
  if (!s) return;
  const box = document.querySelector('.slist');
  if (!box) return;
  box.innerHTML = s.list.length
    ? s.list.map((it, i) =>
        '<div class="srow" data-act="pick" data-arg="' + i + '">' +
        '<div class="an"><div class="a1">' + esc(it.n) + (it.rec ? '<span class="rec">AI 推荐</span>' : '') + '</div>' +
        '<div class="a2">' + esc(it.note || '') + '</div></div>' +
        '<span class="ag">' + gfmt(it.g) + '</span><span class="pk">选用</span></div>').join('')
    : '<div style="padding:26px;text-align:center;color:var(--ink-3);font-size:13.5px">没有匹配的食材，可在下方自定义一项</div>';
}

/* =========================================================================
   8. 启动
   ========================================================================= */
readLS();

/* 只读版：给 body 挂个 class，剩下的交给 CSS。
   不用「遍历 DOM 删按钮」是因为这些按钮每次 render() 都会重新生成，
   删了下次还会冒出来；CSS 选择器对动态内容天然免疫。 */
if (READONLY) document.body.classList.add('readonly');

/* 老浏览器缺关键 API 时也直接说清楚 —— 否则整页看起来正常，但按钮全点不动，
   用户完全无从判断。放在最前面，比让功能一个个静默失效好得多。 */
const MISSING_API = ['fetch', 'AbortController', 'Promise', 'URLSearchParams']
  .filter((k) => typeof window[k] === 'undefined');
if (MISSING_API.length) {
  document.getElementById('app').innerHTML =
    '<div class="wrap"><section class="sec" style="margin-top:44px">' +
    '<div class="card ab"><h4>浏览器版本过低</h4><ul>' +
    '<li>当前浏览器缺少：<b>' + esc(MISSING_API.join('、')) + '</b>，无法运行本页。</li>' +
    '<li class="bad">请用 <b>Chrome</b> 或 <b>Edge</b> 打开（版本 88 以上都可以）。</li>' +
    '<li>如果用的是双核浏览器（360、QQ、搜狗等），请在地址栏右侧切到<b>极速模式</b>，不要用兼容模式。</li>' +
    '</ul></div></section></div>';
  return;
}

/* data.js 没加载成功就直说 —— 只把 index.html 一个文件发出去时最容易遇到。
   不给提示的话，页面看起来「打开了」，但所有按钮都点不动，用户完全无从排查。 */
if (!window.WEB_DATA) {
  document.getElementById('app').innerHTML =
    '<div class="wrap"><section class="sec" style="margin-top:44px">' +
    '<div class="card ab"><h4>数据文件没有加载成功</h4><ul>' +
    '<li>本页需要同目录下的 <code class="mono">data.js</code> 和 <code class="mono">assets/</code> 目录。</li>' +
    '<li>请确认 <code class="mono">index.html</code>、<code class="mono">data.js</code>、' +
    '<code class="mono">assets/</code> 三个都在<b>同一个文件夹</b>里。</li>' +
    '<li class="bad">只把 index.html 单独发出去，就会是这个结果 —— 要整个文件夹一起发。</li>' +
    '<li>文件都在的话，换个浏览器（Chrome / Edge）试试，或检查插件是否拦截了本地脚本。</li>' +
    '</ul></div></section></div>';
  return;
}

if (!menu(state.plan)) {
  const ks = Object.keys(FALLBACK);
  if (ks.length) state.plan = ks[0];
}
render();

/* 后端模式：容器镜像里通常已经烘焙好方案 A/B 的菜单和配图。
   打开就先拉一次 —— 新访客不花任何 API 额度，直接看到完整菜单和配图。 */
if (USE_BACKEND) syncFromBackend();

async function syncFromBackend() {
  for (const p of Object.keys(PLANS)) {
    if (state.menus[p] && (state.menus[p].days || []).length) continue;   // 本地已有，不覆盖
    try {
      const m = await request('/api/menu/' + encodeURIComponent(p), 'GET', null, 30000);
      if (!m || !(m.days || []).length) continue;
      state.menus[p] = {
        plan: p,
        name: m.name || (PLANS[p] || {}).name || ('方案 ' + p),
        desc: m.desc || (PLANS[p] || {}).desc || '',
        servings: m.servings || COMPANY,
        days: m.days
      };
      writeMenus();
      if (state.view === 'home' || state.view === 'day') render();
    } catch (e) {
      /* 静默失败：拉不到就继续用内置保底菜谱，不影响使用 */
    }
  }
}
